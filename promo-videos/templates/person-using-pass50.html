<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PASS50 Promo — Utilisation</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg0: #050705;
    --bg1: #0b120b;
    --lime: #b7ff00;
    --text: #f4f7f1;
    --muted: #9da79b;
    --skin: #c68642;
    --skin-deep: #8d5524;
    --shirt: #1a221a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: var(--bg0);
    color: var(--text);
    font-family: Manrope, "Segoe UI", sans-serif;
  }
  .stage {
    position: relative;
    width: 1080px;
    height: 1920px;
    background:
      radial-gradient(ellipse 80% 50% at 50% 18%, rgba(183,255,0,.16), transparent 55%),
      radial-gradient(ellipse 70% 40% at 70% 85%, rgba(30,229,255,.08), transparent 50%),
      linear-gradient(180deg, #071007 0%, #050705 45%, #0a100a 100%);
    overflow: hidden;
  }
  .grain {
    pointer-events: none;
    position: absolute;
    inset: 0;
    opacity: .07;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    mix-blend-mode: overlay;
  }

  .brand {
    position: absolute;
    top: 72px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 5;
    opacity: 0;
    transform: translateY(18px);
    animation: riseIn .7s cubic-bezier(.22,.8,.24,1) .15s forwards;
  }
  .brand .word {
    font-family: "Archivo Black", Impact, sans-serif;
    font-size: 92px;
    letter-spacing: -4px;
    line-height: 1;
  }
  .brand .word .fifty { color: var(--lime); }
  .brand .tag {
    margin-top: 10px;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .caption {
    position: absolute;
    left: 64px;
    right: 64px;
    bottom: 110px;
    z-index: 6;
    text-align: center;
  }
  .caption h1 {
    font-family: "Archivo Black", Impact, sans-serif;
    font-size: 54px;
    line-height: 1.05;
    letter-spacing: -1.5px;
    opacity: 0;
    transform: translateY(16px);
    animation: riseIn .65s cubic-bezier(.22,.8,.24,1) .55s forwards;
  }
  .caption h1 em {
    font-style: normal;
    color: var(--lime);
  }
  .caption p {
    margin-top: 16px;
    font-size: 28px;
    font-weight: 700;
    color: var(--muted);
    opacity: 0;
    transform: translateY(12px);
    animation: riseIn .65s cubic-bezier(.22,.8,.24,1) .85s forwards;
  }

  .scene-person {
    position: absolute;
    left: 50%;
    top: 210px;
    width: 920px;
    height: 1480px;
    transform: translateX(-50%);
    z-index: 3;
  }

  .person-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 40px 60px rgba(0,0,0,.45));
  }

  .phone-slot {
    position: absolute;
    left: 268px;
    top: 268px;
    width: 384px;
    height: 780px;
    z-index: 4;
    transform-origin: 50% 100%;
    opacity: 0;
    transform: translateY(40px) scale(.94);
    animation: phoneIn .9s cubic-bezier(.22,.8,.24,1) .35s forwards;
  }

  .phone-bezel {
    position: absolute;
    inset: 0;
    border-radius: 48px;
    background: linear-gradient(160deg, #1c221c, #0a0d0a 40%, #151a15);
    box-shadow:
      0 0 0 3px #2a332a,
      0 0 0 6px #0a0d0a,
      0 28px 70px rgba(0,0,0,.55),
      inset 0 1px 0 rgba(255,255,255,.08);
    overflow: hidden;
  }
  .phone-notch {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 118px;
    height: 28px;
    border-radius: 20px;
    background: #050705;
    z-index: 3;
  }
  .phone-screen {
    position: absolute;
    top: 18px;
    left: 14px;
    right: 14px;
    bottom: 18px;
    border-radius: 36px;
    overflow: hidden;
    background: #050705;
  }
  .phone-screen img {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    opacity: 0;
    transition: opacity .12s linear;
  }
  .phone-screen img.on { opacity: 1; }
  .phone-glow {
    position: absolute;
    inset: -30px;
    border-radius: 60px;
    background: radial-gradient(circle at 50% 40%, rgba(183,255,0,.22), transparent 60%);
    z-index: -1;
    animation: pulseGlow 2.8s ease-in-out infinite;
  }

  .finger-tap {
    position: absolute;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    border: 3px solid rgba(183,255,0,.85);
    left: 168px;
    top: 420px;
    opacity: 0;
    pointer-events: none;
    z-index: 8;
  }
  .finger-tap.show {
    animation: tapRipple .9s ease-out;
  }

  .cta-pill {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: 28px;
    padding: 16px 28px;
    border-radius: 999px;
    background: var(--lime);
    color: #050705;
    font-weight: 900;
    font-size: 26px;
    opacity: 0;
    transform: translateY(12px);
    animation: riseIn .65s cubic-bezier(.22,.8,.24,1) 1.15s forwards;
  }

  @keyframes riseIn {
    to { opacity: 1; transform: none; }
  }
  @keyframes phoneIn {
    to { opacity: 1; transform: none; }
  }
  @keyframes pulseGlow {
    0%, 100% { opacity: .55; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.03); }
  }
  @keyframes tapRipple {
    0% { opacity: .9; transform: scale(.4); }
    100% { opacity: 0; transform: scale(1.6); }
  }

  /* Variant: full-bleed scroll without person (for cutaways) */
  body.mode-fullscreen .scene-person,
  body.mode-fullscreen .brand,
  body.mode-fullscreen .caption { display: none; }
  body.mode-fullscreen .fullscreen-phone {
    display: block;
  }
  .fullscreen-phone {
    display: none;
    position: absolute;
    inset: 0;
    padding: 0;
  }
  .fullscreen-phone img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="grain"></div>

    <div class="brand">
      <div class="word">PASS<span class="fifty">50</span></div>
      <div class="tag">Qui dit quoi, qui va où ?</div>
    </div>

    <div class="scene-person">
      <!-- Stylized person holding phone (front 3/4 view) -->
      <svg class="person-svg" viewBox="0 0 920 1480" aria-hidden="true">
        <defs>
          <linearGradient id="shirtGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#243024"/>
            <stop offset="100%" stop-color="#101610"/>
          </linearGradient>
          <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#d4a574"/>
            <stop offset="100%" stop-color="#8d5524"/>
          </linearGradient>
          <radialGradient id="faceLight" cx="40%" cy="30%" r="60%">
            <stop offset="0%" stop-color="#e0b888"/>
            <stop offset="100%" stop-color="#8d5524"/>
          </radialGradient>
        </defs>

        <!-- torso -->
        <path d="M250 720 C280 560 380 500 460 490 C560 478 680 540 700 720 L740 1280 C620 1360 300 1360 180 1280 Z" fill="url(#shirtGrad)"/>
        <path d="M300 700 C360 620 420 600 460 598 C520 595 600 640 640 720" fill="none" stroke="#2f3c2f" stroke-width="8"/>

        <!-- neck -->
        <path d="M430 470 C445 520 475 530 500 470" fill="url(#skinGrad)"/>

        <!-- head -->
        <ellipse cx="465" cy="350" rx="118" ry="140" fill="url(#faceLight)"/>
        <!-- hair -->
        <path d="M350 320 C360 200 420 160 470 155 C540 148 590 210 585 320 C620 280 630 360 600 400 C560 280 380 270 350 360 Z" fill="#1a120c"/>
        <path d="M355 340 C370 250 560 240 575 350 C540 300 390 300 355 340 Z" fill="#0d0907"/>
        <!-- ear -->
        <ellipse cx="350" cy="360" rx="18" ry="28" fill="#a66b3a"/>
        <!-- eyes looking at phone -->
        <ellipse cx="420" cy="350" rx="10" ry="7" fill="#1a120c"/>
        <ellipse cx="490" cy="348" rx="10" ry="7" fill="#1a120c"/>
        <path d="M400 400 C430 420 490 418 515 396" fill="none" stroke="#6b3f22" stroke-width="6" stroke-linecap="round"/>

        <!-- left arm holding phone -->
        <path d="M250 760 C180 820 140 920 160 1020 C180 1100 240 1140 300 1120" fill="url(#shirtGrad)"/>
        <path d="M290 1100 C250 1120 230 1160 250 1200 C280 1250 340 1240 360 1200 C380 1160 360 1120 330 1105 Z" fill="url(#skinGrad)"/>

        <!-- right arm -->
        <path d="M700 760 C780 820 820 940 800 1040 C780 1120 720 1160 660 1130" fill="url(#shirtGrad)"/>
        <path d="M650 1105 C690 1120 720 1160 700 1210 C670 1260 610 1245 590 1200 C575 1165 600 1115 640 1100 Z" fill="url(#skinGrad)"/>

        <!-- hands framing phone (simplified) -->
        <path d="M250 1180 C270 1260 330 1300 390 1285 C360 1220 320 1180 280 1160 Z" fill="url(#skinGrad)" opacity=".95"/>
        <path d="M670 1175 C650 1260 590 1305 530 1285 C560 1220 610 1180 650 1160 Z" fill="url(#skinGrad)" opacity=".95"/>
      </svg>

      <div class="phone-slot" id="phoneSlot">
        <div class="phone-glow"></div>
        <div class="phone-bezel">
          <div class="phone-notch"></div>
          <div class="phone-screen" id="screen"></div>
        </div>
        <div class="finger-tap" id="tap"></div>
      </div>
    </div>

    <div class="caption" id="caption">
      <h1>Regarde le <em>buzz</em><br/>en direct</h1>
      <p>Classement réel · images PASS50</p>
      <div class="cta-pill">pass50.store</div>
    </div>

    <div class="fullscreen-phone" id="fullscreen"></div>
  </div>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const mode = params.get('mode') || 'person'; // person | fullscreen
  const framesBase = params.get('frames') || '../captures/scroll-frames';
  const frameCount = Number(params.get('count') || 48);
  const fps = Number(params.get('fps') || 12);
  const captionTitle = params.get('title') || 'Regarde le buzz en direct';
  const captionSub = params.get('sub') || 'Classement réel · images PASS50';

  if (mode === 'fullscreen') document.body.classList.add('mode-fullscreen');

  const caption = document.getElementById('caption');
  if (caption) {
    const h1 = caption.querySelector('h1');
    const p = caption.querySelector('p');
    if (h1) {
      // allow <em> via simple markup: words after | become emphasized last word
      const parts = captionTitle.split('|');
      if (parts.length === 2) {
        h1.innerHTML = `${parts[0].trim()} <em>${parts[1].trim()}</em>`;
      } else {
        h1.textContent = captionTitle;
      }
    }
    if (p) p.textContent = captionSub;
  }

  const screen = document.getElementById('screen');
  const fullscreen = document.getElementById('fullscreen');
  const host = mode === 'fullscreen' ? fullscreen : screen;

  const imgs = [];
  for (let i = 0; i < frameCount; i++) {
    const img = new Image();
    img.src = `${framesBase}/frame-${String(i).padStart(3, '0')}.jpg`;
    img.decoding = 'async';
    host.appendChild(img);
    imgs.push(img);
  }

  let index = 0;
  let playing = false;
  let lastTap = 0;

  function show(i) {
    imgs.forEach((img, n) => img.classList.toggle('on', n === i));
    index = i;
  }

  function tapAt(progress) {
    const tap = document.getElementById('tap');
    if (!tap) return;
    // occasional tap cue mid-scroll
    if (progress > 0.35 && progress < 0.42 && Date.now() - lastTap > 900) {
      tap.classList.remove('show');
      void tap.offsetWidth;
      tap.classList.add('show');
      lastTap = Date.now();
    }
  }

  window.__PASS50_PROMO__ = {
    ready: false,
    frameCount,
    fps,
    index: 0,
    async preload() {
      await Promise.all(imgs.map((img) => img.decode?.().catch(() => {}) || Promise.resolve()));
      show(0);
      this.ready = true;
      return true;
    },
    setFrame(i) {
      const clamped = Math.max(0, Math.min(frameCount - 1, i | 0));
      show(clamped);
      tapAt(clamped / (frameCount - 1));
      this.index = clamped;
      return clamped;
    },
    play(from = 0, to = frameCount - 1) {
      return new Promise((resolve) => {
        let i = from;
        playing = true;
        const tick = () => {
          if (!playing) return resolve(i);
          show(i);
          this.index = i;
          tapAt(i / (frameCount - 1));
          if (i >= to) {
            playing = false;
            return resolve(i);
          }
          i += 1;
          setTimeout(tick, 1000 / fps);
        };
        tick();
      });
    },
    stop() { playing = false; }
  };

  // Auto-preload for browser preview
  window.__PASS50_PROMO__.preload().then(() => {
    document.documentElement.dataset.ready = '1';
  });
})();
</script>
</body>
</html>
