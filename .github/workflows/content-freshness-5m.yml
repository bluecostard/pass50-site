name: Content Freshness 5m

on:
  workflow_dispatch:
  schedule:
    # GitHub peut différer/coalescer les crons à haute fréquence.
    # Une session couvre donc elle-même 36 buckets de 5 minutes.
    - cron: '17 */3 * * *'
  push:
    branches: [main]
    paths:
      - 'api/content-freshness-cron-v4.php'
      - 'api/content-freshness-core.php'
      - 'api/content-freshness-admin-refresh.php'
      - 'api/content-feed.php'
      - 'api/content-intelligence-core.php'
      - 'api/metrics-collector-facebook.php'
      - 'api/tiktok-metrics-bridge-core.php'
      - '.github/workflows/content-freshness-5m.yml'
      - 'tests/test_content_freshness_v41_resilience.py'

permissions:
  contents: read
  statuses: write

concurrency:
  group: pass50-content-freshness
  # Une nouvelle session doit pouvoir remplacer une session réellement bloquée.
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 185
    env:
      CRON_URL: ${{ secrets.PASS50_METRICS_CRON_URL }}
      CRON_SECRET: ${{ secrets.PASS50_METRICS_CRON_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Valider le contrat de résilience V4.1
        run: python3 -m unittest tests.test_content_freshness_v41_resilience

      - name: Wait for deployed Content Freshness V4.1 resilience contract
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          case "${CRON_URL:-}" in
            */metrics-cron.php) ENDPOINT="${CRON_URL%/metrics-cron.php}/content-freshness-cron-v4.php" ;;
            *) echo '::error::PASS50_METRICS_CRON_URL invalide'; exit 1 ;;
          esac
          [ -n "${CRON_SECRET:-}" ] || { echo '::error::Secret cron absent'; exit 1; }
          ready=false
          for attempt in $(seq 1 36); do
            dispatch_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-fresh-v41-probe-$attempt"
            body="$(jq -nc --arg dispatchId "$dispatch_id" '{action:"probe",dispatchId:$dispatchId}')"
            timestamp="$(date +%s)"
            signature="$(printf '%s\n%s' "$timestamp" "$body" | openssl dgst -sha256 -hmac "$CRON_SECRET" -r | awk '{print $1}')"
            probe="$(curl --fail-with-body --silent --show-error --max-time 20 -H 'Content-Type: application/json' -H 'Cache-Control: no-cache, no-store' -H "X-P50-Timestamp: $timestamp" -H "X-P50-Signature: $signature" --data "$body" "$ENDPOINT" || true)"
            if jq -e '.ok==true and .action=="probe" and .version=="CONTENT-FRESHNESS-V4.0" and .resilience=="V4.1" and .bucketSeconds==300 and .facebookCollectorVersion=="FACEBOOK-COLLECTOR-V2.0" and .xFastCycle.enabled==false and .publicStateWrites==0' >/dev/null 2>&1 <<<"$probe"; then
              ready=true
              break
            fi
            echo "Runtime résilient V4.1 en attente ($attempt/36)."
            sleep 10
          done
          [ "$ready" = true ] || { echo '::error::Runtime Content Freshness V4.1 non servi'; exit 1; }

      - name: Collecter et recalculer les contenus récents
        id: refresh
        shell: bash
        run: |
          set -u -o pipefail
          case "${CRON_URL:-}" in
            */metrics-cron.php) ENDPOINT="${CRON_URL%/metrics-cron.php}/content-freshness-cron-v4.php" ;;
            *) echo '::error::PASS50_METRICS_CRON_URL invalide'; exit 1 ;;
          esac
          [ -n "${CRON_SECRET:-}" ] || { echo '::error::Secret cron absent'; exit 1; }

          cycles=1
          if [ "${{ github.event_name }}" = schedule ]; then cycles=36; fi
          mkdir -p /tmp/p50-content-freshness
          response_file=/tmp/p50-content-freshness/result.json
          progress_file=/tmp/p50-content-freshness/progress.ndjson
          : > "$progress_file"

          degraded_cycles=0
          completed_cycles=0
          processed_total=0
          selected_total=0
          last_remaining=0
          last_progress_epoch="$(date +%s)"

          echo "Session de fraîcheur résiliente : $cycles cycle(s), bucket de 5 minutes."
          for cycle in $(seq 1 "$cycles"); do
            cycle_started="$(date +%s)"
            cycle_started_iso="$(date -u +%FT%TZ)"
            echo "=== Cycle $cycle/$cycles · $cycle_started_iso ==="
            success=false
            http_code=000
            curl_status=0
            : > "$response_file"

            for attempt in 1 2; do
              dispatch_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-fresh-v41-c${cycle}-a${attempt}"
              body="$(jq -nc --arg dispatchId "$dispatch_id" '{action:"refresh",dispatchId:$dispatchId}')"
              timestamp="$(date +%s)"
              signature="$(printf '%s\n%s' "$timestamp" "$body" | openssl dgst -sha256 -hmac "$CRON_SECRET" -r | awk '{print $1}')"
              set +e
              http_code="$(curl --silent --show-error --max-time 85 --connect-timeout 10 --output "$response_file" --write-out '%{http_code}' -H 'Content-Type: application/json' -H "X-P50-Timestamp: $timestamp" -H "X-P50-Signature: $signature" --data "$body" "$ENDPOINT")"
              curl_status=$?
              set -e

              if [ "$curl_status" -eq 0 ] && [ "$http_code" = 200 ] && jq -e '.ok==true and .action=="refresh" and .version=="CONTENT-FRESHNESS-V4.0" and .resilience=="V4.1" and .bucketSeconds==300 and .publicStateWrites==0' "$response_file" >/dev/null 2>&1; then
                success=true
                break
              fi

              stage="$(jq -r '.stage // "transport"' "$response_file" 2>/dev/null || echo transport)"
              error_code="$(jq -r '.errorCode // "unknown"' "$response_file" 2>/dev/null || echo unknown)"
              detail="$(jq -r '.detail // .error // "—"' "$response_file" 2>/dev/null || echo '—')"
              echo "Cycle $cycle · tentative $attempt/2 · curl $curl_status · HTTP $http_code · $stage · $error_code · $detail"
              if [ "$attempt" -lt 2 ] && { [ "$curl_status" -ne 0 ] || [[ "$http_code" =~ ^(000|429|502|503|504)$ ]]; }; then
                sleep 8
              else
                break
              fi
            done

            cycle_finished="$(date +%s)"
            duration="$((cycle_finished-cycle_started))"
            if [ "$success" = true ]; then
              completed_cycles=$((completed_cycles+1))
              selected="$(jq -r '.profilesSelected // 0' "$response_file")"
              processed="$(jq -r '.processed // 0' "$response_file")"
              failed="$(jq -r '.failed // 0' "$response_file")"
              partial="$(jq -r '.partial // 0' "$response_file")"
              remaining="$(jq -r '.remaining // 0' "$response_file")"
              processed_total=$((processed_total+processed))
              selected_total=$((selected_total+selected))
              last_remaining=$remaining
              last_progress_epoch=$cycle_finished
              jq -nc --argjson cycle "$cycle" --arg status success --arg dispatchId "$(jq -r '.dispatchId' "$response_file")" --arg startedAt "$cycle_started_iso" --argjson durationSeconds "$duration" --argjson profilesSelected "$selected" --argjson processed "$processed" --argjson failed "$failed" --argjson partial "$partial" --argjson remaining "$remaining" '{cycle:$cycle,status:$status,dispatchId:$dispatchId,startedAt:$startedAt,durationSeconds:$durationSeconds,profilesSelected:$profilesSelected,processed:$processed,failed:$failed,partial:$partial,remaining:$remaining}' >> "$progress_file"
              echo "Cycle $cycle OK · ${selected} fiches · ${processed} tâches · ${remaining} restantes · ${duration}s"
            else
              degraded_cycles=$((degraded_cycles+1))
              stage="$(jq -r '.stage // "transport"' "$response_file" 2>/dev/null || echo transport)"
              error_code="$(jq -r '.errorCode // "timeout_or_transport"' "$response_file" 2>/dev/null || echo timeout_or_transport)"
              detail="$(jq -r '.detail // .error // "cycle non abouti"' "$response_file" 2>/dev/null || echo 'cycle non abouti')"
              jq -nc --argjson cycle "$cycle" --arg status degraded --arg startedAt "$cycle_started_iso" --argjson durationSeconds "$duration" --arg stage "$stage" --arg errorCode "$error_code" --arg detail "$detail" '{cycle:$cycle,status:$status,startedAt:$startedAt,durationSeconds:$durationSeconds,stage:$stage,errorCode:$errorCode,detail:$detail}' >> "$progress_file"
              echo "::warning::Cycle $cycle dégradé ($stage/$error_code). La tournée continue."
            fi

            now="$(date +%s)"
            if [ $((now-last_progress_epoch)) -gt 900 ]; then
              echo "::warning::Watchdog : aucune progression réussie depuis plus de 15 minutes."
            fi

            if [ "$cycle" -lt "$cycles" ]; then
              now="$(date +%s)"
              next_tick="$(( (now / 300 + 1) * 300 ))"
              wait_seconds="$(( next_tick - now ))"
              echo "Prochain bucket dans ${wait_seconds}s."
              sleep "$wait_seconds"
            fi
          done

          echo "completedCycles=$completed_cycles" >> "$GITHUB_OUTPUT"
          echo "degradedCycles=$degraded_cycles" >> "$GITHUB_OUTPUT"
          echo "cycles=$cycles" >> "$GITHUB_OUTPUT"
          echo "processed=$processed_total" >> "$GITHUB_OUTPUT"
          echo "profilesSelected=$selected_total" >> "$GITHUB_OUTPUT"
          echo "remaining=$last_remaining" >> "$GITHUB_OUTPUT"

          {
            echo '### PASS50 Content Freshness — Résilience V4.1'
            echo "- Cycles terminés : **${completed_cycles}/${cycles}**"
            echo "- Cycles dégradés : **${degraded_cycles}**"
            echo "- Sélections cumulées : **${selected_total}**"
            echo "- Tâches traitées : **${processed_total}**"
            echo "- File restante au dernier cycle réussi : **${last_remaining}**"
            echo '- Timeout client : `85 s` · tentatives : `2` · un cycle en échec ne stoppe plus la tournée.'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$completed_cycles" -eq 0 ]; then
            echo '::error::Aucun cycle Content Freshness n’a abouti.'
            exit 1
          fi

      - name: Publier le statut de fraîcheur
        if: always()
        shell: bash
        env:
          STEP_OUTCOME: ${{ steps.refresh.outcome }}
          COMPLETED: ${{ steps.refresh.outputs.completedCycles }}
          CYCLES: ${{ steps.refresh.outputs.cycles }}
          DEGRADED: ${{ steps.refresh.outputs.degradedCycles }}
          SELECTED: ${{ steps.refresh.outputs.profilesSelected }}
          PROCESSED: ${{ steps.refresh.outputs.processed }}
          REMAINING: ${{ steps.refresh.outputs.remaining }}
        run: |
          set -euo pipefail
          state=success
          description="Fraîcheur V4.1 · ${COMPLETED:-0}/${CYCLES:-0} cycles · ${PROCESSED:-0} tâches"
          if [ "$STEP_OUTCOME" != success ]; then
            state=failure
            description='Fraîcheur V4.1 : aucun cycle abouti'
          elif [ "${DEGRADED:-0}" -gt 0 ]; then
            state=pending
            description="Fraîcheur V4.1 · ${DEGRADED:-0} cycle(s) dégradé(s) · tournée poursuivie"
          fi
          payload="$(jq -nc --arg state "$state" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --arg description "$description" --arg context 'pass50/content-freshness' '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl --fail-with-body --silent --show-error -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' --data "$payload" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"

      - name: Archiver le diagnostic et la progression
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-freshness-v41-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/p50-content-freshness/result.json
            /tmp/p50-content-freshness/progress.ndjson
          if-no-files-found: warn
          retention-days: 14
