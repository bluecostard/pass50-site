name: Validate Content Intelligence V1

on:
  pull_request:
    paths:
      - 'api/content-intelligence-core.php'
      - 'api/content-intelligence-cron.php'
      - 'api/content-freshness-cron.php'
      - 'api/content-feed.php'
      - 'api/metrics-collector-facebook.php'
      - 'api/news-discover.php'
      - 'api/news-validate.php'
      - 'content-intelligence.js'
      - 'facebook-video-player-v1.js'
      - 'public-copy-fixes.js'
      - 'app-config.js'
      - 'sw.js'
      - 'tests/test_content_intelligence_v1.py'
      - '.github/workflows/content-intelligence-15m.yml'
      - '.github/workflows/content-freshness-5m.yml'
      - '.github/workflows/deploy-ionos.yml'
      - '.github/workflows/validate-content-intelligence-v1.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PHP lint
        run: |
          php -l api/content-intelligence-core.php
          php -l api/content-intelligence-cron.php
          php -l api/freshness-cron.php 2>/dev/null || true
          php -l api/content-feed.php
          php -l api/metrics-collector-facebook.php
          php -l api/news-discover.php
          php -l api/news-validate.php
      - name: JavaScript syntax
        run: node --check content-intelligence.js && node --check facebook-video-player-v1.js && node --check public-copy-fixes.js && node --check app-config.js && node --check sw.js
      - name: Contract tests
        run: python3 -m unittest tests.test_content_intelligence_v1 -v
      - name: Diagnose Apoutchou Facebook plugins
        shell: bash
        run: |
          set -euo pipefail
          feed_url="https://www.pass50.store/api/content-feed.php?period=24h&profileId=apoutchou&newsLimit=30&_=${GITHUB_RUN_ID}"
          curl --fail-with-body --silent --show-error --max-time 30 -H 'Accept: application/json' -H 'Cache-Control: no-cache, no-store' "$feed_url" > apoutchou-feed.json
          jq -e '.ok==true and .ready==true' apoutchou-feed.json >/dev/null
          jq '[.news[] | select((.platform|ascii_downcase)=="facebook") | {id,itemType,url,playableInPass50,facebookEmbedType}]' apoutchou-feed.json > apoutchou-facebook.json
          count="$(jq 'length' apoutchou-facebook.json)"
          echo "APOUTCHOU_FACEBOOK_COUNT=$count"
          [ "$count" -gt 0 ] || { echo '::error::Aucune actualité Facebook pour Apoutchou'; exit 1; }
          : > plugin-results.jsonl
          while IFS= read -r item; do
            source="$(jq -r '.url' <<<"$item")"
            item_type="$(jq -r '.itemType // ""' <<<"$item")"
            path="$(python3 - "$source" <<'PY'
import sys, urllib.parse
u=urllib.parse.urlparse(sys.argv[1])
print((u.hostname or '')+(u.path or ''))
PY
)"
            encoded="$(python3 - "$source" <<'PY'
import sys, urllib.parse
print(urllib.parse.quote(sys.argv[1], safe=''))
PY
)"
            echo "APOUTCHOU_ITEM path=$path itemType=$item_type"
            for plugin in video post; do
              plugin_url="https://www.facebook.com/plugins/${plugin}.php?href=${encoded}&show_text=false&width=820"
              body="plugin-${plugin}.html"
              code="$(curl --location --silent --show-error --max-time 30 --output "$body" --write-out '%{http_code}' -H 'Accept-Language: fr-FR,fr;q=0.9,en;q=0.8' "$plugin_url" || true)"
              unavailable=false
              if grep -Eqi "content[^<]{0,80}(isn.t|not) available|contenu[^<]{0,80}(n.est pas|indisponible)|publication[^<]{0,80}indisponible" "$body" 2>/dev/null; then unavailable=true; fi
              echo "APOUTCHOU_PLUGIN plugin=$plugin http=$code unavailable=$unavailable path=$path"
              jq -nc --arg path "$path" --arg itemType "$item_type" --arg plugin "$plugin" --arg code "$code" --argjson unavailable "$unavailable" '{path:$path,itemType:$itemType,plugin:$plugin,httpStatus:($code|tonumber? // 0),unavailableMessage:$unavailable}' >> plugin-results.jsonl
            done
          done < <(jq -c '.[]' apoutchou-facebook.json)
          jq -s '.' plugin-results.jsonl > plugin-results.json
          jq . plugin-results.json
      - name: Diff check
        run: git diff --check origin/${{ github.base_ref }}...HEAD
