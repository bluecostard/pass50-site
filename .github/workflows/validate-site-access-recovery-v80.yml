name: Validate Site Access Recovery V81

on:
  pull_request:
    paths:
      - 'sw.js'
      - 'public-copy-fixes.js'
      - '.github/workflows/deploy-ionos.yml'
      - 'tests/test_site_access_recovery_v80.py'
      - '.github/workflows/validate-site-access-recovery-v80.yml'
  push:
    branches:
      - main
    paths:
      - 'sw.js'
      - 'public-copy-fixes.js'
      - '.github/workflows/deploy-ionos.yml'
      - 'tests/test_site_access_recovery_v80.py'
      - '.github/workflows/validate-site-access-recovery-v80.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: JavaScript syntax
        run: |
          node --check sw.js
          node --check public-copy-fixes.js
      - name: Recovery contract
        run: python3 -m unittest tests.test_site_access_recovery_v80 -v
      - name: Workflow syntax markers
        run: |
          grep -q -- '--only-newer' .github/workflows/deploy-ionos.yml
          grep -q 'deployment-version.json' .github/workflows/deploy-ionos.yml
          grep -q 'pass50-v81-service-worker-disabled' sw.js
          ! grep -q "addEventListener('fetch'" sw.js
      - name: Diff safety
        run: git diff --check origin/${{ github.base_ref || 'main' }}...HEAD
