name: Dolpho Profile Recovery
# Récupération des saisies antérieures demandée par le propriétaire — 2026-08-11.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['api/dolpho-profile-recovery-cron-v1.php','.github/workflows/dolpho-profile-recovery.yml']
permissions: {contents: read, statuses: write}
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CRON_URL: ${{ secrets.PASS50_METRICS_CRON_URL }}
      CRON_SECRET: ${{ secrets.PASS50_METRICS_CRON_SECRET }}
    steps:
      - name: Recover and protect Dolpho official accounts
        shell: bash
        run: |
          set -euo pipefail
          case "${CRON_URL:-}" in */metrics-cron.php) ENDPOINT="${CRON_URL%/metrics-cron.php}/dolpho-profile-recovery-cron-v1.php" ;; *) exit 1 ;; esac
          case "$ENDPOINT" in http://*) ENDPOINT="https://${ENDPOINT#http://}" ;; esac
          case "$ENDPOINT" in https://www.pass50.store/*) ENDPOINT="https://pass50.store/${ENDPOINT#https://www.pass50.store/}" ;; esac
          body="$(jq -nc --arg dispatchId "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" '{dispatchId:$dispatchId}')"
          for attempt in $(seq 1 36); do
            timestamp="$(date +%s)"; signature="$(printf '%s\n%s' "$timestamp" "$body" | openssl dgst -sha256 -hmac "$CRON_SECRET" -r | awk '{print $1}')"
            code="$(curl --silent --show-error --max-time 90 --output /tmp/dolpho-recovery.json --write-out '%{http_code}' -H 'Content-Type: application/json' -H "X-P50-Timestamp: $timestamp" -H "X-P50-Signature: $signature" --data "$body" "$ENDPOINT" || true)"
            if [ "$code" = 200 ] && jq -e '.ok==true and .version=="DOLPHO-PROFILE-RECOVERY-V1.0" and .restoredCount==4 and .publicStateWrites==1' /tmp/dolpho-recovery.json >/dev/null 2>&1; then break; fi
            echo "Endpoint en attente · tentative $attempt/36 · HTTP ${code:-000}"; sleep 10
          done
          jq -e '.ok==true and .restoredCount==4 and .publicStateWrites==1' /tmp/dolpho-recovery.json >/dev/null
          cat /tmp/dolpho-recovery.json
      - name: Archive recovery proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dolpho-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/dolpho-recovery.json
          if-no-files-found: warn
          retention-days: 30
