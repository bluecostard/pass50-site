name: Tune Live Radar V3

on:
  push:
    branches:
      - feat/live-radar-v3-performance

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/live-radar-v3-performance
      - name: Renforcer la rotation et les sondes du radar
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('api/live-status-v3.php')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "const P50_LIVE_OFFICIAL_STATUSES = ['verified','owner_verified','manual_verified','ok','blocked_but_exists'];",
                  "const P50_LIVE_OFFICIAL_STATUSES = ['verified','owner_verified','manual_verified','ok','blocked_but_exists'];\nconst P50_LIVE_V3_TUNED = 1;",
              ),
              ("CURLMOPT_MAX_TOTAL_CONNECTIONS,10", "CURLMOPT_MAX_TOTAL_CONNECTIONS,16"),
              (
                  "$force=p50_live_v3_bool_query('force')||in_array($mode,['full','profile'],true);$batch=max(1,min(10,(int)($_GET['batch']??6)));",
                  "$force=p50_live_v3_bool_query('force')||in_array($mode,['full','profile'],true);$batch=max(1,min(12,(int)($_GET['batch']??8)));",
              ),
              ("$refresh=45;$stale=35;", "$refresh=45;$stale=90;"),
              (
                  "$manifest['cursor']=min($cycleTotal,(int)$manifest['cursor']+count($selected));",
                  "$manifest['cursor']=min($cycleTotal,(int)$manifest['cursor']+count($keys));",
              ),
              (
                  "'api'=>['url'=>'https://www.tiktok.com/api-live/user/room/?aid=1988&sourceType=54&uniqueId='.$handle,'accept'=>'application/json,text/plain,*/*'],",
                  "'api'=>['url'=>'https://www.tiktok.com/api-live/user/room/?aid=1988&sourceType=54&uniqueId='.$handle,'accept'=>'application/json,text/plain,*/*'],\n            'api_basic'=>['url'=>'https://www.tiktok.com/api-live/user/room/?aid=1988&uniqueId='.$handle,'accept'=>'application/json,text/plain,*/*'],\n            'mobile_live'=>['url'=>'https://m.tiktok.com/@'.$handle.'/live','accept'=>'text/html,application/xhtml+xml,*/*;q=0.7'],",
              ),
              (
                  "'videos'=>['url'=>rtrim($identity['profileUrl'],'/').'/videos/','accept'=>'text/html,application/xhtml+xml,*/*;q=0.7'],",
                  "'videos'=>['url'=>rtrim($identity['profileUrl'],'/').'/videos/','accept'=>'text/html,application/xhtml+xml,*/*;q=0.7'],\n            'mobile'=>['url'=>str_replace('www.facebook.com','m.facebook.com',$identity['profileUrl']),'accept'=>'text/html,application/xhtml+xml,*/*;q=0.7'],",
              ),
          ]

          if 'P50_LIVE_V3_TUNED' not in text:
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'Motif introuvable: {old[:90]}')
                  text = text.replace(old, new, 1)

              old_store = "function p50_live_v3_store(array $live): void {\n    $platform=(string)$live['platform'];$key=hash('sha256',$platform.'|'.strtolower(rtrim((string)$live['url'],'/')));"
              new_store = "function p50_live_v3_store(array $live): void {\n    $platform=(string)$live['platform'];$profileId=(string)$live['profileId'];$key=hash('sha256',$platform.'|'.strtolower(rtrim((string)$live['url'],'/')));\n    $endOthers=db()->prepare(\"UPDATE p50_live_streams SET status='ended',ended_at=NOW() WHERE profile_id=? AND platform=? AND source='automatic' AND status='live' AND stream_key<>?\");\n    $endOthers->execute([$profileId,$platform,$key]);"
              if old_store not in text:
                  raise SystemExit('Bloc de stockage introuvable')
              text = text.replace(old_store, new_store, 1)
              text = text.replace("$stmt->execute([$key,(string)$live['profileId'],$platform", "$stmt->execute([$key,$profileId,$platform", 1)

              old_health = "$stmt=db()->prepare('SELECT consecutive_offline,consecutive_unknown FROM p50_live_source_health WHERE profile_id=? AND platform=? LIMIT 1');$stmt->execute([$profileId,$platform]);$previous=$stmt->fetch()?:[];\n    $offline=$state==='offline'?((int)($previous['consecutive_offline']??0)+1):0;\n    $unknown=$state==='unknown'?((int)($previous['consecutive_unknown']??0)+1):0;"
              new_health = "$urlHash=hash('sha256',strtolower(rtrim($url,'/')));\n    $stmt=db()->prepare('SELECT url_hash,consecutive_offline,consecutive_unknown FROM p50_live_source_health WHERE profile_id=? AND platform=? LIMIT 1');$stmt->execute([$profileId,$platform]);$previous=$stmt->fetch()?:[];\n    $sameUrl=(string)($previous['url_hash']??'')===$urlHash;\n    $offline=$state==='offline'?($sameUrl?(int)($previous['consecutive_offline']??0):0)+1:0;\n    $unknown=$state==='unknown'?($sameUrl?(int)($previous['consecutive_unknown']??0):0)+1:0;"
              if old_health not in text:
                  raise SystemExit('Bloc de santé introuvable')
              text = text.replace(old_health, new_health, 1)
              text = text.replace("hash('sha256',strtolower(rtrim($url,'/'))),$url,$state", "$urlHash,$url,$state", 1)

              path.write_text(text, encoding='utf-8')
          PY
          php -l api/live-status-v3.php
          git rm .github/workflows/tune-live-radar-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/live-status-v3.php
          git commit -m "feat: renforcer la rotation et les sondes du Radar LIVE V3"
          git push origin HEAD:feat/live-radar-v3-performance
