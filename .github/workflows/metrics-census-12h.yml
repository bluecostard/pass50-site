name: Metrics Census P2

on:
  schedule:
    - cron: '23 */12 * * *'
  workflow_dispatch:

concurrency:
  group: pass50-metrics-p2
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CRON_URL: ${{ secrets.PASS50_METRICS_CRON_URL }}
      CRON_SECRET: ${{ secrets.PASS50_METRICS_CRON_SECRET }}
    steps:
      - name: Dispatch and process P2
        shell: bash
        run: |
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::PASS50 metrics cron secrets are not configured."
            exit 0
          fi
          dispatch_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-p2"
          call_cron() {
            local body="$1" timestamp signature
            timestamp="$(date +%s)"
            signature="$(printf '%s\n%s' "$timestamp" "$body" | openssl dgst -sha256 -hmac "$CRON_SECRET" -r | awk '{print $1}')"
            curl --fail-with-body --silent --show-error --max-time 55 \
              -H "Content-Type: application/json" -H "X-P50-Timestamp: $timestamp" \
              -H "X-P50-Signature: $signature" --data "$body" "$CRON_URL"
          }
          response="$(call_cron "$(jq -nc --arg id "$dispatch_id" '{action:"dispatch",cadence:"p2",dispatchId:$id}')")"
          remaining="$(jq -r '.remaining // 0' <<<"$response")"
          processed=0
          for iteration in $(seq 1 480); do
            [ "$remaining" -eq 0 ] && break
            response="$(call_cron "$(jq -nc --arg id "$dispatch_id" --argjson iteration "$iteration" '{action:"work",cadence:"p2",dispatchId:$id,iteration:$iteration}')")"
            remaining="$(jq -r '.remaining // 0' <<<"$response")"
            processed=$((processed + $(jq -r '.processed // 0' <<<"$response")))
          done
          printf '### Metrics Census P2\n- Dispatch: `%s`\n- Tâches traitées: %s\n- File restante: %s\n' "$dispatch_id" "$processed" "$remaining" >> "$GITHUB_STEP_SUMMARY"
