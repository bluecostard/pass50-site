name: Profile Cleanup
# Déclenchement opérationnel 2026-08-06T14:16Z

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'api/profile-cleanup-cron-v1.php'
      - '.github/workflows/profile-cleanup.yml'
      - '.htaccess'

permissions:
  contents: read
  statuses: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CRON_URL: ${{ secrets.PASS50_METRICS_CRON_URL }}
      CRON_SECRET: ${{ secrets.PASS50_METRICS_CRON_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete selected profiles and complete Reine A.
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail
          case "${CRON_URL:-}" in
            */metrics-cron.php) ENDPOINT="${CRON_URL%/metrics-cron.php}/profile-cleanup-cron-v1.php" ;;
            *) echo '::error::PASS50_METRICS_CRON_URL invalide'; exit 1 ;;
          esac
          body="$(jq -nc --arg dispatchId "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" '{dispatchId:$dispatchId}')"
          for attempt in $(seq 1 36); do
            timestamp="$(date +%s)"
            signature="$(printf '%s\n%s' "$timestamp" "$body" | openssl dgst -sha256 -hmac "$CRON_SECRET" -r | awk '{print $1}')"
            code="$(curl --silent --show-error --max-time 90 --output /tmp/profile-cleanup.json --write-out '%{http_code}' -H 'Content-Type: application/json' -H "X-P50-Timestamp: $timestamp" -H "X-P50-Signature: $signature" --data "$body" "$ENDPOINT" || true)"
            if [ "$code" = 200 ] && jq -e '.ok==true and .version=="PROFILE-CLEANUP-V1.0" and .deletedCount==8 and .keptUpdated==true' /tmp/profile-cleanup.json >/dev/null 2>&1; then break; fi
            echo "Endpoint en attente · tentative $attempt/36 · HTTP ${code:-000}"
            sleep 10
          done
          jq -e '.ok==true and .deletedCount==8 and .keptUpdated==true' /tmp/profile-cleanup.json >/dev/null
          cat /tmp/profile-cleanup.json
          echo "deleted=$(jq -r '.deletedCount' /tmp/profile-cleanup.json)" >> "$GITHUB_OUTPUT"
          echo "remaining=$(jq -r '.profilesRemaining' /tmp/profile-cleanup.json)" >> "$GITHUB_OUTPUT"

      - name: Publish cleanup status
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.cleanup.outcome }}
          DELETED: ${{ steps.cleanup.outputs.deleted }}
          REMAINING: ${{ steps.cleanup.outputs.remaining }}
        run: |
          state=success
          description="${DELETED:-0} fiches supprimées · ${REMAINING:-?} restantes"
          if [ "$OUTCOME" != success ]; then state=failure; description='Suppression des fiches interrompue'; fi
          payload="$(jq -nc --arg state "$state" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --arg description "$description" --arg context 'pass50/profile-cleanup' '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl --fail-with-body --silent --show-error -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' --data "$payload" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"

      - name: Archive cleanup report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/profile-cleanup.json
          if-no-files-found: warn
          retention-days: 30
