name: Validate Metrics Public Baseline P1 V1

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: pass50_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      P50_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=pass50_test;charset=utf8mb4
      P50_TEST_DB_USER: root
      P50_TEST_DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PHP lint
        run: |
          php -l api/metrics-public-baseline-core.php
          php -l api/metrics-public-baseline-cron.php
          php -l api/metrics-ranking-publication-period-core.php
          php -l tests/metrics_public_baseline_p1_mariadb.php
      - name: Static tests
        run: python3 -m unittest tests.test_metrics_public_baseline_p1_v1
      - name: MariaDB public baseline
        run: php tests/metrics_public_baseline_p1_mariadb.php
      - name: Read-only guards
        run: |
          ! grep -E 'INSERT INTO app_state|UPDATE app_state|DELETE FROM app_state|REPLACE INTO app_state' api/metrics-public-baseline-core.php api/metrics-public-baseline-cron.php api/metrics-ranking-publication-period-core.php
          grep -F "P50_METRICS_PUBLIC_BASELINE_VERSION,'fresh'" api/metrics-public-baseline-core.php
          grep -F 'PUBLIC-BASELINE-P1-V1.3' .github/workflows/metrics-public-baseline-p1.yml
      - name: Diff check
        run: git diff --check origin/${{ github.base_ref }}...HEAD
