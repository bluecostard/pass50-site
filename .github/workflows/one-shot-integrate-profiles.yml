name: One-shot Integrate Kehou and Pavlov

on:
  push:
    branches:
      - main
    paths:
      - '.pass50-run-profile-integration-v2'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Appliquer les profils canoniques
        run: python3 scripts/one_shot_add_kehou_pavlov.py

      - name: Publier l’intégration sur main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Ajouter Kehou Mousso et Pavlov au recensement PASS50'
          git push origin HEAD:main
