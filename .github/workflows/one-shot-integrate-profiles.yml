name: One-shot Integrate Kehou and Pavlov

on:
  pull_request:
    types:
      - opened

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.title == 'PASS50: integrate Kehou Mousso and Pavlov'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Appliquer les profils canoniques
        run: python3 scripts/one_shot_add_kehou_pavlov.py

      - name: Valider les fichiers et les contrats canoniques
        run: |
          python3 -m json.tool pass50_nouveaux_candidats_90_v19.json >/dev/null
          node --check v9-tools.js
          node --check sw.js
          python3 -m unittest tests.test_canonical_lionel_yasmine_v24
          python3 -m unittest tests.test_andrea_naomi_canonical_profile
          python3 -m unittest tests.test_kehou_pavlov_canonical_profiles

      - name: Publier l’intégration sur la branche de la PR
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Ajouter Kehou Mousso et Pavlov au recensement PASS50'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
