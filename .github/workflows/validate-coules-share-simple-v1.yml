name: Validate Coules Share Simple V2

on:
  pull_request:
    paths:
      - 'coules-share-simple-v1.js'
      - 'pronostics-coules-tab-v1.js'
      - 'pronostics-live-tab-v1.js'
      - 'tests/test_prono50_live_v1.py'
      - 'mobile-bottom-nav-v1.js'
      - 'pronostics.html'
      - 'index.html'
      - 'app-config.js'
      - 'sw.js'
      - 'tests/test_coules_share_simple_v1.py'
      - 'tests/test_pronostics_coules_tab_v1.py'
      - '.github/workflows/validate-coules-share-simple-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check coules-share-simple-v1.js
          node --check pronostics-coules-tab-v1.js
          node --check pronostics-live-tab-v1.js
          node --check mobile-bottom-nav-v1.js
          node --check app-config.js
          node --check sw.js
      - name: Tests Coulés et Pronostics
        run: |
          python3 -m unittest tests.test_coules_share_simple_v1
          python3 -m unittest tests.test_pronostics_coules_tab_v1
          python3 -m unittest tests.test_prono50_live_v1
      - name: Diff check
        if: "${{ github.event_name == 'pull_request' }}"
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
