name: Appliquer les dates de naissance vérifiées
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'api/birthdates-apply-cron-v1.php'
      - '.github/workflows/birthdates-apply.yml'
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CRON_URL: ${{ secrets.PASS50_METRICS_CRON_URL }}
      CRON_SECRET: ${{ secrets.PASS50_METRICS_CRON_SECRET }}
    steps:
      - name: Attendre l’endpoint
        run: |
          set -euo pipefail
          URL="${CRON_URL%/metrics-cron.php}/birthdates-apply-cron-v1.php"
          for i in $(seq 1 36); do code="$(curl -L -sS -o /dev/null -w '%{http_code}' "$URL" || true)"; [ "$code" = "405" ] && exit 0; sleep 10; done
          exit 1
      - name: Appliquer les informations vérifiées
        run: |
          set -euo pipefail
          URL="${CRON_URL%/metrics-cron.php}/birthdates-apply-cron-v1.php"
          body="$(jq -nc --arg dispatchId "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" '{action:"apply",dispatchId:$dispatchId}')"
          timestamp="$(date +%s)"; signature="$(printf '%s\n%s' "$timestamp" "$body" | openssl dgst -sha256 -hmac "$CRON_SECRET" -r | awk '{print $1}')"
          curl --location --post301 --post302 --fail-with-body -sS --max-time 120 -H 'Content-Type: application/json' -H "X-P50-Timestamp: $timestamp" -H "X-P50-Signature: $signature" --data "$body" "$URL" | tee result.json
          jq -e '.ok == true and .appliedCount >= 0' result.json >/dev/null
