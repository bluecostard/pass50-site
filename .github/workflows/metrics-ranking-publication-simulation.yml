name: Metrics Ranking Publication Simulation

on:
  schedule:
    - cron: '12 1-23/2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'api/metrics-ranking-publication-simulate-cron.php'
      - '.github/workflows/metrics-ranking-publication-simulation.yml'

concurrency:
  group: pass50-metrics-ranking-publication-simulation
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CRON_URL: ${{ secrets.PASS50_METRICS_CRON_URL }}
      CRON_SECRET: ${{ secrets.PASS50_METRICS_CRON_SECRET }}
    steps:
      - name: Run production publication simulation
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CRON_URL" ] && [ -z "$CRON_SECRET" ]; then
            echo "::warning::PASS50 metrics cron secrets are not configured."
            exit 0
          fi
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Les deux secrets PASS50 metrics cron doivent être configurés."
            exit 1
          fi

          case "$CRON_URL" in
            */metrics-cron.php)
              SIMULATION_URL="${CRON_URL%/metrics-cron.php}/metrics-ranking-publication-simulate-cron.php"
              ;;
            *)
              echo "::error::PASS50_METRICS_CRON_URL doit se terminer par /metrics-cron.php"
              exit 1
              ;;
          esac

          dispatch_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-publication-simulation"
          body="$(jq -nc --arg dispatchId "$dispatch_id" --arg period "2H" '{action:"simulate",dispatchId:$dispatchId,period:$period}')"
          response_file="publication-simulation.json"
          http_code="000"

          for attempt in $(seq 1 15); do
            timestamp="$(date +%s)"
            signature="$(
              printf '%s\n%s' "$timestamp" "$body" |
                openssl dgst -sha256 -hmac "$CRON_SECRET" -r |
                awk '{print $1}'
            )"
            http_code="$(
              curl --silent --show-error --max-time 55 \
                --output "$response_file" \
                --write-out '%{http_code}' \
                -H "Content-Type: application/json" \
                -H "X-P50-Timestamp: $timestamp" \
                -H "X-P50-Signature: $signature" \
                --data "$body" \
                "$SIMULATION_URL" || printf '000'
            )"

            if [ "$http_code" = "200" ]; then
              break
            fi
            if [ "${GITHUB_EVENT_NAME}" = "push" ] && { [ "$http_code" = "000" ] || [ "$http_code" = "404" ] || [ "$http_code" = "502" ] || [ "$http_code" = "503" ] || [ "$http_code" = "504" ]; }; then
              echo "Déploiement IONOS pas encore prêt (HTTP $http_code), tentative $attempt/15."
              sleep 20
              continue
            fi
            echo "::error::Simulation de publication refusée (HTTP $http_code)."
            cat "$response_file" || true
            exit 1
          done

          if [ "$http_code" != "200" ]; then
            echo "::error::Le nouvel endpoint n'est pas devenu disponible après les tentatives de déploiement."
            cat "$response_file" || true
            exit 1
          fi

          jq -e '.ok == true' "$response_file" >/dev/null
          jq -e '
            .publication.mode == "simulation" and
            .publication.publicationEnabled == false and
            .publication.automaticPublicationEnabled == false and
            .publication.appStateWriteAttempted == false and
            .scope.publicStateWrites == 0
          ' "$response_file" >/dev/null || {
            echo "::error::Le rapport ne garantit pas strictement l'absence d'écriture publique."
            exit 1
          }

          status="$(jq -r '.status // "unknown"' "$response_file")"
          blocked="$(jq '[.gates[]? | select(.status == "block")] | length' "$response_file")"
          warnings="$(jq '[.gates[]? | select(.status == "warn")] | length' "$response_file")"
          run_uuid="$(jq -r '.source.experimentalRun.runUuid // "—"' "$response_file")"
          generated_at="$(jq -r '.generatedAt // "—"' "$response_file")"
          public_revision="$(jq -r '.source.publicStateRevision // 0' "$response_file")"
          public_count="$(jq -r '.summary.publicCount // 0' "$response_file")"
          candidate_count="$(jq -r '.summary.candidateCount // 0' "$response_file")"
          entries="$(jq -r '.summary.counts.entries // 0' "$response_file")"
          exits="$(jq -r '.summary.counts.exits // 0' "$response_file")"
          up="$(jq -r '.summary.counts.up // 0' "$response_file")"
          down="$(jq -r '.summary.counts.down // 0' "$response_file")"
          stable="$(jq -r '.summary.counts.stable // 0' "$response_file")"
          maximum_move="$(jq -r '.summary.maximumAbsoluteRankMovement // 0' "$response_file")"
          median_move="$(jq -r '.summary.medianAbsoluteRankMovement // 0' "$response_file")"
          top10="$(jq -r 'if .summary.top10Retention == null then "—" else ((.summary.top10Retention * 100 | round) / 100 | tostring) + "%" end' "$response_file")"
          duration="$(jq -r '.durationMs // 0' "$response_file")"

          if [ "$status" = "blocked" ]; then
            echo "::warning::La simulation est bloquée par $blocked garde-fou(s). Aucune publication n'a été tentée."
          elif [ "$status" = "review" ]; then
            echo "::warning::La simulation demande une revue ($warnings avertissement(s)). Aucune publication n'a été tentée."
          fi

          {
            printf '### Simulation de publication MR-V1.0 → app_state\n'
            printf -- '- État : `%s`\n' "$status"
            printf -- '- Générée : %s\n' "$generated_at"
            printf -- '- dispatchId : `%s`\n' "$dispatch_id"
            printf -- '- runUuid expérimental : `%s`\n' "$run_uuid"
            printf -- '- Révision publique : `%s`\n' "$public_revision"
            printf -- '- Public / candidat : %s / %s\n' "$public_count" "$candidate_count"
            printf -- '- Entrées / sorties : %s / %s\n' "$entries" "$exits"
            printf -- '- Hausses / baisses / stables : %s / %s / %s\n' "$up" "$down" "$stable"
            printf -- '- Mouvement médian / maximal : %s / %s places\n' "$median_move" "$maximum_move"
            printf -- '- Conservation Top 10 : %s\n' "$top10"
            printf -- '- Garde-fous bloquants / avertissements : %s / %s\n' "$blocked" "$warnings"
            printf -- '- Écritures app_state : `0`\n'
            printf -- '- Publication automatique : `désactivée`\n'
            printf -- '- Durée : %s ms\n' "$duration"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive full simulation report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: publication-simulation-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-simulation.json
          if-no-files-found: ignore
          retention-days: 30
