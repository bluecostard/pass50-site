name: Metrics Ranking Publication Simulation

on:
  schedule:
    - cron: '15 */2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'api/metrics-ranking-publication-simulate-cron.php'
      - 'api/metrics-ranking-publication-history-core.php'
      - '.github/workflows/metrics-ranking-publication-simulation.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: pass50-metrics-ranking-publication-simulation
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CRON_URL: ${{ secrets.PASS50_METRICS_CRON_URL }}
      CRON_SECRET: ${{ secrets.PASS50_METRICS_CRON_SECRET }}
    steps:
      - name: Run production publication simulation
        id: simulation
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CRON_URL" ] && [ -z "$CRON_SECRET" ]; then
            echo "::warning::PASS50 metrics cron secrets are not configured."
            exit 0
          fi
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Les deux secrets PASS50 metrics cron doivent être configurés."
            exit 1
          fi
          CRON_URL="${CRON_URL//www.pass50.store/pass50.store}"
          CRON_URL="${CRON_URL/#http:/https:}"

          case "$CRON_URL" in
            */metrics-cron.php)
              SIMULATION_URL="${CRON_URL%/metrics-cron.php}/metrics-ranking-publication-simulate-cron.php"
              ;;
            *)
              echo "::error::PASS50_METRICS_CRON_URL doit se terminer par /metrics-cron.php"
              exit 1
              ;;
          esac

          dispatch_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-publication-simulation"
          body="$(jq -nc --arg dispatchId "$dispatch_id" --arg period "2H" '{action:"simulate",dispatchId:$dispatchId,period:$period}')"
          response_file="publication-simulation.json"
          http_code="000"

          for attempt in $(seq 1 15); do
            timestamp="$(date +%s)"
            signature="$(
              printf '%s\n%s' "$timestamp" "$body" |
                openssl dgst -sha256 -hmac "$CRON_SECRET" -r |
                awk '{print $1}'
            )"
            set +e
            http_code="$(
              curl --silent --show-error --max-time 180 \
                --output "$response_file" \
                --write-out '%{http_code}' \
                -H "Content-Type: application/json" \
                -H "X-P50-Timestamp: $timestamp" \
                -H "X-P50-Signature: $signature" \
                --data "$body" \
                "$SIMULATION_URL"
            )"
            curl_status=$?
            set -e
            if [ "$curl_status" -ne 0 ]; then
              http_code="000"
            fi

            if [ "$http_code" = "200" ]; then
              break
            fi
            if [ "${GITHUB_EVENT_NAME}" = "push" ] && { [ "$http_code" = "000" ] || [ "$http_code" = "404" ] || [ "$http_code" = "502" ] || [ "$http_code" = "503" ] || [ "$http_code" = "504" ]; }; then
              echo "Déploiement IONOS pas encore prêt (HTTP $http_code), tentative $attempt/15."
              sleep 20
              continue
            fi
            echo "::error::Simulation de publication refusée (HTTP $http_code)."
            cat "$response_file" || true
            exit 1
          done

          if [ "$http_code" != "200" ]; then
            echo "::error::Le nouvel endpoint n'est pas devenu disponible après les tentatives de déploiement."
            cat "$response_file" || true
            exit 1
          fi

          jq -e '.ok == true' "$response_file" >/dev/null
          jq -e '
            .publication.mode == "simulation" and
            .publication.appStateWriteAttempted == false and
            .scope.publicStateWrites == 0 and
            .history.publicStateWrites == 0
          ' "$response_file" >/dev/null || {
            echo "::error::Le rapport de simulation ne reste pas strictement en lecture seule."
            exit 1
          }

          status="$(jq -r '.status // "unknown"' "$response_file")"
          blocked="$(jq '[.gates[]? | select(.status == "block")] | length' "$response_file")"
          warnings="$(jq '[.gates[]? | select(.status == "warn")] | length' "$response_file")"
          run_uuid="$(jq -r '.source.experimentalRun.runUuid // "—"' "$response_file")"
          generated_at="$(jq -r '.generatedAt // "—"' "$response_file")"
          public_revision="$(jq -r '.source.publicStateRevision // 0' "$response_file")"
          public_count="$(jq -r '.summary.publicCount // 0' "$response_file")"
          candidate_count="$(jq -r '.summary.candidateCount // 0' "$response_file")"
          entries="$(jq -r '.summary.counts.entries // 0' "$response_file")"
          exits="$(jq -r '.summary.counts.exits // 0' "$response_file")"
          up="$(jq -r '.summary.counts.up // 0' "$response_file")"
          down="$(jq -r '.summary.counts.down // 0' "$response_file")"
          stable="$(jq -r '.summary.counts.stable // 0' "$response_file")"
          maximum_move="$(jq -r '.summary.maximumAbsoluteRankMovement // 0' "$response_file")"
          median_move="$(jq -r '.summary.medianAbsoluteRankMovement // 0' "$response_file")"
          top10="$(jq -r 'if .summary.top10Retention == null then "—" else ((.summary.top10Retention * 100 | round) / 100 | tostring) + "%" end' "$response_file")"
          history_id="$(jq -r '.history.id // "—"' "$response_file")"
          stability_state="$(jq -r '.stability.state // "unknown"' "$response_file")"
          observed_reports="$(jq -r '.stability.observedReports // 0' "$response_file")"
          distinct_runs="$(jq -r '.stability.distinctExperimentalRuns // 0' "$response_file")"
          controlled_eligible="$(jq -r '.stability.controlledPublicationEligible // false' "$response_file")"
          duration="$(jq -r '.durationMs // 0' "$response_file")"

          if [ "$status" = "blocked" ]; then
            echo "::warning::La simulation est bloquée par $blocked garde-fou(s). Aucune publication n'a été tentée."
          elif [ "$status" = "review" ]; then
            echo "::warning::La simulation demande une revue ($warnings avertissement(s)). Aucune publication n'a été tentée."
          fi
          if [ "$controlled_eligible" = "true" ]; then
            echo "::notice::Trois recalculs distincts et cohérents sont observés. Seule une publication contrôlée peut désormais être préparée."
          fi

          {
            printf '### Simulation de publication MR-V1.0 → app_state\n'
            printf -- '- État du passage : `%s`\n' "$status"
            printf -- '- État de stabilité : `%s`\n' "$stability_state"
            printf -- '- Générée : %s\n' "$generated_at"
            printf -- '- dispatchId : `%s`\n' "$dispatch_id"
            printf -- '- Audit enregistré : `#%s`\n' "$history_id"
            printf -- '- runUuid expérimental : `%s`\n' "$run_uuid"
            printf -- '- Cycles observés / recalculs distincts : %s / %s\n' "$observed_reports" "$distinct_runs"
            printf -- '- Révision publique : `%s`\n' "$public_revision"
            printf -- '- Public / candidat : %s / %s\n' "$public_count" "$candidate_count"
            printf -- '- Entrées / sorties : %s / %s\n' "$entries" "$exits"
            printf -- '- Hausses / baisses / stables : %s / %s / %s\n' "$up" "$down" "$stable"
            printf -- '- Mouvement médian / maximal : %s / %s places\n' "$median_move" "$maximum_move"
            printf -- '- Conservation Top 10 : %s\n' "$top10"
            printf -- '- Garde-fous bloquants / avertissements : %s / %s\n' "$blocked" "$warnings"
            printf -- '- Éligible au passage public contrôlé : `%s`\n' "$controlled_eligible"
            printf -- '- Écritures app_state (simulation) : `0`\n'
            printf -- '- Publication réelle : workflow dédié apply (si flags serveur activés)\n'
            printf -- '- Durée : %s ms\n' "$duration"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            printf 'audit_id=%s\n' "$history_id"
            printf 'stability_state=%s\n' "$stability_state"
            printf 'observed_reports=%s\n' "$observed_reports"
            printf 'distinct_runs=%s\n' "$distinct_runs"
            printf 'controlled_eligible=%s\n' "$controlled_eligible"
            printf 'automatic_eligible=%s\n' "$(jq -r '.stability.automaticPublicationEligible // false' "$response_file")"
            printf 'sim_status=%s\n' "$status"
          } >> "$GITHUB_OUTPUT"

      # Appel direct du cron apply (évite le 403 GitHub sur workflow_dispatch via GITHUB_TOKEN).
      - name: Apply automatic publication when eligible
        if: ${{ steps.simulation.outcome == 'success' && steps.simulation.outputs.automatic_eligible == 'true' && steps.simulation.outputs.sim_status != 'blocked' }}
        id: auto_apply
        shell: bash
        env:
          CRON_URL: ${{ secrets.PASS50_METRICS_CRON_URL }}
          CRON_SECRET: ${{ secrets.PASS50_METRICS_CRON_SECRET }}
        run: |
          set -euo pipefail
          CRON_URL="${CRON_URL//www.pass50.store/pass50.store}"
          CRON_URL="${CRON_URL/#http:/https:}"
          case "$CRON_URL" in
            */metrics-cron.php)
              APPLY_URL="${CRON_URL%/metrics-cron.php}/metrics-ranking-publication-apply-cron.php"
              ;;
            *)
              echo "::error::PASS50_METRICS_CRON_URL doit se terminer par /metrics-cron.php"
              exit 1
              ;;
          esac
          case "$APPLY_URL" in
            http://*) APPLY_URL="https://${APPLY_URL#http://}" ;;
          esac
          case "$APPLY_URL" in
            https://www.pass50.store/*) APPLY_URL="https://pass50.store/${APPLY_URL#https://www.pass50.store/}" ;;
          esac

          dispatch_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-publication-apply-auto"
          body="$(jq -nc --arg dispatchId "$dispatch_id" '{action:"apply",dispatchId:$dispatchId,confirm:true}')"
          response_file="publication-apply-auto.json"
          timestamp="$(date +%s)"
          signature="$(
            printf '%s\n%s' "$timestamp" "$body" |
              openssl dgst -sha256 -hmac "$CRON_SECRET" -r |
              awk '{print $1}'
          )"

          set +e
          http_code="$(
            curl --silent --show-error --max-time 180 \
              --output "$response_file" \
              --write-out '%{http_code}' \
              -H "Content-Type: application/json" \
              -H "X-P50-Timestamp: $timestamp" \
              -H "X-P50-Signature: $signature" \
              --data "$body" \
              "$APPLY_URL"
          )"
          curl_status=$?
          set -e

          if [ "$curl_status" -ne 0 ] || [ "$http_code" != "200" ]; then
            echo "::error::Publication automatique refusée (curl ${curl_status:-?}, HTTP ${http_code:-000})."
            cat "$response_file" 2>/dev/null || true
            exit 1
          fi

          jq -e '.ok == true' "$response_file" >/dev/null || {
            echo "::error::Réponse de publication automatique invalide."
            cat "$response_file" || true
            exit 1
          }

          skipped="$(jq -r '.skipped // false' "$response_file")"
          status="$(jq -r '.status // "unknown"' "$response_file")"
          writes="$(jq -r '.publicStateWrites // 0' "$response_file")"
          revision="$(jq -r '.publicStateRevision // 0' "$response_file")"
          reason="$(jq -r '.reason // .error // "—"' "$response_file")"
          scores="$(jq -r '.scoresWritten // 0' "$response_file")"

          if [ "$skipped" = "true" ]; then
            if [ "$reason" = "automatic_disabled" ]; then
              echo "::error::Flags publication auto désactivés sur le serveur. Relancer Enable Ranking Publication Flags."
              exit 1
            fi
            echo "::warning::Publication automatique non exécutée : $reason"
          else
            if [ "$writes" = "0" ]; then
              echo "::error::Publication signalée OK mais 0 écriture publique."
              cat "$response_file" || true
              exit 1
            fi
            echo "::notice::Classement public mis à jour · révision $revision · $writes écriture(s) · $scores scores"
          fi

          {
            printf '### Publication automatique (post-simulation)\n'
            printf -- '- status : `%s`\n' "$status"
            printf -- '- skipped : `%s`\n' "$skipped"
            printf -- '- publicStateWrites : `%s`\n' "$writes"
            printf -- '- révision publique : `%s`\n' "$revision"
            printf -- '- scoresWritten : `%s`\n' "$scores"
            printf -- '- reason : %s\n' "$reason"
          } >> "$GITHUB_STEP_SUMMARY"

          printf 'apply_skipped=%s\n' "$skipped" >> "$GITHUB_OUTPUT"
          printf 'apply_revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
          printf 'apply_writes=%s\n' "$writes" >> "$GITHUB_OUTPUT"

      - name: Archive automatic apply result
        if: ${{ always() && steps.auto_apply.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: publication-apply-auto-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-apply-auto.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish sanitized simulation status
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STEP_OUTCOME: ${{ steps.simulation.outcome }}
          AUDIT_ID: ${{ steps.simulation.outputs.audit_id }}
          STABILITY_STATE: ${{ steps.simulation.outputs.stability_state }}
          OBSERVED_REPORTS: ${{ steps.simulation.outputs.observed_reports }}
          DISTINCT_RUNS: ${{ steps.simulation.outputs.distinct_runs }}
        run: |
          set -euo pipefail
          audit_id="${AUDIT_ID:-—}"
          stability_state="${STABILITY_STATE:-unavailable}"
          observed_reports="${OBSERVED_REPORTS:-0}"
          distinct_runs="${DISTINCT_RUNS:-0}"
          commit_state="success"
          description="audit #${audit_id} · ${stability_state} · ${observed_reports} rapports / ${distinct_runs} runs · app_state 0"
          if [ "$STEP_OUTCOME" != "success" ] || [ -z "${AUDIT_ID:-}" ]; then
            commit_state="failure"
            description="simulation non exécutée ou interrompue · app_state non publié"
          fi
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(jq -nc \
            --arg state "$commit_state" \
            --arg target_url "$target_url" \
            --arg description "$description" \
            --arg context "pass50/publication-simulation" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"

      - name: Archive full simulation report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: publication-simulation-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-simulation.json
          if-no-files-found: ignore
          retention-days: 30
