name: Metrics Ranking V2 Trigger

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'api/metrics-ranking-cron-v2.php'
      - 'api/metrics-ranking-fresh-capture-v2-core.php'
      - '.github/workflows/metrics-ranking-v2-trigger.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: pass50-metrics-ranking-v2-trigger
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CRON_URL: ${{ secrets.PASS50_METRICS_CRON_URL }}
    steps:
      - name: Wait for the versioned MR V2 contract
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CRON_URL" ]; then
            echo "::error::PASS50_METRICS_CRON_URL absent."
            exit 1
          fi
          case "$CRON_URL" in
            */api/metrics-cron.php)
              API_BASE="${CRON_URL%/metrics-cron.php}"
              ;;
            *)
              echo "::error::PASS50_METRICS_CRON_URL doit se terminer par /api/metrics-cron.php"
              exit 1
              ;;
          esac
          gate_url="$API_BASE/metrics-ranking-fresh-capture-v2-core.php"
          endpoint_url="$API_BASE/metrics-ranking-cron-v2.php"
          ready=false
          for attempt in $(seq 1 36); do
            gate_code="$(curl --location --silent --show-error --max-time 15 \
              --output /dev/null --write-out '%{http_code}' \
              -H 'Cache-Control: no-cache, no-store' \
              "$gate_url?contract=MR-FRESH-CAPTURE-V2.0&attempt=$attempt" || true)"
            endpoint_code="$(curl --location --silent --show-error --max-time 15 \
              --output /dev/null --write-out '%{http_code}' \
              -H 'Cache-Control: no-cache, no-store' \
              "$endpoint_url?contract=METRICS-RANKING-CRON-V2.0&attempt=$attempt" || true)"
            if [ "$gate_code" = "200" ] && [ "$endpoint_code" = "405" ]; then
              ready=true
              echo "Les contrats MR V2 sont servis (core 200, endpoint 405)."
              break
            fi
            echo "Contrat MR V2 en attente ($attempt/36, core ${gate_code:-000}, endpoint ${endpoint_code:-000})."
            sleep 10
          done
          if [ "$ready" != "true" ]; then
            echo "::error::Les fichiers MR V2 ne sont pas servis après six minutes."
            exit 1
          fi

      - name: Dispatch the protected MR workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg ref main '{ref:$ref}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/metrics-ranking-experimental.yml/dispatches"
          {
            echo '### Déclencheur MR V2'
            echo '- Core V2 servi : `HTTP 200`'
            echo '- Endpoint V2 servi : `HTTP 405` sur GET'
            echo '- Workflow MR protégé déclenché sur `main`'
            echo '- Écriture app_state : `0`'
          } >> "$GITHUB_STEP_SUMMARY"
