name: Apply Andrea Naomi canonical profile

on:
  push:
    branches:
      - agent/add-andrea-naomi-ng-guessan

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-andrea-naomi-ng-guessan
          fetch-depth: 0

      - name: Apply canonical profile
        run: python3 scripts/apply_andrea_naomi_profile.py

      - name: Validate profile and loaders
        run: |
          python3 -m json.tool pass50_nouveaux_candidats_90_v19.json >/dev/null
          python3 -m unittest tests.test_andrea_naomi_canonical_profile
          node --check v9-tools.js
          git diff --check

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pass50_nouveaux_candidats_90_v19.json v9-tools.js index.html sw.js tests
          git commit -m "Ajouter N’Guessan Andréa Naomi au recensement canonique"
          git push origin HEAD:agent/add-andrea-naomi-ng-guessan
