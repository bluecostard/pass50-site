name: Validate Classability Sync V1

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: JavaScript syntax
        run: |
          node --check classability-sync-v1.js
          node --check public-copy-fixes.js
          node --check sw.js
      - name: Classability behavior
        run: python3 -m unittest tests.test_classability_sync_v1
      - name: Diff check
        run: git diff --check origin/${{ github.base_ref }}...HEAD
