name: Purger les profils supprimés
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'api/profile-purge-cron-v1.php'
      - '.github/workflows/purge-deleted-profiles.yml'
permissions:
  contents: read
concurrency:
  group: pass50-profile-purge
  cancel-in-progress: false
jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CRON_URL: ${{ secrets.PASS50_METRICS_CRON_URL }}
      CRON_SECRET: ${{ secrets.PASS50_METRICS_CRON_SECRET }}
    steps:
      - name: Attendre le nouvel endpoint
        shell: bash
        run: |
          set -euo pipefail
          PURGE_URL="${CRON_URL%/metrics-cron.php}/profile-purge-cron-v1.php"
          for attempt in $(seq 1 36); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "$PURGE_URL" || true)"
            [ "$code" = "405" ] && exit 0
            sleep 10
          done
          exit 1
      - name: Purger les fiches déjà supprimées
        shell: bash
        run: |
          set -euo pipefail
          PURGE_URL="${CRON_URL%/metrics-cron.php}/profile-purge-cron-v1.php"
          dispatch_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          body="$(jq -nc --arg dispatchId "$dispatch_id" '{action:"purge",dispatchId:$dispatchId}')"
          timestamp="$(date +%s)"
          signature="$(printf '%s\n%s' "$timestamp" "$body" | openssl dgst -sha256 -hmac "$CRON_SECRET" -r | awk '{print $1}')"
          curl --fail-with-body -sS --max-time 120 -H 'Content-Type: application/json' -H "X-P50-Timestamp: $timestamp" -H "X-P50-Signature: $signature" --data "$body" "$PURGE_URL" | tee purge-result.json
          jq -e '.ok == true and .action == "purge"' purge-result.json >/dev/null
