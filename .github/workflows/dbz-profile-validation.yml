name: DBZ Profile Validation
# Validation définitive demandée par le propriétaire — 2026-08-11.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'api/dbz-profile-validation-cron-v1.php'
      - '.github/workflows/dbz-profile-validation.yml'

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CRON_URL: ${{ secrets.PASS50_METRICS_CRON_URL }}
      CRON_SECRET: ${{ secrets.PASS50_METRICS_CRON_SECRET }}
    steps:
      - name: Validate DBZ profile and official accounts
        shell: bash
        run: |
          set -euo pipefail
          case "${CRON_URL:-}" in
            */metrics-cron.php) ENDPOINT="${CRON_URL%/metrics-cron.php}/dbz-profile-validation-cron-v1.php" ;;
            *) echo '::error::PASS50_METRICS_CRON_URL invalide'; exit 1 ;;
          esac
          case "$ENDPOINT" in http://*) ENDPOINT="https://${ENDPOINT#http://}" ;; esac
          case "$ENDPOINT" in https://www.pass50.store/*) ENDPOINT="https://pass50.store/${ENDPOINT#https://www.pass50.store/}" ;; esac
          body="$(jq -nc --arg dispatchId "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" '{dispatchId:$dispatchId}')"
          for attempt in $(seq 1 36); do
            timestamp="$(date +%s)"
            signature="$(printf '%s\n%s' "$timestamp" "$body" | openssl dgst -sha256 -hmac "$CRON_SECRET" -r | awk '{print $1}')"
            code="$(curl --silent --show-error --max-time 90 --output /tmp/dbz-validation.json --write-out '%{http_code}' -H 'Content-Type: application/json' -H "X-P50-Timestamp: $timestamp" -H "X-P50-Signature: $signature" --data "$body" "$ENDPOINT" || true)"
            if [ "$code" = 200 ] && jq -e '.ok==true and .version=="DBZ-PROFILE-VALIDATION-V1.0" and .validatedCount==3 and .publicStateWrites==1' /tmp/dbz-validation.json >/dev/null 2>&1; then break; fi
            echo "Endpoint en attente · tentative $attempt/36 · HTTP ${code:-000}"
            sleep 10
          done
          jq -e '.ok==true and .validatedCount==3 and .publicStateWrites==1' /tmp/dbz-validation.json >/dev/null
          cat /tmp/dbz-validation.json

      - name: Archive validation proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbz-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/dbz-validation.json
          if-no-files-found: warn
          retention-days: 30
