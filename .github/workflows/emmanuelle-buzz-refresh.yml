name: Emmanuelle Buzz Refresh
# Déclenchement opérationnel 2026-08-06T16:30+02:00

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'api/emmanuelle-buzz-refresh-cron-v1.php'
      - '.github/workflows/emmanuelle-buzz-refresh.yml'
      - '.htaccess'

permissions:
  contents: read
  statuses: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CRON_URL: ${{ secrets.PASS50_METRICS_CRON_URL }}
      CRON_SECRET: ${{ secrets.PASS50_METRICS_CRON_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Refresh Emmanuelle Keita buzz
        id: refresh
        shell: bash
        run: |
          set -euo pipefail
          case "${CRON_URL:-}" in
            */metrics-cron.php) ENDPOINT="${CRON_URL%/metrics-cron.php}/emmanuelle-buzz-refresh-cron-v1.php" ;;
            *) echo '::error::PASS50_METRICS_CRON_URL invalide'; exit 1 ;;
          esac
          body="$(jq -nc --arg dispatchId "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" '{dispatchId:$dispatchId}')"
          for attempt in $(seq 1 36); do
            timestamp="$(date +%s)"
            signature="$(printf '%s\n%s' "$timestamp" "$body" | openssl dgst -sha256 -hmac "$CRON_SECRET" -r | awk '{print $1}')"
            code="$(curl --silent --show-error --max-time 120 --output /tmp/ek-buzz.json --write-out '%{http_code}' -H 'Content-Type: application/json' -H "X-P50-Timestamp: $timestamp" -H "X-P50-Signature: $signature" --data "$body" "$ENDPOINT" || true)"
            if [ "$code" = 200 ] && jq -e '.ok==true and .version=="EMMANUELLE-BUZZ-REFRESH-V1.0"' /tmp/ek-buzz.json >/dev/null 2>&1; then break; fi
            echo "Endpoint en attente · tentative $attempt/36 · HTTP ${code:-000}"
            sleep 10
          done
          jq -e '.ok==true and .version=="EMMANUELLE-BUZZ-REFRESH-V1.0"' /tmp/ek-buzz.json >/dev/null
          cat /tmp/ek-buzz.json
          echo "recent=$(jq -r '.recentEvents' /tmp/ek-buzz.json)" >> "$GITHUB_OUTPUT"
          echo "signal=$(jq -r '.signalWritten' /tmp/ek-buzz.json)" >> "$GITHUB_OUTPUT"

      - name: Publish refresh status
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.refresh.outcome }}
          RECENT: ${{ steps.refresh.outputs.recent }}
          SIGNAL: ${{ steps.refresh.outputs.signal }}
        run: |
          state=success
          description="Emmanuelle : ${RECENT:-0} événement(s) récent(s) · signal ${SIGNAL:-false}"
          if [ "$OUTCOME" != success ]; then state=failure; description='Refresh Emmanuelle interrompu'; fi
          payload="$(jq -nc --arg state "$state" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --arg description "$description" --arg context 'pass50/emmanuelle-buzz-refresh' '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl --fail-with-body --silent --show-error -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' --data "$payload" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"

      - name: Archive refresh report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emmanuelle-buzz-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/ek-buzz.json
          if-no-files-found: warn
          retention-days: 30
