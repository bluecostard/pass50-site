name: Content Freshness Platform Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'api/content-freshness-platform-audit-cron-v2.php'
      - 'api/content-freshness-cron-v4.php'
      - 'api/metrics-collector-facebook.php'
      - '.github/workflows/content-freshness-platform-audit.yml'
      - '.github/workflows/deploy-ionos.yml'
      - 'tests/test_content_freshness_platform_audit.py'
      - '.github/workflows/validate-content-freshness-platform-audit.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: pass50-content-freshness-platform-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CRON_URL: ${{ secrets.PASS50_METRICS_CRON_URL }}
      CRON_SECRET: ${{ secrets.PASS50_METRICS_CRON_SECRET }}
    steps:
      - name: Wait for deployed Content Platform Audit V2.1 on V4
        shell: bash
        run: |
          set -euo pipefail
          case "${CRON_URL:-}" in
            */metrics-cron.php) AUDIT_URL="${CRON_URL%/metrics-cron.php}/content-freshness-platform-audit-cron-v2.php" ;;
            *) echo '::error::PASS50_METRICS_CRON_URL invalide'; exit 1 ;;
          esac
          # www.pass50.store renvoie 301 vers apex : normaliser avant HMAC POST.
          AUDIT_URL="${AUDIT_URL/https:\/\/www.pass50.store/https:\/\/pass50.store}"
          [ -n "${CRON_SECRET:-}" ] || { echo '::error::Secret métrique absent'; exit 1; }
          ready=false
          for attempt in $(seq 1 30); do
            dispatch_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-platform-wait-probe-v21-$attempt"
            body="$(jq -nc --arg dispatchId "$dispatch_id" '{action:"probe",dispatchId:$dispatchId}')"
            timestamp="$(date +%s)"
            signature="$(printf '%s\n%s' "$timestamp" "$body" | openssl dgst -sha256 -hmac "$CRON_SECRET" -r | awk '{print $1}')"
            set +e
            http_code="$(curl --silent --show-error --max-time 30 --output /tmp/p50-platform-wait-probe.json --write-out '%{http_code}' -H 'Content-Type: application/json' -H 'Cache-Control: no-cache, no-store' -H "X-P50-Timestamp: $timestamp" -H "X-P50-Signature: $signature" --data "$body" "$AUDIT_URL")"
            curl_status=$?
            set -e
            if [ "$curl_status" -eq 0 ] && [ "$http_code" = 200 ] && jq -e '.ok==true and .action=="probe" and .contract=="CONTENT-PLATFORM-AUDIT-V2.1" and .contentFreshnessRuntime=="CONTENT-FRESHNESS-V4.0" and .collectionBucketMinutes==5 and .readOnly==true and .profilesExposed==false and .secretsExposed==false and .publicStateWrites==0' /tmp/p50-platform-wait-probe.json >/dev/null 2>&1; then
              ready=true
              break
            fi
            served="$(jq -r '.contentFreshnessRuntime // "inconnu"' /tmp/p50-platform-wait-probe.json 2>/dev/null || echo inconnu)"
            echo "Audit V2.1/V4 en attente ($attempt/30, curl $curl_status, HTTP ${http_code:-000}, runtime $served)."
            sleep 10
          done
          [ "$ready" = true ] || { echo '::error::Audit V2.1 sur runtime V4 non servi'; cat /tmp/p50-platform-wait-probe.json 2>/dev/null || true; exit 1; }

      - name: Probe read-only contract
        shell: bash
        run: |
          set -euo pipefail
          AUDIT_URL="${CRON_URL%/metrics-cron.php}/content-freshness-platform-audit-cron-v2.php"
          AUDIT_URL="${AUDIT_URL/https:\/\/www.pass50.store/https:\/\/pass50.store}"
          dispatch_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-platform-probe-v21"
          body="$(jq -nc --arg dispatchId "$dispatch_id" '{action:"probe",dispatchId:$dispatchId}')"
          timestamp="$(date +%s)"
          signature="$(printf '%s\n%s' "$timestamp" "$body" | openssl dgst -sha256 -hmac "$CRON_SECRET" -r | awk '{print $1}')"
          curl --fail-with-body --silent --show-error --max-time 55 -H 'Content-Type: application/json' -H "X-P50-Timestamp: $timestamp" -H "X-P50-Signature: $signature" --data "$body" "$AUDIT_URL" > content-platform-probe.json
          jq -e '.ok==true and .action=="probe" and .contract=="CONTENT-PLATFORM-AUDIT-V2.1" and .contentFreshnessRuntime=="CONTENT-FRESHNESS-V4.0" and .collectionBucketMinutes==5 and .readOnly==true and .profilesExposed==false and .secretsExposed==false and .publicStateWrites==0' content-platform-probe.json >/dev/null

      - name: Audit FI, Top 5 and source health
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          AUDIT_URL="${CRON_URL%/metrics-cron.php}/content-freshness-platform-audit-cron-v2.php"
          AUDIT_URL="${AUDIT_URL/https:\/\/www.pass50.store/https:\/\/pass50.store}"
          dispatch_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-platform-audit-v21"
          body="$(jq -nc --arg dispatchId "$dispatch_id" '{action:"audit",dispatchId:$dispatchId}')"
          response_file='content-platform-audit.json'; success=false
          for attempt in $(seq 1 5); do
            timestamp="$(date +%s)"
            signature="$(printf '%s\n%s' "$timestamp" "$body" | openssl dgst -sha256 -hmac "$CRON_SECRET" -r | awk '{print $1}')"
            set +e
            http_code="$(curl --silent --show-error --max-time 120 --output "$response_file" --write-out '%{http_code}' -H 'Content-Type: application/json' -H "X-P50-Timestamp: $timestamp" -H "X-P50-Signature: $signature" --data "$body" "$AUDIT_URL")"
            curl_status=$?
            set -e
            if [ "$curl_status" -eq 0 ] && [ "$http_code" = 200 ]; then success=true; break; fi
            if [ "$attempt" -lt 5 ] && [[ "$http_code" =~ ^(000|502|503|504)$ ]]; then sleep 15; else break; fi
          done
          [ "$success" = true ] || { echo '::error::Audit multiréseau V2.1 interrompu'; cat "$response_file" 2>/dev/null || true; exit 1; }
          jq -e '.ok==true and .action=="audit" and .contract=="CONTENT-PLATFORM-AUDIT-V2.1" and .runtime.contentFreshnessVersion=="CONTENT-FRESHNESS-V4.0" and .runtime.scheduleMinutes==5 and .runtime.collectionBucketMinutes==5 and .readOnly==true and .profilesExposed==false and .secretsExposed==false and .publicStateWrites==0' "$response_file" >/dev/null

          ready="$(jq -r '.ready // false' "$response_file")"
          coverage="$(jq -r '.fiNews.coveragePercent // 0' "$response_file")"
          youtube_share="$(jq -r '.trends.periods["24h"].youtubeSharePercent // 0' "$response_file")"
          youtube_periods="$(jq -r '(.trends.youtubeOnlyPeriods // []) | join(", ")' "$response_file")"
          x_category="$(jq -r '.sources.health.x.category // "unknown"' "$response_file")"
          x_status="$(jq -r '.sources.health.x.httpStatus // "—"' "$response_file")"
          tiktok_authorized="$(jq -r '.sources.health.tiktok.authorizedOauthProfiles // 0' "$response_file")"
          non_youtube="$(jq -r '.trends.periods["24h"].nonYoutubeCandidatesAvailable // false' "$response_file")"
          {
            echo '### Audit multiréseau PASS50 V2.1'
            printf -- '- Runtime / cadence / bucket : `%s` · %s min · %s min\n' "$(jq -r '.runtime.contentFreshnessVersion' "$response_file")" "$(jq -r '.runtime.scheduleMinutes' "$response_file")" "$(jq -r '.runtime.collectionBucketMinutes' "$response_file")"
            printf -- '- Santé X : `%s` · HTTP `%s`\n' "$x_category" "$x_status"
            printf -- '- Profils TikTok OAuth autorisés : %s\n' "$tiktok_authorized"
            printf -- '- Tâches 30 min par plateforme : `%s`\n' "$(jq -c '.fiveMinuteCollection.jobs30m // {}' "$response_file")"
            printf -- '- Runs 30 min par plateforme : `%s`\n' "$(jq -c '.fiveMinuteCollection.runs30m // {}' "$response_file")"
            printf -- '- Captures 24 h par plateforme : `%s`\n' "$(jq -c '.contentInventory.captures24h // {}' "$response_file")"
            printf -- '- Actualités FI par plateforme : `%s`\n' "$(jq -c '.fiNews.publishedByPlatform // {}' "$response_file")"
            printf -- '- Couverture FI : %s%%\n' "$coverage"
            printf -- '- Top 5 2H / 24H / 48H / 7J / 15J : `%s` / `%s` / `%s` / `%s` / `%s`\n' "$(jq -c '.trends.periods["2h"].top5PlatformCounts // {}' "$response_file")" "$(jq -c '.trends.periods["24h"].top5PlatformCounts // {}' "$response_file")" "$(jq -c '.trends.periods["48h"].top5PlatformCounts // {}' "$response_file")" "$(jq -c '.trends.periods["7d"].top5PlatformCounts // {}' "$response_file")" "$(jq -c '.trends.periods["15d"].top5PlatformCounts // {}' "$response_file")"
            printf -- '- Candidats 24H : `%s` · non-YouTube `%s`\n' "$(jq -c '.trends.periods["24h"].eligibleCandidatePlatformCounts // {}' "$response_file")" "$non_youtube"
            printf -- '- Périodes uniquement YouTube : %s\n' "${youtube_periods:-aucune}"
            echo '- Profils et secrets exposés : `non` · app_state : `0 écriture`'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            printf 'ready=%s\n' "$ready"
            printf 'coverage=%s\n' "$coverage"
            printf 'youtube_share=%s\n' "$youtube_share"
            printf 'youtube_periods=%s\n' "$youtube_periods"
            printf 'x_category=%s\n' "$x_category"
            printf 'tiktok_authorized=%s\n' "$tiktok_authorized"
          } >> "$GITHUB_OUTPUT"

      - name: Publish sanitized audit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.audit.outcome }}
          READY: ${{ steps.audit.outputs.ready }}
          COVERAGE: ${{ steps.audit.outputs.coverage }}
          YOUTUBE_SHARE: ${{ steps.audit.outputs.youtube_share }}
          YOUTUBE_PERIODS: ${{ steps.audit.outputs.youtube_periods }}
          X_CATEGORY: ${{ steps.audit.outputs.x_category }}
          TIKTOK: ${{ steps.audit.outputs.tiktok_authorized }}
        run: |
          set -euo pipefail
          state=success; description="actualité V2.1 · FI ${COVERAGE:-0}% · X ${X_CATEGORY:-?} · TikTok ${TIKTOK:-0}"
          if [ "${OUTCOME:-failure}" != success ]; then state=failure; description='audit actualité V2.1 interrompu · app_state 0';
          elif [ "${READY:-false}" != true ] || [ -n "${YOUTUBE_PERIODS:-}" ]; then state=pending; description="Top 5 YouTube seul: ${YOUTUBE_PERIODS:-—} · X ${X_CATEGORY:-?} · TikTok ${TIKTOK:-0}"; fi
          payload="$(jq -nc --arg state "$state" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --arg description "$description" --arg context 'pass50/content-platform-audit' '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl --fail-with-body --silent --show-error -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' --data "$payload" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"

      - name: Archive sanitized audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-platform-audit-v21-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            content-platform-probe.json
            content-platform-audit.json
          if-no-files-found: ignore
          retention-days: 30
