name: Content Freshness Platform Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'api/content-freshness-platform-audit-cron-v1.php'
      - '.github/workflows/content-freshness-platform-audit.yml'
      - 'tests/test_content_freshness_platform_audit.py'
      - '.github/workflows/validate-content-freshness-platform-audit.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: pass50-content-freshness-platform-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CRON_URL: ${{ secrets.PASS50_METRICS_CRON_URL }}
      CRON_SECRET: ${{ secrets.PASS50_METRICS_CRON_SECRET }}
    steps:
      - name: Wait for content platform audit endpoint
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CRON_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo '::error::Secrets métriques incomplets.'
            exit 1
          fi
          case "$CRON_URL" in
            */metrics-cron.php) AUDIT_URL="${CRON_URL%/metrics-cron.php}/content-freshness-platform-audit-cron-v1.php" ;;
            *) echo '::error::PASS50_METRICS_CRON_URL invalide.'; exit 1 ;;
          esac
          ready=false
          for attempt in $(seq 1 30); do
            code="$(curl --location --silent --show-error --max-time 15 \
              --output /dev/null --write-out '%{http_code}' \
              -H 'Cache-Control: no-cache, no-store' \
              "$AUDIT_URL?contract=CONTENT-PLATFORM-AUDIT-V1.0&attempt=$attempt" || true)"
            if [ "$code" = '405' ]; then ready=true; break; fi
            echo "Endpoint d’audit actualité en attente ($attempt/30, HTTP ${code:-000})."
            sleep 10
          done
          if [ "$ready" != 'true' ]; then
            echo '::error::L’endpoint d’audit actualité n’est pas servi après cinq minutes.'
            exit 1
          fi

      - name: Probe read-only contract
        shell: bash
        run: |
          set -euo pipefail
          case "$CRON_URL" in
            */metrics-cron.php) AUDIT_URL="${CRON_URL%/metrics-cron.php}/content-freshness-platform-audit-cron-v1.php" ;;
            *) exit 1 ;;
          esac
          dispatch_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-content-platform-probe"
          body="$(jq -nc --arg dispatchId "$dispatch_id" '{action:"probe",dispatchId:$dispatchId}')"
          timestamp="$(date +%s)"
          signature="$(printf '%s\n%s' "$timestamp" "$body" | openssl dgst -sha256 -hmac "$CRON_SECRET" -r | awk '{print $1}')"
          curl --fail-with-body --silent --show-error --max-time 55 \
            -H 'Content-Type: application/json' \
            -H "X-P50-Timestamp: $timestamp" \
            -H "X-P50-Signature: $signature" \
            --data "$body" "$AUDIT_URL" > content-platform-probe.json
          jq -e '
            .ok == true and
            .action == "probe" and
            .contract == "CONTENT-PLATFORM-AUDIT-V1.0" and
            .readOnly == true and
            .profilesExposed == false and
            .publicStateWrites == 0
          ' content-platform-probe.json >/dev/null

      - name: Audit collection, FI news and displayed Top 5
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          case "$CRON_URL" in
            */metrics-cron.php) AUDIT_URL="${CRON_URL%/metrics-cron.php}/content-freshness-platform-audit-cron-v1.php" ;;
            *) exit 1 ;;
          esac
          dispatch_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-content-platform-audit"
          body="$(jq -nc --arg dispatchId "$dispatch_id" '{action:"audit",dispatchId:$dispatchId}')"
          response_file='content-platform-audit.json'
          http_code='000'
          for attempt in $(seq 1 5); do
            timestamp="$(date +%s)"
            signature="$(printf '%s\n%s' "$timestamp" "$body" | openssl dgst -sha256 -hmac "$CRON_SECRET" -r | awk '{print $1}')"
            set +e
            http_code="$(curl --silent --show-error --max-time 120 \
              --output "$response_file" --write-out '%{http_code}' \
              -H 'Content-Type: application/json' \
              -H "X-P50-Timestamp: $timestamp" \
              -H "X-P50-Signature: $signature" \
              --data "$body" "$AUDIT_URL")"
            curl_status=$?
            set -e
            if [ "$curl_status" -eq 0 ] && [ "$http_code" = '200' ]; then break; fi
            if [ "$attempt" -lt 5 ] && { [ "$http_code" = '000' ] || [ "$http_code" = '502' ] || [ "$http_code" = '503' ] || [ "$http_code" = '504' ]; }; then
              echo "IONOS temporairement indisponible (HTTP ${http_code:-000}), tentative $attempt/5."
              sleep 15
              continue
            fi
            echo "::error::Audit actualité refusé (curl $curl_status, HTTP ${http_code:-000})."
            cat "$response_file" 2>/dev/null || true
            exit 1
          done
          jq -e '
            .ok == true and
            .action == "audit" and
            .contract == "CONTENT-PLATFORM-AUDIT-V1.0" and
            .readOnly == true and
            .profilesExposed == false and
            .publicStateWrites == 0
          ' "$response_file" >/dev/null

          ready="$(jq -r '.ready // false' "$response_file")"
          schedule="$(jq -r '.diagnosis.scheduleMinutes // 0' "$response_file")"
          bucket="$(jq -r '.diagnosis.collectionIdempotencyBucketMinutes // 0' "$response_file")"
          latest_job_age="$(jq -r '.diagnosis.latestPriority5JobAgeMinutes // -1' "$response_file")"
          latest_run_age="$(jq -r '.diagnosis.latestPriority5RunAgeMinutes // -1' "$response_file")"
          latest_trend_age="$(jq -r '.diagnosis.latestTrendRunAgeMinutes // -1' "$response_file")"
          jobs30="$(jq -r '.diagnosis.jobs30m // 0' "$response_file")"
          runs30="$(jq -r '.diagnosis.runs30m // 0' "$response_file")"
          new_contents="$(jq -r '.diagnosis.newContents1h // 0' "$response_file")"
          news_inserted="$(jq -r '.diagnosis.newsInserted1h // 0' "$response_file")"
          fi_profiles="$(jq -r '.diagnosis.fiProfilesWithOfficialNews72h // 0' "$response_file")"
          fi_coverage="$(jq -r '.diagnosis.fiCoveragePercent // 0' "$response_file")"
          capture_platforms="$(jq -r '.diagnosis.usableCapturePlatforms24h // 0' "$response_file")"
          news_platforms="$(jq -r '.diagnosis.officialNewsPlatforms72h // 0' "$response_file")"
          youtube_periods="$(jq -r '(.diagnosis.youtubeOnlyTop5Periods // []) | join(", ")' "$response_file")"
          news_by_platform="$(jq -c '.fiNews.publishedByPlatform // {}' "$response_file")"
          jobs_by_platform="$(jq -c '.fiveMinuteCollection.jobs30m // {}' "$response_file")"
          runs_by_platform="$(jq -c '.fiveMinuteCollection.runs30m // {}' "$response_file")"
          top2h="$(jq -c '.trends.periods["2h"].top5PlatformCounts // {}' "$response_file")"
          top24h="$(jq -c '.trends.periods["24h"].top5PlatformCounts // {}' "$response_file")"
          top48h="$(jq -c '.trends.periods["48h"].top5PlatformCounts // {}' "$response_file")"
          top7d="$(jq -c '.trends.periods["7d"].top5PlatformCounts // {}' "$response_file")"
          top15d="$(jq -c '.trends.periods["15d"].top5PlatformCounts // {}' "$response_file")"
          candidates24h="$(jq -c '.trends.periods["24h"].eligibleCandidatePlatformCounts // {}' "$response_file")"
          non_youtube24h="$(jq -r '.trends.periods["24h"].nonYoutubeCandidatesAvailable // false' "$response_file")"
          youtube_share24h="$(jq -r '.trends.periods["24h"].youtubeSharePercent // 0' "$response_file")"
          considered="$(jq -r '.trends.latestRun.contentsConsidered // 0' "$response_file")"
          rows="$(jq -r '.trends.latestRun.rowsWritten // 0' "$response_file")"

          {
            echo '### Audit de l’actualité PASS50'
            printf -- '- Audit prêt : `%s`\n' "$ready"
            printf -- '- Planification / bucket de collecte : %s min / %s min\n' "$schedule" "$bucket"
            printf -- '- Âge dernière tâche / collecte / tendance : %s / %s / %s min\n' "$latest_job_age" "$latest_run_age" "$latest_trend_age"
            printf -- '- Tâches / collectes effectives sur 30 min : %s / %s\n' "$jobs30" "$runs30"
            printf -- '- Nouveaux contenus / actualités insérées sur 1 h : %s / %s\n' "$new_contents" "$news_inserted"
            printf -- '- Plateformes avec captures 24 h / actus officielles 72 h : %s / %s\n' "$capture_platforms" "$news_platforms"
            printf -- '- FI avec actualité officielle 72 h : %s · couverture %s%%\n' "$fi_profiles" "$fi_coverage"
            printf -- '- Tâches 30 min par plateforme : `%s`\n' "$jobs_by_platform"
            printf -- '- Collectes 30 min par plateforme : `%s`\n' "$runs_by_platform"
            printf -- '- Actualités FI par plateforme : `%s`\n' "$news_by_platform"
            printf -- '- Dernier calcul de tendances : %s contenus · %s lignes\n' "$considered" "$rows"
            printf -- '- Top 5 2H : `%s`\n' "$top2h"
            printf -- '- Top 5 24H : `%s` · YouTube %s%%\n' "$top24h" "$youtube_share24h"
            printf -- '- Candidats éligibles 24H : `%s` · non-YouTube disponibles `%s`\n' "$candidates24h" "$non_youtube24h"
            printf -- '- Top 5 48H / 7J / 15J : `%s` / `%s` / `%s`\n' "$top48h" "$top7d" "$top15d"
            printf -- '- Périodes Top 5 uniquement YouTube : %s\n' "${youtube_periods:-aucune}"
            echo '- Profils individuels exposés : `non`'
            echo '- Écriture app_state : `0`'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            printf 'ready=%s\n' "$ready"
            printf 'latest_run_age=%s\n' "$latest_run_age"
            printf 'fi_coverage=%s\n' "$fi_coverage"
            printf 'youtube_share24h=%s\n' "$youtube_share24h"
            printf 'youtube_periods=%s\n' "$youtube_periods"
            printf 'non_youtube24h=%s\n' "$non_youtube24h"
          } >> "$GITHUB_OUTPUT"

      - name: Publish sanitized audit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          READY: ${{ steps.audit.outputs.ready }}
          LATEST_RUN_AGE: ${{ steps.audit.outputs.latest_run_age }}
          FI_COVERAGE: ${{ steps.audit.outputs.fi_coverage }}
          YOUTUBE_SHARE: ${{ steps.audit.outputs.youtube_share24h }}
          YOUTUBE_PERIODS: ${{ steps.audit.outputs.youtube_periods }}
        run: |
          set -euo pipefail
          state='success'
          description="actualité · FI ${FI_COVERAGE:-0}% · YouTube 24H ${YOUTUBE_SHARE:-0}% · app_state 0"
          if [ "${AUDIT_OUTCOME:-failure}" != 'success' ]; then
            state='failure';description='audit actualité interrompu · app_state inchangé'
          elif [ "${READY:-false}" != 'true' ]; then
            state='pending';description='audit actualité en attente du schéma · app_state 0'
          elif [ -n "${YOUTUBE_PERIODS:-}" ]; then
            state='pending';description="Top 5 YouTube seul: ${YOUTUBE_PERIODS} · FI ${FI_COVERAGE:-0}% · app_state 0"
          fi
          payload="$(jq -nc \
            --arg state "$state" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg description "$description" \
            --arg context 'pass50/content-platform-audit' \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl --fail-with-body --silent --show-error \
            -X POST -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$payload" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"

      - name: Archive sanitized audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-platform-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            content-platform-probe.json
            content-platform-audit.json
          if-no-files-found: ignore
          retention-days: 30
