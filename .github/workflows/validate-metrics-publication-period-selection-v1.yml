name: Validate Metrics Publication Period Selection V1

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: pass50_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      P50_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=pass50_test;charset=utf8mb4
      P50_TEST_DB_USER: root
      P50_TEST_DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PHP lint
        run: |
          php -l api/metrics-ranking-publication-period-core.php
          php -l api/metrics-ranking-publication-simulate-cron.php
          php -l tests/metrics_ranking_publication_period_selection_mariadb.php
      - name: Static cron tests
        run: python3 -m unittest tests.test_metrics_ranking_publication_simulation_cron_v1
      - name: MariaDB period fallback
        run: php tests/metrics_ranking_publication_period_selection_mariadb.php
      - name: Read-only guards
        run: |
          ! grep -E 'INSERT INTO app_state|UPDATE app_state|DELETE FROM app_state|REPLACE INTO app_state' api/metrics-ranking-publication-period-core.php api/metrics-ranking-publication-simulate-cron.php
          grep -F "classable=1 AND rank_position IS NOT NULL AND score IS NOT NULL" api/metrics-ranking-publication-period-core.php
          grep -F "requested_period_empty_fallback" api/metrics-ranking-publication-period-core.php
      - name: Diff check
        run: git diff --check origin/${{ github.base_ref }}...HEAD
