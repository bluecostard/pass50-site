name: Content Freshness Platform Audit Trigger

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/content-freshness-platform-audit-trigger.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch read-only platform audit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg ref main '{ref:$ref}')"
          curl --fail-with-body --silent --show-error -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/content-freshness-platform-audit.yml/dispatches"
          echo 'Audit plateformes FI / Top 5 déclenché en lecture seule.'
