name: PASS50 Intelligence & Signaux Refresh
# Déclenchement opérationnel après fusion — 2026-08-06T17:55+02:00

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'api/intelligence-refresh-cron-v2.php'
      - 'api/intelligence-dashboard-v2.php'
      - 'api/intelligence-signals-core.php'
      - 'api/intelligence.php'
      - 'intelligence-signals-ui-v1.js'
      - 'public-copy-fixes.js'
      - '.github/workflows/intelligence-refresh-v2.yml'
      - '.htaccess'

permissions:
  contents: read
  statuses: write

concurrency:
  group: pass50-intelligence-signals-production
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CRON_URL: ${{ secrets.PASS50_METRICS_CRON_URL }}
      CRON_SECRET: ${{ secrets.PASS50_METRICS_CRON_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish running status
        shell: bash
        run: |
          payload="$(jq -nc --arg state pending --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --arg description 'Fusion et recalcul Intelligence & Signaux en cours' --arg context 'pass50/intelligence-signals' '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl --fail-with-body --silent --show-error -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' --data "$payload" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"

      - name: Refresh PASS50 Intelligence & Signaux
        id: refresh
        shell: bash
        run: |
          set -euo pipefail
          case "${CRON_URL:-}" in
            */metrics-cron.php) ENDPOINT="${CRON_URL%/metrics-cron.php}/intelligence-refresh-cron-v2.php" ;;
            *) echo '::error::PASS50_METRICS_CRON_URL invalide'; exit 1 ;;
          esac
          body="$(jq -nc --arg dispatchId "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" '{dispatchId:$dispatchId}')"
          for attempt in $(seq 1 36); do
            timestamp="$(date +%s)"
            signature="$(printf '%s\n%s' "$timestamp" "$body" | openssl dgst -sha256 -hmac "$CRON_SECRET" -r | awk '{print $1}')"
            code="$(curl --silent --show-error --max-time 180 --output /tmp/intelligence-signals.json --write-out '%{http_code}' -H 'Content-Type: application/json' -H "X-P50-Timestamp: $timestamp" -H "X-P50-Signature: $signature" --data "$body" "$ENDPOINT" || true)"
            if [ "$code" = 200 ] && jq -e '.ok==true and .version=="PASS50-INTELLIGENCE-SIGNALS-REFRESH-V3.0"' /tmp/intelligence-signals.json >/dev/null 2>&1; then break; fi
            echo "Endpoint en attente · tentative $attempt/36 · HTTP ${code:-000}"
            sleep 10
          done
          jq -e '.ok==true and .version=="PASS50-INTELLIGENCE-SIGNALS-REFRESH-V3.0"' /tmp/intelligence-signals.json >/dev/null
          cat /tmp/intelligence-signals.json
          echo "processed=$(jq -r '.profilesProcessed' /tmp/intelligence-signals.json)" >> "$GITHUB_OUTPUT"
          echo "alerts=$(jq -r '.dashboard.summary.priorityAlerts' /tmp/intelligence-signals.json)" >> "$GITHUB_OUTPUT"
          echo "buzz=$(jq -r '.dashboard.summary.confirmedBuzz' /tmp/intelligence-signals.json)" >> "$GITHUB_OUTPUT"
          echo "pending=$(jq -r '.dashboard.summary.signalsPending' /tmp/intelligence-signals.json)" >> "$GITHUB_OUTPUT"

      - name: Publish refresh status
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.refresh.outcome }}
          PROCESSED: ${{ steps.refresh.outputs.processed }}
          ALERTS: ${{ steps.refresh.outputs.alerts }}
          BUZZ: ${{ steps.refresh.outputs.buzz }}
          PENDING: ${{ steps.refresh.outputs.pending }}
        run: |
          state=success
          description="${PROCESSED:-0} profils · ${ALERTS:-0} alertes · ${BUZZ:-0} buzz · ${PENDING:-0} à valider"
          if [ "$OUTCOME" != success ]; then state=failure; description='Refresh Intelligence & Signaux interrompu'; fi
          payload="$(jq -nc --arg state "$state" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --arg description "$description" --arg context 'pass50/intelligence-signals' '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl --fail-with-body --silent --show-error -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' --data "$payload" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"

      - name: Archive report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass50-intelligence-signals-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/intelligence-signals.json
          if-no-files-found: warn
          retention-days: 30
