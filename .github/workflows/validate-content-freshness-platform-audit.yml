name: Validate Content Freshness Platform Audit V2.1

on:
  pull_request:
    paths:
      - 'api/content-freshness-platform-audit-cron-v2.php'
      - '.github/workflows/content-freshness-platform-audit.yml'
      - '.github/workflows/deploy-ionos.yml'
      - 'tests/test_content_freshness_platform_audit.py'
      - '.github/workflows/validate-content-freshness-platform-audit.yml'
  push:
    branches: [main]
    paths:
      - 'api/content-freshness-platform-audit-cron-v2.php'
      - '.github/workflows/content-freshness-platform-audit.yml'
      - '.github/workflows/deploy-ionos.yml'
      - 'tests/test_content_freshness_platform_audit.py'
      - '.github/workflows/validate-content-freshness-platform-audit.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PHP lint
        run: php -l api/content-freshness-platform-audit-cron-v2.php
      - name: Read-only platform audit contract
        run: python3 -m unittest tests.test_content_freshness_platform_audit -v
      - name: Workflow safety markers
        run: |
          grep -q 'CONTENT-PLATFORM-AUDIT-V2.1' api/content-freshness-platform-audit-cron-v2.php
          ! grep -q 'CONTENT-PLATFORM-AUDIT-V2.0' api/content-freshness-platform-audit-cron-v2.php
          grep -q 'CONTENT-FRESHNESS-V4.0' api/content-freshness-platform-audit-cron-v2.php
          ! grep -q 'CONTENT-FRESHNESS-V3.2' api/content-freshness-platform-audit-cron-v2.php
          grep -q 'P50_CONTENT_FRESHNESS_BUCKET_MINUTES=5' api/content-freshness-platform-audit-cron-v2.php
          grep -q 'ORDER BY s.confidence DESC,s.profile_id ASC LIMIT 1' api/content-freshness-platform-audit-cron-v2.php
          ! grep -q 'ORDER BY s.confidence DESC,s.id' api/content-freshness-platform-audit-cron-v2.php
          grep -q 'array_replace.*verified_source_missing' api/content-freshness-platform-audit-cron-v2.php
          grep -q 'p50_cpa2_x_health' api/content-freshness-platform-audit-cron-v2.php
          grep -q 'authorizedOauthProfiles' api/content-freshness-platform-audit-cron-v2.php
          grep -q 'youtubeSharePercent' api/content-freshness-platform-audit-cron-v2.php
          grep -q 'platform-wait-probe-v21' .github/workflows/content-freshness-platform-audit.yml
          grep -q 'contentFreshnessRuntime=="CONTENT-FRESHNESS-V4.0"' .github/workflows/content-freshness-platform-audit.yml
          grep -q 'content-freshness-cron-v4.php' .github/workflows/content-freshness-platform-audit.yml
          grep -q 'put -O "$REMOTE_DIR/api" .deploy/api/content-freshness-platform-audit-cron-v2.php' .github/workflows/deploy-ionos.yml
          grep -q 'put -O "$REMOTE_DIR/api" .deploy/api/content-freshness-cron-v4.php' .github/workflows/deploy-ionos.yml
          grep -q 'put -O "$REMOTE_DIR/api" .deploy/api/metrics-collector-facebook.php' .github/workflows/deploy-ionos.yml
          ! grep -q 'actions: write' .github/workflows/content-freshness-platform-audit.yml
          ! grep -q 'UPDATE app_state' api/content-freshness-platform-audit-cron-v2.php
          ! grep -q "'profileId'=>" api/content-freshness-platform-audit-cron-v2.php
      - name: Diff safety
        run: git diff --check origin/${{ github.base_ref || 'main' }}...HEAD
