name: Activate Multi-Network Collectors

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'api/metrics-collector-readiness-cron.php'
      - 'api/tiktok-metrics-bridge-core.php'
      - '.github/workflows/activate-multinetwork-collectors.yml'
      - 'tests/test_metrics_social_collectors_v1.py'

permissions:
  actions: write
  contents: read
  statuses: write

concurrency:
  group: pass50-activate-multinetwork-collectors
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HOST: ${{ secrets.IONOS_SFTP_HOST }}
      USER: ${{ secrets.IONOS_SFTP_USER }}
      PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
      REMOTE_DIR: ${{ secrets.IONOS_REMOTE_DIR }}
      CRON_URL: ${{ secrets.PASS50_METRICS_CRON_URL }}
      CRON_SECRET: ${{ secrets.PASS50_METRICS_CRON_SECRET }}
      X_BEARER_TOKEN: ${{ secrets.PASS50_X_BEARER_TOKEN }}
      TIKTOK_ACCESS_TOKEN: ${{ secrets.PASS50_TIKTOK_ACCESS_TOKEN }}
      TIKTOK_RESEARCH_TOKEN: ${{ secrets.PASS50_TIKTOK_RESEARCH_TOKEN }}
      TIKTOK_RESEARCH_APPROVED: ${{ secrets.PASS50_TIKTOK_RESEARCH_APPROVED }}
      TIKTOK_MODE: ${{ secrets.PASS50_TIKTOK_MODE }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.PASS50_INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_ACCOUNT_ID: ${{ secrets.PASS50_INSTAGRAM_ACCOUNT_ID }}
      INSTAGRAM_DISCOVERY_ACCOUNT_ID: ${{ secrets.PASS50_INSTAGRAM_DISCOVERY_ACCOUNT_ID }}
      FACEBOOK_ACCESS_TOKEN: ${{ secrets.PASS50_FACEBOOK_ACCESS_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ secrets.PASS50_FACEBOOK_PAGE_ID }}
      SNAPCHAT_ACCESS_TOKEN: ${{ secrets.PASS50_SNAPCHAT_ACCESS_TOKEN }}
      META_GRAPH_VERSION: ${{ secrets.META_GRAPH_VERSION }}
    steps:
      - name: Installer SFTP et PHP
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp php-cli

      - name: Activer les credentials disponibles sur IONOS
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${HOST:-}" ] || [ -z "${USER:-}" ] || [ -z "${PASSWORD:-}" ] || [ -z "${REMOTE_DIR:-}" ]; then
            echo "::error::Secrets IONOS SFTP manquants."
            exit 1
          fi
          mkdir -p /tmp/p50-multinet
          lftp <<LFTP
          set cmd:fail-exit yes
          set sftp:auto-confirm yes
          open -u "$USER","$PASSWORD" sftp://$HOST:22
          get "$REMOTE_DIR/api/config.php" -o /tmp/p50-multinet/config.php
          bye
          LFTP

          python3 <<'PY'
          from pathlib import Path
          import json, os, re

          path=Path('/tmp/p50-multinet/config.php')
          text=path.read_text(encoding='utf-8')
          original=text
          patched=[]

          def php_string(value: str) -> str:
              return "'" + value.replace('\\','\\\\').replace("'","\\'") + "'"

          def metrics_open(src: str):
              for pattern in (r"(['\"]metrics['\"]\s*=>\s*\[)",r"(['\"]metrics['\"]\s*=>\s*array\s*\()"):
                  match=re.search(pattern,src,re.I)
                  if match:return match
              return None

          def upsert(src: str,key: str,rhs: str) -> str:
              line=re.compile(rf"^(\s*)['\"]{re.escape(key)}['\"]\s*=>.*?,\s*$",re.M)
              match=line.search(src)
              if match:
                  replacement=f"{match.group(1)}'{key}' => {rhs},"
                  if match.group(0).strip()==replacement.strip():return src
                  patched.append(key)
                  return src[:match.start()]+replacement+src[match.end():]
              opening=metrics_open(src)
              if opening is None:raise SystemExit('Section metrics introuvable dans api/config.php')
              patched.append(key)
              return src[:opening.end()]+f"\n        '{key}' => {rhs},"+src[opening.end():]

          def present(name: str) -> bool:
              return bool(os.environ.get(name,'').strip())

          text=upsert(text,'orchestrator_enabled','true')

          if present('X_BEARER_TOKEN'):
              text=upsert(text,'x_bearer_token',php_string(os.environ['X_BEARER_TOKEN'].strip()))

          display=present('TIKTOK_ACCESS_TOKEN')
          research=present('TIKTOK_RESEARCH_TOKEN')
          approved=os.environ.get('TIKTOK_RESEARCH_APPROVED','').strip().lower() in {'1','true','yes','on'}
          requested_mode=os.environ.get('TIKTOK_MODE','').strip()
          if display:
              text=upsert(text,'tiktok_access_token',php_string(os.environ['TIKTOK_ACCESS_TOKEN'].strip()))
              text=upsert(text,'tiktok_mode',php_string(requested_mode or 'authorized_display'))
          elif research and approved:
              text=upsert(text,'tiktok_research_token',php_string(os.environ['TIKTOK_RESEARCH_TOKEN'].strip()))
              text=upsert(text,'tiktok_research_approved','true')
              text=upsert(text,'tiktok_mode',php_string(requested_mode or 'approved_research'))

          if present('INSTAGRAM_ACCESS_TOKEN'):
              text=upsert(text,'instagram_access_token',php_string(os.environ['INSTAGRAM_ACCESS_TOKEN'].strip()))
              text=upsert(text,'instagram_enabled','true')
              if present('INSTAGRAM_DISCOVERY_ACCOUNT_ID'):
                  text=upsert(text,'instagram_discovery_account_id',php_string(os.environ['INSTAGRAM_DISCOVERY_ACCOUNT_ID'].strip()))
                  text=upsert(text,'instagram_mode',php_string('business_discovery'))
              else:
                  if present('INSTAGRAM_ACCOUNT_ID'):
                      text=upsert(text,'instagram_account_id',php_string(os.environ['INSTAGRAM_ACCOUNT_ID'].strip()))
                  text=upsert(text,'instagram_mode',php_string('professional_authorized'))

          if present('FACEBOOK_ACCESS_TOKEN'):
              text=upsert(text,'facebook_access_token',php_string(os.environ['FACEBOOK_ACCESS_TOKEN'].strip()))
              text=upsert(text,'facebook_enabled','true')
              text=upsert(text,'facebook_mode',php_string('page_authorized'))
              if present('FACEBOOK_PAGE_ID'):
                  text=upsert(text,'facebook_page_id',php_string(os.environ['FACEBOOK_PAGE_ID'].strip()))

          if present('SNAPCHAT_ACCESS_TOKEN'):
              text=upsert(text,'snapchat_access_token',php_string(os.environ['SNAPCHAT_ACCESS_TOKEN'].strip()))
              text=upsert(text,'snapchat_enabled','true')
              text=upsert(text,'snapchat_mode',php_string('public_profile_api'))

          if present('META_GRAPH_VERSION'):
              text=upsert(text,'meta_graph_version',php_string(os.environ['META_GRAPH_VERSION'].strip()))

          path.write_text(text,encoding='utf-8')
          report={
              'version':'MULTINET-ACTIVATION-V1.1',
              'githubSecretsPresent':{
                  'x':present('X_BEARER_TOKEN'),
                  'tiktokDisplay':display,
                  'tiktokResearch':research,
                  'tiktokResearchApproved':approved,
                  'instagram':present('INSTAGRAM_ACCESS_TOKEN'),
                  'facebook':present('FACEBOOK_ACCESS_TOKEN'),
                  'snapchat':present('SNAPCHAT_ACCESS_TOKEN'),
              },
              'patchedKeys':sorted(set(patched)),
              'configChanged':text!=original,
              'secretsExposed':False,
              'publicStateWrites':0,
          }
          Path('/tmp/p50-multinet/secret-presence.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print('Clés de configuration mises à jour :',len(set(patched)))
          PY

          php -l /tmp/p50-multinet/config.php
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          lftp <<LFTP
          set cmd:fail-exit yes
          set sftp:auto-confirm yes
          open -u "$USER","$PASSWORD" sftp://$HOST:22
          get "$REMOTE_DIR/api/config.php" -o /tmp/p50-multinet/config.php.bak
          put /tmp/p50-multinet/config.php.bak -o "$REMOTE_DIR/api/config.php.bak-multinet-$stamp"
          put /tmp/p50-multinet/config.php -o "$REMOTE_DIR/api/config.php"
          bye
          LFTP
          echo "Configuration multi-réseaux publiée avec sauvegarde serveur."

      - name: Vérifier la couverture et les candidats P0/P1
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CRON_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Secrets cron métriques manquants."
            exit 1
          fi
          case "$CRON_URL" in
            */metrics-cron.php) PROBE_URL="${CRON_URL%/metrics-cron.php}/metrics-collector-readiness-cron.php" ;;
            *) echo "::error::PASS50_METRICS_CRON_URL invalide"; exit 1 ;;
          esac
          ready=false
          for attempt in $(seq 1 48); do
            dispatch_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-multinet-probe-$attempt"
            body="$(jq -nc --arg dispatchId "$dispatch_id" '{action:"probe",dispatchId:$dispatchId}')"
            timestamp="$(date +%s)"
            signature="$(printf '%s\n%s' "$timestamp" "$body" | openssl dgst -sha256 -hmac "$CRON_SECRET" -r | awk '{print $1}')"
            code="$(curl --silent --show-error --max-time 35 --output /tmp/p50-multinet/probe.json --write-out '%{http_code}' \
              -H 'Content-Type: application/json' -H "X-P50-Timestamp: $timestamp" -H "X-P50-Signature: $signature" \
              --data "$body" "$PROBE_URL" || true)"
            if [ "$code" = "200" ] && jq -e '
              .ok == true and .version == "MULTINET-ACTIVATION-V1.1" and
              .runtime.tiktokBridge == "1.0.1" and .p0Preview.ok == true and .p1Preview.ok == true and
              .secretsExposed == false and .publicStateWrites == 0
            ' /tmp/p50-multinet/probe.json >/dev/null; then
              ready=true
              break
            fi
            echo "Diagnostic multi-réseaux V1.1 en attente (${attempt}/48, HTTP ${code:-0})."
            sleep 10
          done
          if [ "$ready" != "true" ]; then
            echo "::error::Diagnostic multi-réseaux V1.1 indisponible ou aperçu P0/P1 invalide."
            cat /tmp/p50-multinet/probe.json 2>/dev/null || true
            exit 1
          fi
          cp /tmp/p50-multinet/probe.json /tmp/p50-multinet/activation-report.json
          additional="$(jq '[.readiness.platforms | to_entries[] | select(.key != "YouTube" and (.value.operational // 0) > 0)] | length' /tmp/p50-multinet/probe.json)"
          p0_candidates="$(jq '.p0Preview.candidateCount // 0' /tmp/p50-multinet/probe.json)"
          p0_networks="$(jq '.p0Preview.candidatesByPlatform | length' /tmp/p50-multinet/probe.json)"
          p1_candidates="$(jq '.p1Preview.candidateCount // 0' /tmp/p50-multinet/probe.json)"
          p1_networks="$(jq '[.p1Preview.candidatesByPlatform | to_entries[] | select(.key != "YouTube" and .value > 0)] | length' /tmp/p50-multinet/probe.json)"
          {
            echo '### Activation collecte multi-réseaux'
            echo
            jq -r '.readiness.platforms | to_entries[] | select(.value != null) | "- \(.key) : \(.value.operational // 0)/\(.value.verifiedLinks // 0) lien(s) opérationnel(s) · couverture \(.value.coveragePercent // 0)% · modes `\((.value.modes // {})|tojson)`"' /tmp/p50-multinet/probe.json
            echo "- Candidats P0 : ${p0_candidates} · plateformes : \`$(jq -c '.p0Preview.candidatesByPlatform' /tmp/p50-multinet/probe.json)\`"
            echo "- Candidats P1 : ${p1_candidates} · plateformes : \`$(jq -c '.p1Preview.candidatesByPlatform' /tmp/p50-multinet/probe.json)\`"
            echo "- Réseaux supplémentaires opérationnels : ${additional}"
            echo '- Écriture app_state : `0`'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "additional_operational=$additional"
            echo "p0_candidates=$p0_candidates"
            echo "p0_networks=$p0_networks"
            echo "p1_candidates=$p1_candidates"
            echo "p1_networks=$p1_networks"
          } >> "$GITHUB_OUTPUT"

      - name: Collecter immédiatement les comptes OAuth prioritaires P0
        id: p0
        if: ${{ steps.probe.outcome == 'success' }}
        shell: bash
        env:
          EXPECTED_CANDIDATES: ${{ steps.probe.outputs.p0_candidates }}
        run: |
          set -euo pipefail
          dispatch_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-activation-p0"
          : > /tmp/p50-multinet/p0-diagnostics.jsonl
          signed_call() {
            local body="$1" output="$2" timestamp signature
            timestamp="$(date +%s)"
            signature="$(printf '%s\n%s' "$timestamp" "$body" | openssl dgst -sha256 -hmac "$CRON_SECRET" -r | awk '{print $1}')"
            curl --silent --show-error --max-time 55 --output "$output" --write-out '%{http_code}' \
              -H 'Content-Type: application/json' -H "X-P50-Timestamp: $timestamp" -H "X-P50-Signature: $signature" \
              --data "$body" "$CRON_URL" || true
          }

          if [ "${EXPECTED_CANDIDATES:-0}" = "0" ]; then
            jq -nc --arg dispatchId "$dispatch_id" '{ok:true,version:"INLINE-P0-V1.0",dispatchId:$dispatchId,skipped:true,reason:"no_p0_candidates",processed:0,remaining:0,capturesRecorded:0,byPlatform:{},publicStateWrites:0}' > /tmp/p50-multinet/p0-result.json
            echo 'processed=0' >> "$GITHUB_OUTPUT"
            echo 'remaining=0' >> "$GITHUB_OUTPUT"
            echo 'captures=0' >> "$GITHUB_OUTPUT"
            echo 'platforms=0' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          body="$(jq -nc --arg id "$dispatch_id" '{action:"dispatch",cadence:"p0",dispatchId:$id}')"
          code="$(signed_call "$body" /tmp/p50-multinet/p0-dispatch.json)"
          if [ "$code" != "200" ]; then
            error="$(jq -r '.error // "Erreur serveur sans détail."' /tmp/p50-multinet/p0-dispatch.json 2>/dev/null || printf 'Réponse non JSON')"
            jq -nc --arg dispatchId "$dispatch_id" --arg error "$error" --arg httpCode "$code" '{ok:false,version:"INLINE-P0-V1.0",dispatchId:$dispatchId,stage:"dispatch",httpCode:$httpCode,error:$error,publicStateWrites:0}' > /tmp/p50-multinet/p0-result.json
            echo "::error::Dispatch P0 refusé (HTTP $code) : $error"
            exit 1
          fi

          response="$(cat /tmp/p50-multinet/p0-dispatch.json)"
          remaining="$(jq -r '.queue.p0Remaining // .remaining // 0' <<<"$response")"
          processed=0; completed=0; partial=0; failed=0; skipped=0; work_error=''
          deadline=$((SECONDS + 720))
          for iteration in $(seq 1 120); do
            [ "$remaining" -eq 0 ] && break
            [ "$SECONDS" -ge "$deadline" ] && break
            body="$(jq -nc --arg id "$dispatch_id" --argjson iteration "$iteration" '{action:"work",cadence:"p0",dispatchId:$id,iteration:$iteration}')"
            output="/tmp/p50-multinet/p0-work-${iteration}.json"
            code="$(signed_call "$body" "$output")"
            if [ "$code" != "200" ]; then
              work_error="$(jq -r '.error // "Erreur serveur sans détail."' "$output" 2>/dev/null || printf 'Réponse non JSON')"
              echo "::error::Traitement P0 refusé à l'itération $iteration (HTTP $code) : $work_error"
              break
            fi
            response="$(cat "$output")"
            current="$(jq -r '.processed // 0' <<<"$response")"
            processed=$((processed + current))
            completed=$((completed + $(jq -r '.completed // 0' <<<"$response")))
            partial=$((partial + $(jq -r '.partial // 0' <<<"$response")))
            failed=$((failed + $(jq -r '.failed // 0' <<<"$response")))
            skipped=$((skipped + $(jq -r '.skipped // 0' <<<"$response")))
            if [ "$current" -eq 1 ]; then jq -c '.diagnostic // empty' <<<"$response" >> /tmp/p50-multinet/p0-diagnostics.jsonl; fi
            remaining="$(jq -r '.queue.p0Remaining // .remaining // 0' <<<"$response")"
            if [ "$current" -eq 0 ] && [ "$remaining" -gt 0 ]; then
              wait_seconds="$(jq -r '.queue.p0WaitSeconds // 5' <<<"$response")"
              if ! [[ "$wait_seconds" =~ ^[0-9]+$ ]]; then wait_seconds=5; fi
              [ "$wait_seconds" -lt 3 ] && wait_seconds=3
              [ "$wait_seconds" -gt 30 ] && wait_seconds=30
              remaining_runtime=$((deadline - SECONDS)); [ "$remaining_runtime" -le 0 ] && break
              [ "$wait_seconds" -gt "$remaining_runtime" ] && wait_seconds="$remaining_runtime"
              sleep "$wait_seconds"
            fi
          done

          if [ -s /tmp/p50-multinet/p0-diagnostics.jsonl ]; then diagnostics="$(jq -s '.' /tmp/p50-multinet/p0-diagnostics.jsonl)"; else diagnostics='[]'; fi
          captures="$(jq '[.[].capturesRecorded] | add // 0' <<<"$diagnostics")"
          duplicates="$(jq '[.[].duplicatesSkipped] | add // 0' <<<"$diagnostics")"
          quarantined="$(jq '[.[].quarantined] | add // 0' <<<"$diagnostics")"
          by_platform="$(jq 'group_by(.platform) | map({key:(.[0].platform // "unknown"),value:{tasks:length,captures:(map(.capturesRecorded)|add//0),duplicates:(map(.duplicatesSkipped)|add//0),quarantined:(map(.quarantined)|add//0),statuses:(group_by(.status)|map({key:(.[0].status//"unknown"),value:length})|from_entries)}}) | from_entries' <<<"$diagnostics")"
          jq -nc --arg dispatchId "$dispatch_id" --arg workError "$work_error" --argjson processed "$processed" --argjson completed "$completed" \
            --argjson partial "$partial" --argjson failed "$failed" --argjson skipped "$skipped" --argjson remaining "$remaining" \
            --argjson captures "$captures" --argjson duplicates "$duplicates" --argjson quarantined "$quarantined" \
            --argjson byPlatform "$by_platform" --argjson diagnostics "$diagnostics" \
            '{ok:($workError=="" and $remaining==0),version:"INLINE-P0-V1.0",dispatchId:$dispatchId,processed:$processed,completed:$completed,partial:$partial,failed:$failed,skipped:$skipped,remaining:$remaining,capturesRecorded:$captures,duplicatesSkipped:$duplicates,quarantined:$quarantined,byPlatform:$byPlatform,diagnostics:$diagnostics,workError:($workError|select(.!="")),publicStateWrites:0}' > /tmp/p50-multinet/p0-result.json
          {
            echo '### Collecte immédiate P0'
            echo "- Tâches traitées : $processed"
            echo "- Captures / doublons / quarantaine : $captures / $duplicates / $quarantined"
            echo "- Plateformes : \`$(jq -c . <<<"$by_platform")\`"
            echo "- File restante : $remaining"
            echo '- Écriture app_state : `0`'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "processed=$processed"
            echo "remaining=$remaining"
            echo "captures=$captures"
            echo "platforms=$(jq 'length' <<<"$by_platform")"
          } >> "$GITHUB_OUTPUT"
          [ -z "$work_error" ]

      - name: Déclencher une collecte P1 complète
        if: ${{ steps.probe.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg ref main '{ref:$ref}')"
          curl --fail-with-body --silent --show-error -X POST \
            -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$payload" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/metrics-top50-2h.yml/dispatches"
          echo 'Collecte P1 multi-réseaux déclenchée.'

      - name: Publier le statut d’activation
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          P0_OUTCOME: ${{ steps.p0.outcome }}
          ADDITIONAL: ${{ steps.probe.outputs.additional_operational }}
          P0_CANDIDATES: ${{ steps.probe.outputs.p0_candidates }}
          P0_CAPTURES: ${{ steps.p0.outputs.captures }}
          P0_REMAINING: ${{ steps.p0.outputs.remaining }}
          P1_NETWORKS: ${{ steps.probe.outputs.p1_networks }}
          P1_CANDIDATES: ${{ steps.probe.outputs.p1_candidates }}
        run: |
          set -euo pipefail
          state=success
          description="Multi-réseaux · ${ADDITIONAL:-0} réseau(x) actif(s) · P0 ${P0_CAPTURES:-0} capture(s) · P1 ${P1_NETWORKS:-0} réseau(x)"
          if [ "$PATCH_OUTCOME" != success ] || [ "$PROBE_OUTCOME" != success ] || [ "$P0_OUTCOME" != success ]; then
            state=failure
            description='Activation ou collecte P0 multi-réseaux interrompue'
          elif [ "${P0_REMAINING:-0}" != 0 ]; then
            state=pending
            description="Multi-réseaux actifs · P0 ${P0_REMAINING} tâche(s) en réessai"
          elif [ "${ADDITIONAL:-0}" = 0 ]; then
            state=pending
            description='Moteur prêt · credentials externes encore absents'
          fi
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(jq -nc --arg state "$state" --arg target_url "$target_url" --arg description "$description" --arg context 'pass50/multinetwork-collection' '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl --fail-with-body --silent --show-error -X POST \
            -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$payload" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"

      - name: Archiver le diagnostic sans secrets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multinetwork-activation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/p50-multinet/secret-presence.json
            /tmp/p50-multinet/activation-report.json
            /tmp/p50-multinet/p0-result.json
            /tmp/p50-multinet/p0-dispatch.json
            /tmp/p50-multinet/p0-work-*.json
          if-no-files-found: warn
          retention-days: 30
