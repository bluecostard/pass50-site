name: Metrics Ranking Experimental

on:
  schedule:
    - cron: '57 */2 * * *'
  workflow_dispatch:

concurrency:
  group: pass50-metrics-ranking-experimental
  cancel-in-progress: false

jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CRON_URL: ${{ secrets.PASS50_METRICS_CRON_URL }}
      CRON_SECRET: ${{ secrets.PASS50_METRICS_CRON_SECRET }}
    steps:
      - name: Calculate experimental ranking
        shell: bash
        run: |
          if [ -z "$CRON_URL" ] && [ -z "$CRON_SECRET" ]; then
            echo "::warning::PASS50 metrics cron secrets are not configured."
            exit 0
          fi
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Les deux secrets PASS50 metrics cron doivent être configurés."
            exit 1
          fi

          case "$CRON_URL" in
            */metrics-cron.php)
              RANKING_URL="${CRON_URL%/metrics-cron.php}/metrics-ranking-cron.php"
              ;;
            *)
              echo "::error::PASS50_METRICS_CRON_URL doit se terminer par /metrics-cron.php"
              exit 1
              ;;
          esac

          dispatch_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-ranking"
          body="$(jq -nc --arg dispatchId "$dispatch_id" '{action:"calculate",dispatchId:$dispatchId}')"
          timestamp="$(date +%s)"
          signature="$(
            printf '%s\n%s' "$timestamp" "$body" |
              openssl dgst -sha256 -hmac "$CRON_SECRET" -r |
              awk '{print $1}'
          )"
          response="$(
            curl --fail-with-body --silent --show-error --max-time 55 \
              -H "Content-Type: application/json" \
              -H "X-P50-Timestamp: $timestamp" \
              -H "X-P50-Signature: $signature" \
              --data "$body" \
              "$RANKING_URL"
          )"

          skipped="$(jq -r '.skipped // false' <<<"$response")"
          reason="$(jq -r '.reason // "executed"' <<<"$response")"
          readiness_state="$(jq -r '.readiness.state // "unknown"' <<<"$response")"
          active_jobs="$(jq -r '.readiness.p1.activeJobs // 0' <<<"$response")"
          failed_jobs="$(jq -r '.readiness.p1.failedJobs // 0' <<<"$response")"
          latest_capture="$(jq -r '.readiness.latestUsableCaptureAt // "—"' <<<"$response")"
          p1_finished="$(jq -r '.readiness.p1.finishedAt // "—"' <<<"$response")"
          run_uuid="$(jq -r '.runUuid // "—"' <<<"$response")"
          algorithm="$(jq -r '.algorithmVersion // "—"' <<<"$response")"
          periods="$(jq -r '(.periods // []) | join(", ")' <<<"$response")"
          classable="$(jq -r '.classableCount // 0' <<<"$response")"
          scores="$(jq -r '.scoresWritten // 0' <<<"$response")"
          duration="$(jq -r '.durationMs // 0' <<<"$response")"

          case "$reason" in
            executed) result="exécuté" ;;
            recent_success) result="reporté : succès récent" ;;
            collection_pending) result="reporté : collecte P1 encore en cours" ;;
            no_new_captures) result="reporté : aucune nouvelle capture" ;;
            p1_not_observed) result="reporté : aucun cycle P1 observé" ;;
            p1_stale) result="reporté : cycle P1 trop ancien" ;;
            no_usable_captures) result="reporté : aucune capture exploitable" ;;
            schema_missing) result="reporté : schéma métrique incomplet" ;;
            *) result="$([ "$skipped" = "true" ] && printf 'reporté : %s' "$reason" || printf 'exécuté')" ;;
          esac

          {
            printf '### Classement métrique expérimental\n'
            printf -- '- dispatchId : `%s`\n' "$dispatch_id"
            printf -- '- Calcul : %s\n' "$result"
            printf -- '- Disponibilité : `%s`\n' "$readiness_state"
            printf -- '- Fin du dernier P1 : %s\n' "$p1_finished"
            printf -- '- Jobs P1 actifs / échoués : %s / %s\n' "$active_jobs" "$failed_jobs"
            printf -- '- Dernière capture exploitable : %s\n' "$latest_capture"
            printf -- '- runUuid : `%s`\n' "$run_uuid"
            printf -- '- Algorithme : `%s`\n' "$algorithm"
            printf -- '- Périodes : %s\n' "${periods:-—}"
            printf -- '- Profils classables : %s\n' "$classable"
            printf -- '- Scores écrits : %s\n' "$scores"
            printf -- '- Durée : %s ms\n' "$duration"
          } >> "$GITHUB_STEP_SUMMARY"
