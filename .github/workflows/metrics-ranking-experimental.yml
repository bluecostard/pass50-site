name: Metrics Ranking Experimental
# Relance opérateur après plafonnement audience 2H — 2026-08-10 16:20 UTC.

on:
  schedule:
    - cron: '57 */2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'api/metrics-ranking-cron-v2.php'
      - 'api/metrics-ranking-fresh-capture-v2-core.php'
      - '.github/workflows/metrics-ranking-experimental.yml'

permissions:
  actions: write
  contents: read
  statuses: write

concurrency:
  group: pass50-metrics-ranking-experimental
  cancel-in-progress: false

jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CRON_URL: ${{ secrets.PASS50_METRICS_CRON_URL }}
      CRON_SECRET: ${{ secrets.PASS50_METRICS_CRON_SECRET }}
      STATUS_SHA: ${{ github.sha }}
    steps:
      - name: Wait for deployed MR V2 contract
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CRON_URL" ]; then
            echo "::error::PASS50_METRICS_CRON_URL absent."
            exit 1
          fi
          case "$CRON_URL" in
            */api/metrics-cron.php)
              API_BASE="${CRON_URL%/metrics-cron.php}"
              SITE_BASE="${API_BASE%/api}"
              ;;
            *)
              echo "::error::PASS50_METRICS_CRON_URL doit se terminer par /api/metrics-cron.php"
              exit 1
              ;;
          esac
          deployment_url="$SITE_BASE/deployment-version.json"
          gate_url="$API_BASE/metrics-ranking-fresh-capture-v2-core.php"
          endpoint_url="$API_BASE/metrics-ranking-cron-v2.php"
          deployed=false
          for attempt in $(seq 1 36); do
            marker="$(curl --location --silent --show-error --max-time 15 \
              -H 'Cache-Control: no-cache, no-store' \
              "$deployment_url?sha=$GITHUB_SHA&attempt=$attempt" || true)"
            gate_code="$(curl --location --silent --show-error --max-time 15 \
              --output /dev/null --write-out '%{http_code}' \
              -H 'Cache-Control: no-cache, no-store' \
              "$gate_url?sha=$GITHUB_SHA&attempt=$attempt" || true)"
            endpoint_code="$(curl --location --silent --show-error --max-time 15 \
              --output /dev/null --write-out '%{http_code}' \
              -H 'Cache-Control: no-cache, no-store' \
              "$endpoint_url?sha=$GITHUB_SHA&attempt=$attempt" || true)"
            if jq -e --arg sha "$GITHUB_SHA" '.commit == $sha' >/dev/null 2>&1 <<<"$marker" \
              && [ "$gate_code" = "200" ] && [ "$endpoint_code" = "405" ]; then
              deployed=true
              echo "Le commit $GITHUB_SHA, METRICS-RANKING-CRON-V2.0 et MR-FRESH-CAPTURE-V2.0 sont servis."
              break
            fi
            echo "Déploiement MR V2 en attente ($attempt/36, core ${gate_code:-000}, endpoint ${endpoint_code:-000})."
            sleep 10
          done
          if [ "$deployed" != "true" ]; then
            echo "::error::Le contrat MR V2 n'est pas servi après six minutes."
            exit 1
          fi

      - name: Calculate experimental ranking
        id: ranking
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CRON_URL" ] && [ -z "$CRON_SECRET" ]; then
            echo "::warning::PASS50 metrics cron secrets are not configured."
            exit 0
          fi
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Les deux secrets PASS50 metrics cron doivent être configurés."
            exit 1
          fi

          case "$CRON_URL" in
            */metrics-cron.php)
              RANKING_URL="${CRON_URL%/metrics-cron.php}/metrics-ranking-cron-v2.php"
              ;;
            *)
              echo "::error::PASS50_METRICS_CRON_URL doit se terminer par /metrics-cron.php"
              exit 1
              ;;
          esac

          dispatch_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-ranking"
          body="$(jq -nc --arg dispatchId "$dispatch_id" '{action:"calculate",dispatchId:$dispatchId}')"
          timestamp="$(date +%s)"
          signature="$(
            printf '%s\n%s' "$timestamp" "$body" |
              openssl dgst -sha256 -hmac "$CRON_SECRET" -r |
              awk '{print $1}'
          )"
          response="$(
            curl --fail-with-body --silent --show-error --max-time 55 \
              -H "Content-Type: application/json" \
              -H "X-P50-Timestamp: $timestamp" \
              -H "X-P50-Signature: $signature" \
              --data "$body" \
              "$RANKING_URL"
          )"
          printf '%s\n' "$response" > ranking-experimental-result.json
          if ! jq -e '.endpointVersion == "METRICS-RANKING-CRON-V2.0" and .freshCaptureGateVersion == "MR-FRESH-CAPTURE-V2.0"' >/dev/null 2>&1 <<<"$response"; then
            echo "::error::Réponse MR obsolète ou contrat V2 absent."
            cat ranking-experimental-result.json
            exit 1
          fi

          skipped="$(jq -r '.skipped // false' <<<"$response")"
          reason="$(jq -r '.reason // "executed"' <<<"$response")"
          endpoint_version="$(jq -r '.endpointVersion // "—"' <<<"$response")"
          readiness_state="$(jq -r '.readiness.state // "unknown"' <<<"$response")"
          active_jobs="$(jq -r '.readiness.p1.activeJobs // 0' <<<"$response")"
          failed_jobs="$(jq -r '.readiness.p1.failedJobs // 0' <<<"$response")"
          latest_capture="$(jq -r '.readiness.latestUsableCaptureAt // "—"' <<<"$response")"
          latest_recorded="$(jq -r '.latestUsableCaptureRecordedAt // "—"' <<<"$response")"
          p1_finished="$(jq -r '.readiness.p1.finishedAt // "—"' <<<"$response")"
          run_uuid="$(jq -r '.runUuid // ""' <<<"$response")"
          algorithm="$(jq -r '.algorithmVersion // "—"' <<<"$response")"
          periods="$(jq -r '(.periods // []) | join(", ")' <<<"$response")"
          classable="$(jq -r '.classableCount // 0' <<<"$response")"
          scores="$(jq -r '.scoresWritten // 0' <<<"$response")"
          fresh_gate="$(jq -r '.freshCaptureGateVersion // "—"' <<<"$response")"
          fresh_override="$(jq -r '.freshCaptureOverride // false' <<<"$response")"
          duration="$(jq -r '.durationMs // 0' <<<"$response")"
          refresh_p1=false

          case "$reason" in
            executed) result="exécuté" ;;
            recent_success) result="reporté : succès récent sans capture nouvellement ingérée" ;;
            collection_pending) result="reporté : collecte P1 encore en cours" ;;
            no_new_captures) result="reporté : aucune nouvelle capture" ;;
            p1_not_observed) result="reporté : aucun cycle P1 observé"; refresh_p1=true ;;
            p1_stale) result="reporté : cycle P1 trop ancien"; refresh_p1=true ;;
            p1_future_timestamp) result="reporté : horodatage P1 invalide"; refresh_p1=true ;;
            no_usable_captures) result="reporté : aucune capture exploitable" ;;
            schema_missing) result="reporté : schéma métrique incomplet" ;;
            *) result="$([ "$skipped" = "true" ] && printf 'reporté : %s' "$reason" || printf 'exécuté')" ;;
          esac

          {
            printf '### Classement métrique expérimental\n'
            printf -- '- dispatchId : `%s`\n' "$dispatch_id"
            printf -- '- Endpoint : `%s`\n' "$endpoint_version"
            printf -- '- Calcul : %s\n' "$result"
            printf -- '- Disponibilité : `%s`\n' "$readiness_state"
            printf -- '- Fin du dernier P1 : %s\n' "$p1_finished"
            printf -- '- Jobs P1 actifs / échoués : %s / %s\n' "$active_jobs" "$failed_jobs"
            printf -- '- Dernière capture exploitable : %s\n' "$latest_capture"
            printf -- '- Dernière ingestion déclenchante : %s\n' "$latest_recorded"
            printf -- '- Garde de fraîcheur : `%s`\n' "$fresh_gate"
            printf -- '- Recalcul anticipé par capture nouvelle : `%s`\n' "$fresh_override"
            printf -- '- runUuid : `%s`\n' "${run_uuid:-—}"
            printf -- '- Algorithme : `%s`\n' "$algorithm"
            printf -- '- Périodes : %s\n' "${periods:-—}"
            printf -- '- Profils classables : %s\n' "$classable"
            printf -- '- Scores écrits : %s\n' "$scores"
            printf -- '- Rafraîchissement P1 requis : `%s`\n' "$refresh_p1"
            printf -- '- Écriture app_state : `0`\n'
            printf -- '- Durée : %s ms\n' "$duration"
          } >> "$GITHUB_STEP_SUMMARY"
          {
            printf 'skipped=%s\n' "$skipped"
            printf 'reason=%s\n' "$reason"
            printf 'readiness_state=%s\n' "$readiness_state"
            printf 'run_uuid=%s\n' "$run_uuid"
            printf 'classable=%s\n' "$classable"
            printf 'scores=%s\n' "$scores"
            printf 'fresh_override=%s\n' "$fresh_override"
            printf 'refresh_p1=%s\n' "$refresh_p1"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch fresh P1 when readiness expired
        id: refresh_p1
        if: ${{ steps.ranking.outcome == 'success' && steps.ranking.outputs.refresh_p1 == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg ref "main" '{ref:$ref}')"
          curl --fail-with-body --silent --show-error \
            -X POST -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/metrics-top50-2h.yml/dispatches"
          printf '### Auto-récupération P1\n- Un nouveau cycle P1 a été déclenché avant tout nouveau calcul MR-V1.0.\n- Aucune simulation de publication n’est lancée sur le calcul périmé.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish sanitized experimental status
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STEP_OUTCOME: ${{ steps.ranking.outcome }}
          REFRESH_OUTCOME: ${{ steps.refresh_p1.outcome }}
          SKIPPED: ${{ steps.ranking.outputs.skipped }}
          REASON: ${{ steps.ranking.outputs.reason }}
          READINESS_STATE: ${{ steps.ranking.outputs.readiness_state }}
          CLASSABLE: ${{ steps.ranking.outputs.classable }}
          REFRESH_P1: ${{ steps.ranking.outputs.refresh_p1 }}
        run: |
          set -euo pipefail
          state="success"
          reason="${REASON:-unavailable}"
          readiness="${READINESS_STATE:-unknown}"
          classable="${CLASSABLE:-0}"
          skipped="${SKIPPED:-true}"
          refresh_p1="${REFRESH_P1:-false}"
          description="MR-V1.0 ${reason} · ${readiness} · ${classable} classables · app_state 0"
          if [ "$STEP_OUTCOME" != "success" ] || [ -z "${REASON:-}" ]; then
            state="failure"
            description="MR-V1.0 interrompu · classement public inchangé"
          elif [ "$refresh_p1" = "true" ]; then
            if [ "${REFRESH_OUTCOME:-failure}" = "success" ]; then
              state="pending"
              description="MR-V1.0 ${reason} · nouveau P1 déclenché · app_state 0"
            else
              state="failure"
              description="MR-V1.0 ${reason} · relance P1 impossible · app_state 0"
            fi
          elif [ "$skipped" = "true" ] && [ "$reason" = "collection_pending" ]; then
            state="pending"
            description="MR-V1.0 en attente de P1 · classement public inchangé"
          elif [ "$reason" = "schema_missing" ]; then
            state="failure"
            description="MR-V1.0 schéma incomplet · classement public inchangé"
          fi
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(jq -nc --arg state "$state" --arg target_url "$target_url" --arg description "$description" --arg context "pass50/experimental-ranking" '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl --fail-with-body --silent --show-error \
            -X POST -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}"

      - name: Archive experimental result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ranking-experimental-${{ github.run_id }}-${{ github.run_attempt }}
          path: ranking-experimental-result.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Dispatch publication simulation
        if: ${{ steps.ranking.outcome == 'success' && steps.ranking.outputs.skipped == 'false' && steps.ranking.outputs.run_uuid != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg ref "main" '{ref:$ref}')"
          curl --fail-with-body --silent --show-error \
            -X POST -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/metrics-ranking-publication-simulation.yml/dispatches"
