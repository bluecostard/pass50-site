name: Diagnose Apoutchou Facebook Video

on:
  push:
    branches: [ops/diagnose-apoutchou-facebook-video-v1]
  pull_request:
    paths:
      - '.github/workflows/diagnose-apoutchou-facebook-video.yml'

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Apoutchou public feed
        shell: bash
        run: |
          set -euo pipefail
          url="https://www.pass50.store/api/content-feed.php?period=24h&profileId=apoutchou&newsLimit=30&_=${GITHUB_RUN_ID}"
          curl --fail-with-body --silent --show-error --max-time 30 -H 'Accept: application/json' -H 'Cache-Control: no-cache, no-store' "$url" > apoutchou-feed.json
          jq -e '.ok==true and .ready==true' apoutchou-feed.json >/dev/null
          jq '[.news[] | select((.platform|ascii_downcase)=="facebook") | {id,itemType,url,playableInPass50,facebookEmbedType}]' apoutchou-feed.json > apoutchou-facebook.json
          count="$(jq 'length' apoutchou-facebook.json)"
          echo "Facebook items: $count"
          [ "$count" -gt 0 ] || { echo '::error::Aucune actualité Facebook pour Apoutchou'; exit 1; }
      - name: Compare Facebook plugins
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          : > plugin-results.jsonl
          while IFS= read -r item; do
            source="$(jq -r '.url' <<<"$item")"
            item_type="$(jq -r '.itemType // ""' <<<"$item")"
            path="$(python3 - "$source" <<'PY'
import sys, urllib.parse
u=urllib.parse.urlparse(sys.argv[1])
print((u.hostname or '')+(u.path or ''))
PY
)"
            encoded="$(python3 - "$source" <<'PY'
import sys, urllib.parse
print(urllib.parse.quote(sys.argv[1], safe=''))
PY
)"
            for plugin in video post; do
              plugin_url="https://www.facebook.com/plugins/${plugin}.php?href=${encoded}&show_text=false&width=820"
              body="plugin-${plugin}.html"
              code="$(curl --location --silent --show-error --max-time 30 --output "$body" --write-out '%{http_code}' -H 'Accept-Language: fr-FR,fr;q=0.9,en;q=0.8' "$plugin_url" || true)"
              unavailable=false
              if grep -Eqi "content[^<]{0,80}(isn.t|not) available|contenu[^<]{0,80}(n.est pas|indisponible)|publication[^<]{0,80}indisponible" "$body" 2>/dev/null; then unavailable=true; fi
              jq -nc --arg path "$path" --arg itemType "$item_type" --arg plugin "$plugin" --arg code "$code" --argjson unavailable "$unavailable" '{path:$path,itemType:$itemType,plugin:$plugin,httpStatus:($code|tonumber? // 0),unavailableMessage:$unavailable}' >> plugin-results.jsonl
            done
          done < <(jq -c '.[]' apoutchou-facebook.json)
          jq -s '.' plugin-results.jsonl > plugin-results.json
          jq . plugin-results.json
          first_path="$(jq -r '.[0].path // "aucun"' plugin-results.json)"
          first_type="$(jq -r '.[0].itemType // "inconnu"' plugin-results.json)"
          video_unavailable="$(jq -r '[.[] | select(.plugin=="video") | .unavailableMessage] | any' plugin-results.json)"
          post_unavailable="$(jq -r '[.[] | select(.plugin=="post") | .unavailableMessage] | any' plugin-results.json)"
          {
            printf 'path=%s\n' "$first_path"
            printf 'item_type=%s\n' "$first_type"
            printf 'video_unavailable=%s\n' "$video_unavailable"
            printf 'post_unavailable=%s\n' "$post_unavailable"
          } >> "$GITHUB_OUTPUT"
          {
            echo '### Diagnostic Apoutchou Facebook'
            echo '```json'
            jq '.' plugin-results.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish diagnostic status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PATH_RESULT: ${{ steps.compare.outputs.path }}
          ITEM_TYPE: ${{ steps.compare.outputs.item_type }}
          VIDEO_UNAVAILABLE: ${{ steps.compare.outputs.video_unavailable }}
          POST_UNAVAILABLE: ${{ steps.compare.outputs.post_unavailable }}
          OUTCOME: ${{ steps.compare.outcome }}
        run: |
          set -euo pipefail
          state=success
          description="type=${ITEM_TYPE:-?}; video indispo=${VIDEO_UNAVAILABLE:-?}; post indispo=${POST_UNAVAILABLE:-?}; ${PATH_RESULT:-?}"
          if [ "${OUTCOME:-failure}" != success ]; then state=failure; description='diagnostic Apoutchou interrompu'; fi
          description="${description:0:140}"
          payload="$(jq -nc --arg state "$state" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --arg description "$description" --arg context 'pass50/apoutchou-facebook-diagnostic' '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl --fail-with-body --silent --show-error -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' --data "$payload" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
      - name: Archive sanitized diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apoutchou-facebook-video-diagnostic-${{ github.run_id }}
          path: |
            apoutchou-facebook.json
            plugin-results.json
          if-no-files-found: ignore
          retention-days: 7
