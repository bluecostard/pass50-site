name: Metrics Public Baseline P1
# Contract history: PUBLIC-BASELINE-P1-V1.1 -> V1.2 -> V1.3
# V1.3: priorité Top 40 public, cible fraîcheur <=45 min, file distincte.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'api/metrics-public-baseline-core.php'
      - 'api/metrics-public-baseline-cron.php'
      - 'api/metrics-social-collectors-core.php'
      - 'api/metrics-collector-readiness-core.php'
      - '.github/workflows/metrics-public-baseline-p1.yml'

permissions:
  actions: write
  contents: read
  statuses: write

concurrency:
  group: pass50-metrics-public-baseline-p1
  cancel-in-progress: false

jobs:
  supplement:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CRON_URL: ${{ secrets.PASS50_METRICS_CRON_URL }}
      CRON_SECRET: ${{ secrets.PASS50_METRICS_CRON_SECRET }}
      STATUS_SHA: ${{ github.sha }}
    steps:
      - name: Wait for public-baseline contract
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then echo "::error::Secrets métriques incomplets."; exit 1; fi
          case "$CRON_URL" in
            */metrics-cron.php) BASELINE_URL="${CRON_URL%/metrics-cron.php}/metrics-public-baseline-cron.php" ;;
            *) echo "::error::PASS50_METRICS_CRON_URL invalide."; exit 1 ;;
          esac
          case "$BASELINE_URL" in http://*) BASELINE_URL="https://${BASELINE_URL#http://}" ;; esac
          case "$BASELINE_URL" in https://www.pass50.store/*) BASELINE_URL="https://pass50.store/${BASELINE_URL#https://www.pass50.store/}" ;; esac
          dispatch_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-baseline-probe"
          body="$(jq -nc --arg dispatchId "$dispatch_id" '{action:"probe",dispatchId:$dispatchId}')"
          deployed=false
          for attempt in $(seq 1 30); do
            timestamp="$(date +%s)"
            signature="$(printf '%s\n%s' "$timestamp" "$body" | openssl dgst -sha256 -hmac "$CRON_SECRET" -r | awk '{print $1}')"
            set +e
            code="$(curl --silent --show-error --max-time 55 --output baseline-probe.json --write-out '%{http_code}' \
              -H "Content-Type: application/json" -H "X-P50-Timestamp: $timestamp" -H "X-P50-Signature: $signature" \
              --data "$body" "$BASELINE_URL")"; curl_status=$?
            set -e
            if [ "$curl_status" -eq 0 ] && [ "$code" = "200" ] && jq -e '.contract == "PUBLIC-BASELINE-P1-V1.3" and .readOnly == true and .publicStateWrites == 0' baseline-probe.json >/dev/null 2>&1; then deployed=true; break; fi
            echo "Contrat PUBLIC-BASELINE-P1-V1.3 en attente, tentative $attempt/30 (HTTP ${code:-000})."
            sleep 20
          done
          if [ "$deployed" != "true" ]; then echo "::error::Contrat de couverture P1 V1.3 non déployé."; cat baseline-probe.json 2>/dev/null || true; exit 1; fi

      - name: Supplement P1 with fresh current public ranking
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then echo "::error::Secrets métriques incomplets."; exit 1; fi
          case "$CRON_URL" in
            */metrics-cron.php) BASELINE_URL="${CRON_URL%/metrics-cron.php}/metrics-public-baseline-cron.php" ;;
            *) echo "::error::PASS50_METRICS_CRON_URL invalide."; exit 1 ;;
          esac
          case "$BASELINE_URL" in http://*) BASELINE_URL="https://${BASELINE_URL#http://}" ;; esac
          case "$BASELINE_URL" in https://www.pass50.store/*) BASELINE_URL="https://pass50.store/${BASELINE_URL#https://www.pass50.store/}" ;; esac
          dispatch_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-public-baseline"
          body="$(jq -nc --arg dispatchId "$dispatch_id" '{action:"dispatch",dispatchId:$dispatchId}')"
          http_code=000
          for attempt in $(seq 1 12); do
            timestamp="$(date +%s)"
            signature="$(printf '%s\n%s' "$timestamp" "$body" | openssl dgst -sha256 -hmac "$CRON_SECRET" -r | awk '{print $1}')"
            set +e
            http_code="$(curl --silent --show-error --max-time 55 --output public-baseline-result.json --write-out '%{http_code}' \
              -H "Content-Type: application/json" -H "X-P50-Timestamp: $timestamp" -H "X-P50-Signature: $signature" \
              --data "$body" "$BASELINE_URL")"; curl_status=$?
            set -e
            if [ "$curl_status" -eq 0 ] && [ "$http_code" = "200" ] && jq -e '.ok == true and .version == "PUBLIC-BASELINE-P1-V1.3" and .publicStateWrites == 0' public-baseline-result.json >/dev/null 2>&1; then break; fi
            if [ "$attempt" -eq 12 ]; then
              echo "::error::Couverture publique V1.3 indisponible ou réponse invalide (HTTP $http_code)."
              cat public-baseline-result.json 2>/dev/null || true
              exit 1
            fi
            echo "Couverture publique en attente, tentative $attempt/12 (HTTP $http_code)."
            sleep 15
          done
          public_profiles="$(jq -r '.summary.publicProfiles // 0' public-baseline-result.json)"
          eligible_profiles="$(jq -r '.summary.eligibleProfiles // 0' public-baseline-result.json)"
          missing_sources="$(jq -r '.summary.publicProfilesWithoutVerifiedSources | length' public-baseline-result.json)"
          jobs_created="$(jq -r '.summary.jobsCreated // 0' public-baseline-result.json)"
          duplicates="$(jq -r '.summary.duplicateJobs // 0' public-baseline-result.json)"
          already_fresh="$(jq -r '.summary.profilesAlreadyFresh // 0' public-baseline-result.json)"
          needs_refresh="$(jq -r '.summary.profilesNeedingRefresh // 0' public-baseline-result.json)"
          freshness_target="$(jq -r '.summary.freshnessTargetMinutes // 45' public-baseline-result.json)"
          remaining="$(jq -r '.remaining // 0' public-baseline-result.json)"
          eligible_by_platform="$(jq -c '.summary.eligibleLinksByPlatform' public-baseline-result.json)"
          configured_missing_by_platform="$(jq -c '.summary.skippedConfigurationByPlatform' public-baseline-result.json)"
          selected_by_platform="$(jq -c '.summary.selectedByPlatform' public-baseline-result.json)"
          {
            printf '### Couverture fraîche du classement public\n'
            printf -- '- Profils publics détectés : %s\n' "$public_profiles"
            printf -- '- Profils avec source vérifiée / sans source vérifiée : %s / %s\n' "$eligible_profiles" "$missing_sources"
            printf -- '- Cible de fraîcheur : <= %s min\n' "$freshness_target"
            printf -- '- Déjà frais / à rafraîchir : %s / %s\n' "$already_fresh" "$needs_refresh"
            printf -- '- Liens vérifiés par plateforme : `%s`\n' "$eligible_by_platform"
            printf -- '- Liens non configurés par plateforme : `%s`\n' "$configured_missing_by_platform"
            printf -- '- Sources retenues dans ce cycle : `%s`\n' "$selected_by_platform"
            printf -- '- Tâches créées / déjà présentes : %s / %s\n' "$jobs_created" "$duplicates"
            printf -- '- File métrique prioritaire après complément : %s\n' "$remaining"
            printf -- '- Écriture app_state : `0`\n'
          } >> "$GITHUB_STEP_SUMMARY"
          printf 'jobs_created=%s\nremaining=%s\nneeds_refresh=%s\nalready_fresh=%s\n' "$jobs_created" "$remaining" "$needs_refresh" "$already_fresh" >> "$GITHUB_OUTPUT"

      - name: Dispatch P1 immediately when public profiles need refresh
        if: ${{ steps.baseline.outcome == 'success' && steps.baseline.outputs.needs_refresh != '0' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg ref "main" '{ref:$ref}')"
          curl --fail-with-body --silent --show-error \
            -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/metrics-top50-2h.yml/dispatches"

      - name: Publish sanitized public-baseline status
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STEP_OUTCOME: ${{ steps.baseline.outcome }}
          JOBS_CREATED: ${{ steps.baseline.outputs.jobs_created }}
          REMAINING: ${{ steps.baseline.outputs.remaining }}
          NEEDS_REFRESH: ${{ steps.baseline.outputs.needs_refresh }}
          ALREADY_FRESH: ${{ steps.baseline.outputs.already_fresh }}
        run: |
          set -euo pipefail
          state="success"; description="Couverture publique <=45m · ${ALREADY_FRESH:-0} frais · ${NEEDS_REFRESH:-0} à rafraîchir · ${JOBS_CREATED:-0} tâches"
          if [ "$STEP_OUTCOME" != "success" ]; then state="failure"; description="Couverture publique fraîche interrompue · app_state inchangé"; fi
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(jq -nc --arg state "$state" --arg target_url "$target_url" --arg description "$description" --arg context "pass50/metrics-public-baseline-p1" '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl --fail-with-body --silent --show-error -X POST -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}"

      - name: Archive baseline result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: public-baseline-p1-${{ github.run_id }}-${{ github.run_attempt }}
          path: public-baseline-result.json
          if-no-files-found: ignore
          retention-days: 30
