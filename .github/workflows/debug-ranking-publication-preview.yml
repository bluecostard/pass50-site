name: Debug Ranking Publication Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CRON_URL: ${{ secrets.PASS50_METRICS_CRON_URL }}
      CRON_SECRET: ${{ secrets.PASS50_METRICS_CRON_SECRET }}
    steps:
      - name: Preview publication eligibility
        shell: bash
        run: |
          set -euo pipefail
          CRON_URL="${CRON_URL//www.pass50.store/pass50.store}"
          CRON_URL="${CRON_URL/#http:/https:}"
          APPLY_URL="${CRON_URL%/metrics-cron.php}/metrics-ranking-publication-apply-cron.php"
          RANK_URL="${CRON_URL%/metrics-cron.php}/metrics-ranking-cron.php"
          dispatch_id="${GITHUB_RUN_ID}-preview"
          body="$(jq -nc --arg dispatchId "$dispatch_id" '{action:"preview",dispatchId:$dispatchId}')"
          timestamp="$(date +%s)"
          signature="$(printf '%s\n%s' "$timestamp" "$body" | openssl dgst -sha256 -hmac "$CRON_SECRET" -r | awk '{print $1}')"
          curl --fail-with-body --silent --show-error --max-time 55 \
            -H "Content-Type: application/json" \
            -H "X-P50-Timestamp: $timestamp" \
            -H "X-P50-Signature: $signature" \
            --data "$body" "$APPLY_URL" > preview.json
          jq '{
            status, publicationEligible, bootstrap, runUuid,
            config, summary,
            periodStatuses: (.plans|to_entries|map({period:.key,status:.value.status,mutations:.value.counts.mutations,runUuid:.value.runUuid,blockedGates:[.value.report.gates[]?|select(.status=="block")|.key]})),
          }' preview.json | tee summary.json
          {
            printf '### Preview publication\n'
            printf '```json\n'
            cat summary.json
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
