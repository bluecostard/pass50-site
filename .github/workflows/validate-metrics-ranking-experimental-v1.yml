name: Validate Metrics Ranking Experimental V1

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: pass50_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      P50_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=pass50_test;charset=utf8mb4
      P50_TEST_DB_USER: root
      P50_TEST_DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PHP lint
        run: |
          php -l api/metrics-ranking-core.php
          php -l api/metrics-ranking.php
          php -l api/metrics-ranking-cron.php
          php -l api/metrics-ranking-fresh-capture-core.php
          php -l api/metrics-ranking-cron-v2.php
          php -l api/metrics-ranking-fresh-capture-v2-core.php
          php -l api/metrics-ranking-calibration-core.php
          php -l api/metrics-ranking-calibration.php
          php -l tests/metrics_ranking_integration.php
          php -l tests/metrics_ranking_fresh_capture_integration.php
      - name: JavaScript syntax
        run: |
          node --check data-engine-ui.js
          node --check v9-tools.js
      - name: Python tests
        run: |
          python3 -m unittest tests.test_metrics_ranking_experimental_v1
          python3 -m unittest tests.test_metrics_ranking_schedule_v1
          python3 -m unittest tests.test_metrics_ranking_fresh_capture_v1
          python3 -m unittest tests.test_metrics_ranking_calibration_v1
          python3 -m unittest tests.test_metrics_schema_v1
          python3 -m unittest tests.test_metrics_observability_v1
          python3 -m unittest tests.test_metrics_orchestrator_v1
          python3 -m unittest tests.test_metrics_ranking_fair_diversity_v1
      - name: MariaDB integration
        run: |
          php tests/metrics_ranking_integration.php
          php tests/metrics_ranking_fresh_capture_integration.php
      - name: Diff check
        run: git diff --check origin/${{ github.base_ref }}...HEAD
