name: Validate Metrics Ranking Experimental V1

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: pass50_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      P50_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=pass50_test;charset=utf8mb4
      P50_TEST_DB_USER: root
      P50_TEST_DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PHP lint
        run: |
          php -l api/metrics-ranking-core.php
          php -l api/metrics-ranking.php
          php -l api/metrics-ranking-cron.php
          php -l api/metrics-ranking-fresh-capture-core.php
          php -l api/metrics-ranking-cron-v2.php
          php -l api/metrics-ranking-fresh-capture-v2-core.php
          php -l api/metrics-ranking-calibration-core.php
          php -l api/metrics-ranking-calibration.php
          php -l tests/metrics_ranking_integration.php
          php -l tests/metrics_ranking_fresh_capture_integration.php
      - name: JavaScript syntax
        run: |
          node --check data-engine-ui.js
          node --check v9-tools.js
      - name: Python tests
        run: |
          python3 -m unittest tests.test_metrics_ranking_experimental_v1
          python3 -m unittest tests.test_metrics_ranking_schedule_v1
          python3 -m unittest tests.test_metrics_ranking_fresh_capture_v1
          python3 -m unittest tests.test_metrics_ranking_calibration_v1
          python3 -m unittest tests.test_metrics_schema_v1
          python3 -m unittest tests.test_metrics_observability_v1
          python3 -m unittest tests.test_metrics_orchestrator_v1
      - name: MariaDB integration
        run: |
          php tests/metrics_ranking_integration.php
          php tests/metrics_ranking_fresh_capture_integration.php
      - name: Diagnostic production Apoutchou Facebook
        id: apoutchou
        shell: bash
        run: |
          set -euo pipefail
          feed='apoutchou-production-feed.json'
          curl --fail-with-body --location --silent --show-error --max-time 30 -H 'Accept: application/json' -H 'Cache-Control: no-cache, no-store' \
            "https://www.pass50.store/api/content-feed.php?period=24h&profileId=apoutchou&newsLimit=30&verify=${GITHUB_RUN_ID}" > "$feed"
          jq -e '.ok==true and .ready==true and .rules.facebookEmbedRouting==true' "$feed" >/dev/null
          item="$(jq -c '[.news[] | select((.platform|ascii_downcase)=="facebook" and .playableInPass50==true)][0] // empty' "$feed")"
          [ -n "$item" ] || { echo 'result=no_item' >> "$GITHUB_OUTPUT"; echo '::error::Aucune actualité Facebook lisible sur Apoutchou'; exit 1; }
          source="$(jq -r '.url' <<<"$item")"
          route="$(jq -r '.facebookEmbedType // "missing"' <<<"$item")"
          item_type="$(jq -r '.itemType // "unknown"' <<<"$item")"
          safe_path="$(python3 - "$source" <<'PY'
import sys, urllib.parse
u=urllib.parse.urlparse(sys.argv[1]); print((u.hostname or '')+(u.path or '/'))
PY
)"
          encoded="$(python3 - "$source" <<'PY'
import sys, urllib.parse
print(urllib.parse.quote(sys.argv[1], safe=''))
PY
)"
          for plugin in post video; do
            show_text=false; [ "$plugin" = post ] && show_text=true
            body="facebook-${plugin}.html"
            code="$(curl --location --silent --show-error --max-time 40 --output "$body" --write-out '%{http_code}' -H 'Accept-Language: fr-FR,fr;q=0.9,en;q=0.8' "https://www.facebook.com/plugins/${plugin}.php?href=${encoded}&show_text=${show_text}&width=820" || true)"
            bytes="$(wc -c < "$body" 2>/dev/null || printf 0)"
            unavailable=false
            if grep -Eqi "ce contenu n.est pas disponible|contenu indisponible|this content isn.t available|content not available|publication indisponible" "$body" 2>/dev/null; then unavailable=true; fi
            printf 'APOUTCHOU_PLUGIN plugin=%s http=%s bytes=%s unavailable=%s\n' "$plugin" "$code" "$bytes" "$unavailable"
            printf '%s' "$unavailable" > "${plugin}-unavailable.txt"
          done
          post_unavailable="$(cat post-unavailable.txt)"; video_unavailable="$(cat video-unavailable.txt)"
          printf 'APOUTCHOU_RESULT itemType=%s route=%s postUnavailable=%s videoUnavailable=%s path=%s\n' "$item_type" "$route" "$post_unavailable" "$video_unavailable" "$safe_path"
          {
            printf 'item_type=%s\n' "$item_type"
            printf 'route=%s\n' "$route"
            printf 'post_unavailable=%s\n' "$post_unavailable"
            printf 'video_unavailable=%s\n' "$video_unavailable"
            printf 'safe_path=%s\n' "$safe_path"
          } >> "$GITHUB_OUTPUT"
          selected_unavailable="$video_unavailable"; [ "$route" = post ] && selected_unavailable="$post_unavailable"
          if [ "$selected_unavailable" = true ]; then
            echo 'result=selected_unavailable' >> "$GITHUB_OUTPUT"
            echo '::error::Le lecteur sélectionné renvoie encore contenu indisponible'
            exit 1
          fi
          echo 'result=selected_available' >> "$GITHUB_OUTPUT"
      - name: Publier le verdict Apoutchou
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.apoutchou.outcome }}
          RESULT: ${{ steps.apoutchou.outputs.result }}
          ITEM_TYPE: ${{ steps.apoutchou.outputs.item_type }}
          ROUTE: ${{ steps.apoutchou.outputs.route }}
          POST_UNAVAILABLE: ${{ steps.apoutchou.outputs.post_unavailable }}
          VIDEO_UNAVAILABLE: ${{ steps.apoutchou.outputs.video_unavailable }}
        run: |
          set -euo pipefail
          state=success
          description="Apoutchou ${RESULT:-inconnu}: type ${ITEM_TYPE:-?}, route ${ROUTE:-?}, post indispo ${POST_UNAVAILABLE:-?}, vidéo indispo ${VIDEO_UNAVAILABLE:-?}"
          if [ "${OUTCOME:-failure}" != success ]; then state=failure; fi
          description="${description:0:140}"
          payload="$(jq -nc --arg state "$state" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --arg description "$description" --arg context 'pass50/apoutchou-facebook-final-test' '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl --fail-with-body --silent --show-error -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' --data "$payload" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
      - name: Diff check
        run: git diff --check origin/${{ github.base_ref }}...HEAD
