name: Validate Metrics Ranking Fresh Capture V2

on:
  pull_request:
    paths:
      - 'api/metrics-ranking-cron-v2.php'
      - 'api/metrics-ranking-fresh-capture-v2-core.php'
      - 'tests/test_metrics_ranking_fresh_capture_v1.py'
      - 'tests/metrics_ranking_fresh_capture_integration.php'
      - '.github/workflows/validate-metrics-ranking-fresh-capture-v1.yml'
  push:
    branches: [main]
    paths:
      - 'api/metrics-ranking-cron-v2.php'
      - 'api/metrics-ranking-fresh-capture-v2-core.php'
      - 'tests/test_metrics_ranking_fresh_capture_v1.py'
      - 'tests/metrics_ranking_fresh_capture_integration.php'
      - '.github/workflows/validate-metrics-ranking-fresh-capture-v1.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: pass50_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      P50_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=pass50_test;charset=utf8mb4
      P50_TEST_DB_USER: root
      P50_TEST_DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PHP lint
        run: |
          php -l api/metrics-ranking-fresh-capture-v2-core.php
          php -l api/metrics-ranking-cron-v2.php
          php -l tests/metrics_ranking_fresh_capture_integration.php
      - name: Static contract
        run: python3 -m unittest tests.test_metrics_ranking_fresh_capture_v1 -v
      - name: MariaDB integration
        run: php tests/metrics_ranking_fresh_capture_integration.php
      - name: Diff safety
        run: git diff --check origin/${{ github.base_ref || 'main' }}...HEAD
