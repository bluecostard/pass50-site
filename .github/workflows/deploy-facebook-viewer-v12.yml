name: Déployer le lecteur Facebook V1.2

on:
  push:
    branches: [main]
    paths:
      - 'facebook-video-player-v1.js'
      - 'public-copy-fixes.js'
      - 'api/content-feed.php'
      - '.github/workflows/deploy-facebook-viewer-v12.yml'
  pull_request:
    paths:
      - 'facebook-video-player-v1.js'
      - 'public-copy-fixes.js'
      - 'api/content-feed.php'
      - '.github/workflows/deploy-facebook-viewer-v12.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: pass50-facebook-viewer-production-deploy
  cancel-in-progress: true

jobs:
  covered-by-ionos:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirmer le contrat V1.2 en production
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 18); do
            viewer="$(curl --location --silent --show-error --max-time 20 -H 'Cache-Control: no-cache, no-store' "https://pass50.store/facebook-video-player-v1.js?check=${GITHUB_SHA}-${attempt}" || true)"
            loader="$(curl --location --silent --show-error --max-time 20 -H 'Cache-Control: no-cache, no-store' "https://pass50.store/public-copy-fixes.js?check=${GITHUB_SHA}-${attempt}" || true)"
            if grep -q 'PASS50-FACEBOOK-VIDEO-PLAYER-V1.2' <<<"$viewer" && grep -q 'Voir dans Pass50' <<<"$viewer" && grep -q 'facebook-video-player-v1.js?v=1.2' <<<"$loader"; then
              ready=true
              break
            fi
            sleep 5
          done
          if [ "$ready" != true ]; then
            echo '::error::Contrat Facebook V1.2 absent en production'
            exit 1
          fi
          echo 'OK · lecteur Facebook V1.2 servi via deploy-ionos'

  validate:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check facebook-video-player-v1.js
          node --check public-copy-fixes.js
      - name: Contrat V1.2
        run: |
          grep -q 'PASS50-FACEBOOK-VIDEO-PLAYER-V1.2' facebook-video-player-v1.js
          grep -q 'Voir dans Pass50' facebook-video-player-v1.js
          grep -q 'facebook-video-player-v1.js?v=1.2' public-copy-fixes.js
          grep -q 'facebookEmbedRouting' api/content-feed.php

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Installer SFTP
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Transférer le lecteur Facebook
        env:
          HOST: ${{ secrets.IONOS_SFTP_HOST }}
          USER: ${{ secrets.IONOS_SFTP_USER }}
          PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.IONOS_REMOTE_DIR }}
        run: |
          set -euo pipefail
          if [ -z "${HOST:-}" ] || [ -z "${USER:-}" ] || [ -z "${PASSWORD:-}" ] || [ -z "${REMOTE_DIR:-}" ]; then
            echo '::error::Configuration SFTP IONOS incomplète.'
            exit 1
          fi
          lftp <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 20
          set sftp:auto-confirm yes
          open -u "$USER","$PASSWORD" sftp://$HOST:22
          put -O "$REMOTE_DIR" facebook-video-player-v1.js
          put -O "$REMOTE_DIR" public-copy-fixes.js
          put -O "$REMOTE_DIR/api" api/content-feed.php
          bye
          LFTP
      - name: Vérifier le contrat V1.2
        run: |
          set -euo pipefail
          viewer="$(curl --location --silent --show-error --max-time 20 -H 'Cache-Control: no-cache, no-store' "https://pass50.store/facebook-video-player-v1.js?manual=${GITHUB_SHA}")"
          grep -q 'PASS50-FACEBOOK-VIDEO-PLAYER-V1.2' <<<"$viewer"
          grep -q 'Voir dans Pass50' <<<"$viewer"
