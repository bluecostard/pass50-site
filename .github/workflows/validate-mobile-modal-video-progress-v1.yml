name: Validate Mobile Modal Video Progress V1

on:
  pull_request:
    paths:
      - 'mobile-modal-video-progress-v1.js'
      - 'public-copy-fixes.js'
      - 'sw.js'
      - 'tests/test_mobile_modal_video_progress_v1.py'
      - '.github/workflows/validate-mobile-modal-video-progress-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check mobile-modal-video-progress-v1.js
      - name: Mobile modal and video progress contract
        run: python3 -m unittest tests.test_mobile_modal_video_progress_v1
      - name: Test production Apoutchou Facebook
        id: apoutchou
        shell: bash
        run: |
          set -euo pipefail
          feed='apoutchou-production-feed.json'; ready=false
          for attempt in $(seq 1 18); do
            player="$(curl --location --silent --show-error --max-time 20 -H 'Cache-Control: no-cache, no-store' "https://www.pass50.store/facebook-video-player-v1.js?verify=${GITHUB_RUN_ID}-${attempt}" || true)"
            curl --location --silent --show-error --max-time 30 -H 'Accept: application/json' -H 'Cache-Control: no-cache, no-store' \
              "https://www.pass50.store/api/content-feed.php?period=24h&profileId=apoutchou&newsLimit=30&verify=${GITHUB_RUN_ID}-${attempt}" > "$feed" || true
            if grep -q 'PASS50-FACEBOOK-VIDEO-PLAYER-V1.1' <<<"$player" \
              && jq -e '.ok==true and .ready==true and .rules.facebookEmbedRouting==true' "$feed" >/dev/null 2>&1; then
              ready=true; break
            fi
            echo "Propagation du lecteur V1.1 en attente ($attempt/18)."
            sleep 5
          done
          [ "$ready" = true ] || { echo 'result=not_deployed' >> "$GITHUB_OUTPUT"; echo '::error::Le lecteur Facebook V1.1 ou son API ne sont pas servis'; exit 1; }

          item="$(jq -c '[.news[] | select((.platform|ascii_downcase)=="facebook" and .playableInPass50==true)][0] // empty' "$feed")"
          [ -n "$item" ] || { echo 'result=no_item' >> "$GITHUB_OUTPUT"; echo '::error::Aucune actualité Facebook lisible sur la fiche Apoutchou'; exit 1; }
          source="$(jq -r '.url' <<<"$item")"
          route="$(jq -r '.facebookEmbedType // "missing"' <<<"$item")"
          item_type="$(jq -r '.itemType // "unknown"' <<<"$item")"
          [ "$route" = post ] || [ "$route" = video ] || { echo 'result=invalid_route' >> "$GITHUB_OUTPUT"; echo "::error::Routage invalide: $route"; exit 1; }

          safe_path="$(python3 - "$source" <<'PY'
import sys, urllib.parse
u=urllib.parse.urlparse(sys.argv[1])
print((u.hostname or '') + (u.path or '/'))
PY
)"
          encoded="$(python3 - "$source" <<'PY'
import sys, urllib.parse
print(urllib.parse.quote(sys.argv[1], safe=''))
PY
)"

          for plugin in post video; do
            show_text=false; [ "$plugin" = post ] && show_text=true
            plugin_url="https://www.facebook.com/plugins/${plugin}.php?href=${encoded}&show_text=${show_text}&width=820"
            body="facebook-${plugin}.html"
            code="$(curl --location --silent --show-error --max-time 40 --output "$body" --write-out '%{http_code}' -H 'Accept-Language: fr-FR,fr;q=0.9,en;q=0.8' "$plugin_url" || true)"
            bytes="$(wc -c < "$body" 2>/dev/null || printf 0)"
            unavailable=false
            if grep -Eqi "ce contenu n.est pas disponible|contenu indisponible|this content isn.t available|content not available|publication indisponible" "$body" 2>/dev/null; then unavailable=true; fi
            login_wall=false
            if grep -Eqi "connectez-vous|log in to facebook|connexion à facebook" "$body" 2>/dev/null; then login_wall=true; fi
            printf 'APOUTCHOU_PLUGIN plugin=%s http=%s bytes=%s unavailable=%s loginWall=%s\n' "$plugin" "$code" "$bytes" "$unavailable" "$login_wall"
            printf '%s' "$unavailable" > "${plugin}-unavailable.txt"
          done

          post_unavailable="$(cat post-unavailable.txt)"
          video_unavailable="$(cat video-unavailable.txt)"
          printf 'APOUTCHOU_RESULT itemType=%s route=%s postUnavailable=%s videoUnavailable=%s path=%s\n' \
            "$item_type" "$route" "$post_unavailable" "$video_unavailable" "$safe_path"
          {
            printf 'item_type=%s\n' "$item_type"
            printf 'route=%s\n' "$route"
            printf 'post_unavailable=%s\n' "$post_unavailable"
            printf 'video_unavailable=%s\n' "$video_unavailable"
            printf 'safe_path=%s\n' "$safe_path"
          } >> "$GITHUB_OUTPUT"

          if [ "$route" = post ] && [ "$post_unavailable" = true ]; then
            echo 'result=selected_unavailable' >> "$GITHUB_OUTPUT"
            echo '::error::Le lecteur post sélectionné pour Apoutchou renvoie encore contenu indisponible.'
            exit 1
          fi
          if [ "$route" = video ] && [ "$video_unavailable" = true ]; then
            echo 'result=selected_unavailable' >> "$GITHUB_OUTPUT"
            echo '::error::Le lecteur vidéo sélectionné pour Apoutchou renvoie encore contenu indisponible.'
            exit 1
          fi
          echo 'result=selected_available' >> "$GITHUB_OUTPUT"
      - name: Publier le diagnostic Apoutchou
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.apoutchou.outcome }}
          RESULT: ${{ steps.apoutchou.outputs.result }}
          ITEM_TYPE: ${{ steps.apoutchou.outputs.item_type }}
          ROUTE: ${{ steps.apoutchou.outputs.route }}
          POST_UNAVAILABLE: ${{ steps.apoutchou.outputs.post_unavailable }}
          VIDEO_UNAVAILABLE: ${{ steps.apoutchou.outputs.video_unavailable }}
        run: |
          set -euo pipefail
          state=success
          description="Apoutchou ${RESULT:-inconnu}: type ${ITEM_TYPE:-?}, route ${ROUTE:-?}, post indispo ${POST_UNAVAILABLE:-?}, vidéo indispo ${VIDEO_UNAVAILABLE:-?}"
          if [ "${OUTCOME:-failure}" != success ]; then state=failure; fi
          description="${description:0:140}"
          payload="$(jq -nc --arg state "$state" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --arg description "$description" --arg context 'pass50/apoutchou-facebook-embed-diagnostic' '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl --fail-with-body --silent --show-error -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' --data "$payload" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
      - name: Diff check
        run: git diff --check
