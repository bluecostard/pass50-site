name: Validate Meta OAuth Automatic Metrics

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: pass50_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      P50_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=pass50_test;charset=utf8mb4
      P50_TEST_DB_USER: root
      P50_TEST_DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PHP lint
        run: |
          php -l api/meta-metrics-bridge-core.php
          php -l api/metrics-collectors-core.php
          php -l api/metrics-social-collectors-core.php
          php -l api/metrics-collector-facebook.php
          php -l api/metrics-collector-instagram.php
          php -l api/metrics-orchestrator-core.php
          php -l api/meta-oauth-map-asset.php
          php -l api/metrics-control-center-core.php
          php -l tests/meta_oauth_automatic_metrics_mariadb.php
      - name: JavaScript syntax
        run: node --check data-engine-ui.js
      - name: Static tests
        run: python3 -m unittest tests.test_meta_oauth_automatic_metrics
      - name: MariaDB integration
        run: php tests/meta_oauth_automatic_metrics_mariadb.php
      - name: Diff check
        run: git diff --check origin/${{ github.base_ref }}...HEAD
