name: Update stale version assertions

on:
  push:
    branches:
      - agent/add-andrea-naomi-ng-guessan

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-andrea-naomi-ng-guessan
          fetch-depth: 0

      - name: Update stale assertions
        run: python3 scripts/update_stale_version_assertions.py

      - name: Run affected tests
        run: |
          python3 -m unittest tests.test_live_radar_v3
          python3 -m unittest tests.test_metrics_ranking_calibration_v1
          python3 -m unittest tests.test_andrea_naomi_canonical_profile
          git diff --check

      - name: Commit test alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          if git diff --cached --quiet; then
            echo "Aucune modification à publier."
            exit 0
          fi
          git commit -m "Aligner les assertions sur les versions actuelles"
          git push origin HEAD:agent/add-andrea-naomi-ng-guessan
