name: PASS50 Live Radar P0

# RÈGLE FIGÉE PASS50_LIVE_RADAR_AUTONOMY_V1
# - Détection 24/7 côté serveur, même si l’app / l’onglet / le owner est éteint.
# - Tick cible : 1 seconde (boucle dans le job ; schedule GitHub = */5).
# - Le client ne fait que lire le cache (mode=status) : jamais la détection.
#
# GitHub n’honore pas un cron plus serré que 5 min (souvent 10–30 min).
# Chaque run boucle donc ~280 s à 1 Hz pour couvrir l’intervalle.

on:
  schedule:
    # Décalé :00 pour ne pas empiler les 4 jobs radar sur la même minute.
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-radar-p0.yml'
      - 'scripts/live_radar_continuous_tick.py'
      - 'scripts/live_radar_p0_webcast.py'
      - 'scripts/live_radar_unknown_audit.py'
      - 'api/live-radar-v4-source.php'
      - 'api/live-radar-v4-storage.php'
      - 'api/live-radar-v4-trust.php'
      - 'api/live-radar-contract.php'
      - 'profile-ennemi-des-djandjou.js'
      - 'profile-isouch.js'

permissions:
  contents: read

concurrency:
  group: pass50-live-radar-p0
  cancel-in-progress: true

jobs:
  publish-p0:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      UNKNOWN_AUDIT_ENDPOINT: https://pass50.store/api/live-radar-unknown-audit.php
      PASS50_METRICS_CRON_SECRET: ${{ secrets.PASS50_METRICS_CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Boucle P0 1 Hz (autonomie hors app)
        run: |
          set -euo pipefail
          test -n "${PASS50_METRICS_CRON_SECRET}"
          python3 scripts/live_radar_continuous_tick.py --seconds 280 --tick 1
