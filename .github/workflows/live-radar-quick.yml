name: PASS50 Live Radar Quick

on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-radar-quick.yml'
      - 'scripts/live_radar_p0_webcast.py'
      - 'scripts/live_radar_unknown_audit.py'
      - 'profile-oustaz-diane.js'
      - 'profile-ange-morel.js'
      - 'profile-laguepe.js'
      - 'profile-rosemark-marcel.js'
      - 'api/live-radar-v4-source.php'

permissions:
  contents: read

concurrency:
  group: pass50-live-radar-quick
  cancel-in-progress: false

jobs:
  quick-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ENDPOINT: https://pass50.store/api/live-status-v4.php
      UNKNOWN_AUDIT_ENDPOINT: https://pass50.store/api/live-radar-unknown-audit.php
      PASS50_METRICS_CRON_SECRET: ${{ secrets.PASS50_METRICS_CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Publier tous les lives P0 vus par GitHub
        run: |
          set -euo pipefail
          test -n "${PASS50_METRICS_CRON_SECRET}"
          python3 scripts/live_radar_p0_webcast.py

      - name: Sonder prioritairement Oustaz Diané
        continue-on-error: true
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --location --max-time 40 --retry 2 --retry-delay 1 \
            "${ENDPOINT}?mode=profile&profileId=oustaz-diane&force=1&batch=4&t=$(date +%s)")"
          printf '%s' "$response" | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          radar=data.get("radar") or {}
          streams=data.get("liveStreams") or []
          detected_tt=any(str(s.get("profileId") or "")=="oustaz-diane" and str(s.get("platform") or "")=="TikTok" for s in streams)
          detected_yt=any(str(s.get("profileId") or "")=="oustaz-diane" and str(s.get("platform") or "")=="YouTube" for s in streams)
          scanned=int(radar.get("sourcesScannedThisPass") or 0)
          print(f"Oustaz Diané : {scanned} source(s) sondée(s) · live TikTok={detected_tt} · live YouTube={detected_yt}")
          '

      - name: Sonder prioritairement Roseline Layo
        continue-on-error: true
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --location --max-time 40 --retry 2 --retry-delay 1 \
            "${ENDPOINT}?mode=profile&profileId=census-roseline-layo&force=1&batch=4&t=$(date +%s)")"
          printf '%s' "$response" | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          radar=data.get("radar") or {}
          streams=data.get("liveStreams") or []
          detected=any(str(s.get("profileId") or "")=="census-roseline-layo" and str(s.get("platform") or "")=="TikTok" for s in streams)
          scanned=int(radar.get("sourcesScannedThisPass") or 0)
          print(f"Roseline Layo : {scanned} source(s) sondée(s) · live TikTok publié={detected}")
          '

      - name: Sonder prioritairement Rach Makosso
        continue-on-error: true
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --location --max-time 40 --retry 2 --retry-delay 1 \
            "${ENDPOINT}?mode=profile&profileId=census-rach-makosso&force=1&batch=4&t=$(date +%s)")"
          printf '%s' "$response" | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          radar=data.get("radar") or {}
          streams=data.get("liveStreams") or []
          detected=any(str(s.get("profileId") or "")=="census-rach-makosso" and str(s.get("platform") or "")=="TikTok" for s in streams)
          scanned=int(radar.get("sourcesScannedThisPass") or 0)
          print(f"Rach Makosso : {scanned} source(s) sondée(s) · live TikTok publié={detected}")
          '

      - name: Sonder prioritairement Ange-Morel Your Eyes
        continue-on-error: true
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --location --max-time 40 --retry 2 --retry-delay 1 \
            "${ENDPOINT}?mode=profile&profileId=census-ange-morel&force=1&batch=4&t=$(date +%s)")"
          printf '%s' "$response" | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          radar=data.get("radar") or {}
          streams=data.get("liveStreams") or []
          detected=any(str(s.get("profileId") or "")=="census-ange-morel" and str(s.get("platform") or "")=="TikTok" for s in streams)
          scanned=int(radar.get("sourcesScannedThisPass") or 0)
          print(f"Ange-Morel Your Eyes : {scanned} source(s) sondée(s) · live TikTok publié={detected}")
          '

      - name: Sonder prioritairement Laguepe
        continue-on-error: true
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --location --max-time 40 --retry 2 --retry-delay 1 \
            "${ENDPOINT}?mode=profile&profileId=census-laguepe&force=1&batch=4&t=$(date +%s)")"
          printf '%s' "$response" | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          radar=data.get("radar") or {}
          streams=data.get("liveStreams") or []
          detected=any(str(s.get("profileId") or "")=="census-laguepe" and str(s.get("platform") or "")=="TikTok" for s in streams)
          scanned=int(radar.get("sourcesScannedThisPass") or 0)
          print(f"Laguepe : {scanned} source(s) sondée(s) · live TikTok publié={detected}")
          '

      - name: Sonder prioritairement Rosemark Marcel
        continue-on-error: true
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --location --max-time 40 --retry 2 --retry-delay 1 \
            "${ENDPOINT}?mode=profile&profileId=census-rosemark-marcel&force=1&batch=4&t=$(date +%s)")"
          printf '%s' "$response" | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          radar=data.get("radar") or {}
          streams=data.get("liveStreams") or []
          detected=any(str(s.get("profileId") or "")=="census-rosemark-marcel" and str(s.get("platform") or "")=="TikTok" for s in streams)
          scanned=int(radar.get("sourcesScannedThisPass") or 0)
          print(f"Rosemark Marcel : {scanned} source(s) sondée(s) · live TikTok publié={detected}")
          '

      - name: Reconfirmer les directs et découvrir de nouveaux LIVE
        continue-on-error: true
        run: |
          set -euo pipefail
          total_found=0
          total_active=0
          for pass in 1 2 3 4 5; do
            response="$(curl --fail --silent --show-error --location --max-time 40 --retry 2 --retry-delay 1 \
              "${ENDPOINT}?mode=quick&force=1&batch=16&t=$(date +%s)${pass}")"
            readarray -t values < <(printf '%s' "$response" | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          radar=data.get("radar") or {}
          print("true" if radar.get("busy") else "false")
          print(int(radar.get("livesFoundThisPass") or 0))
          print(int(radar.get("activeAutomaticConfirmed") or 0))
          print(int(radar.get("sourcesScannedThisPass") or 0))
          print(int(radar.get("officialSourcesKnown") or 0))
          ')
            busy="${values[0]}"
            found="${values[1]}"
            active="${values[2]}"
            scanned="${values[3]}"
            known="${values[4]}"
            total_found=$((total_found + found))
            total_active=$active
            echo "Quick PASS50 #${pass} : ${scanned} sondés / ${known} connus · +${found} live · ${active} publiés · busy=${busy}"
            if [[ "$busy" == "true" ]]; then sleep 2; else sleep 1; fi
          done
          echo "Radar rapide : ${total_found} confirmation(s) · ${total_active} direct(s) publié(s)"
