name: Canonical Lionel Yasmine V24 Once

on:
  push:
    branches:
      - fix/canonical-lionel-yasmine-v24

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canonical-lionel-yasmine-v24
          fetch-depth: 0
      - name: Générer la correction canonique
        run: python3 scripts/canonical_lionel_yasmine_v24.py
      - name: Vérifier JSON et JavaScript
        run: |
          python3 -m json.tool pass50_nouveaux_candidats_90_v19.json >/dev/null
          node --check v9-tools.js
          node --check sw.js
          node --check app-config.js
          node --check profile-lionel-pcs.js
          node --check profile-yasmine-fofana.js
      - name: Tester l’intégration canonique
        run: python3 -m unittest tests.test_canonical_lionel_yasmine_v24
      - name: Publier uniquement les fichiers finaux
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/canonical_lionel_yasmine_v24.py .github/workflows/canonical-lionel-yasmine-v24-once.yml
          git add pass50_nouveaux_candidats_90_v19.json v9-tools.js sw.js app-config.js tests/test_canonical_lionel_yasmine_v24.py
          git commit -m "Intégrer Lionel PCS et Yasmine Fofana dans le recensement canonique"
          git push origin HEAD:fix/canonical-lionel-yasmine-v24
