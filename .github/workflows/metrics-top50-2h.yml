name: Metrics Top 50 P1
# Collecte P1 opérateur forcée pour second point 2H — 2026-08-10T19:10+02:00.

on:
  schedule:
    - cron: '7 */2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'api/metrics-cron.php'
      - 'api/metrics-cron-diagnostics-core.php'
      - 'api/metrics-queue-core.php'
      - '.github/workflows/metrics-top50-2h.yml'
      - '.github/workflows/metrics-ranking-experimental.yml'

permissions:
  actions: write
  contents: read
  statuses: write

concurrency:
  group: pass50-metrics-p1
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CRON_URL: ${{ secrets.PASS50_METRICS_CRON_URL }}
      CRON_SECRET: ${{ secrets.PASS50_METRICS_CRON_SECRET }}
      STATUS_SHA: ${{ github.sha }}
    steps:
      - name: Dispatch and process P1
        id: collection
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::PASS50 metrics cron secrets are not configured."
            exit 0
          fi
          dispatch_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-p1"
          : > p1-work-diagnostics.jsonl
          call_cron() {
            local body="$1" timestamp signature
            timestamp="$(date +%s)"
            signature="$(printf '%s\n%s' "$timestamp" "$body" | openssl dgst -sha256 -hmac "$CRON_SECRET" -r | awk '{print $1}')"
            curl --fail-with-body --silent --show-error --max-time 55 \
              -H "Content-Type: application/json" -H "X-P50-Timestamp: $timestamp" \
              -H "X-P50-Signature: $signature" --data "$body" "$CRON_URL"
          }

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            deployed=false
            for attempt in $(seq 1 30); do
              probe_body="$(jq -nc --arg id "$dispatch_id" '{action:"queue",cadence:"p1",dispatchId:$id}')"
              set +e
              probe_response="$(call_cron "$probe_body" 2>/dev/null)"
              probe_status=$?
              set -e
              if [ "$probe_status" -eq 0 ] && jq -e '.queue.p1Remaining != null and .diagnosticsVersion == "WORK-DIAG-V1.0"' >/dev/null 2>&1 <<<"$probe_response"; then
                deployed=true
                break
              fi
              echo "Déploiement du contrat WORK-DIAG-V1.0 en attente, tentative $attempt/30."
              sleep 20
            done
            if [ "$deployed" != "true" ]; then
              echo "::error::Le contrat de diagnostic P1 n'est pas disponible après le déploiement."
              exit 1
            fi
          fi

          force_dispatch=false
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then force_dispatch=true; fi
          response="$(call_cron "$(jq -nc --arg id "$dispatch_id" --argjson force "$force_dispatch" '{action:"dispatch",cadence:"p1",dispatchId:$id,force:$force}')")"
          p1_remaining="$(jq -r '.queue.p1Remaining // .remaining // 0' <<<"$response")"
          global_remaining="$(jq -r '.queue.remaining // .remaining // 0' <<<"$response")"
          processed=0; completed=0; partial=0; retried=0; skipped=0; failed=0; iteration=0
          deadline=$((SECONDS + 4200))

          while [ "$p1_remaining" -gt 0 ] && [ "$iteration" -lt 500 ] && [ "$SECONDS" -lt "$deadline" ]; do
            iteration=$((iteration + 1))
            response="$(call_cron "$(jq -nc --arg id "$dispatch_id" --argjson iteration "$iteration" '{action:"work",cadence:"p1",dispatchId:$id,iteration:$iteration}')")"
            current_processed="$(jq -r '.processed // 0' <<<"$response")"
            processed=$((processed + current_processed))
            completed=$((completed + $(jq -r '.completed // 0' <<<"$response")))
            partial=$((partial + $(jq -r '.partial // 0' <<<"$response")))
            retried=$((retried + $(jq -r '.retried // 0' <<<"$response")))
            skipped=$((skipped + $(jq -r '.skipped // 0' <<<"$response")))
            failed=$((failed + $(jq -r '.failed // 0' <<<"$response")))
            if [ "$current_processed" -eq 1 ]; then jq -c '.diagnostic // empty' <<<"$response" >> p1-work-diagnostics.jsonl; fi
            p1_remaining="$(jq -r '.queue.p1Remaining // .remaining // 0' <<<"$response")"
            global_remaining="$(jq -r '.queue.remaining // .remaining // 0' <<<"$response")"

            if [ "$current_processed" -eq 0 ] && [ "$p1_remaining" -gt 0 ]; then
              wait_seconds="$(jq -r '.queue.p1WaitSeconds // 5' <<<"$response")"
              if ! [[ "$wait_seconds" =~ ^[0-9]+$ ]]; then wait_seconds=5; fi
              if [ "$wait_seconds" -lt 5 ]; then wait_seconds=5; fi
              if [ "$wait_seconds" -gt 300 ]; then wait_seconds=300; fi
              remaining_runtime=$((deadline - SECONDS)); if [ "$remaining_runtime" -le 0 ]; then break; fi
              if [ "$wait_seconds" -gt "$remaining_runtime" ]; then wait_seconds="$remaining_runtime"; fi
              echo "File P1 en attente d'un réessai, nouvelle tentative dans ${wait_seconds}s."
              sleep "$wait_seconds"
            fi
          done

          retry_wait="$(jq -r '.queue.p1RetryWait // 0' <<<"$response")"
          next_attempt="$(jq -r '.queue.p1NextAttemptAt // "—"' <<<"$response")"
          next_platform="$(jq -r '.queue.p1NextJob.platform // "—"' <<<"$response")"
          next_attempts="$(jq -r 'if .queue.p1NextJob == null then "—" else ((.queue.p1NextJob.attempts|tostring) + "/" + (.queue.p1NextJob.maxAttempts|tostring)) end' <<<"$response")"

          if [ -s p1-work-diagnostics.jsonl ]; then
            jq -s '.' p1-work-diagnostics.jsonl > p1-diagnostics.json
          else
            printf '[]\n' > p1-diagnostics.json
          fi
          printf '%s\n' "$response" > p1-final-response.json
          jq 'group_by(.platform) | map({key:(.[0].platform // "unknown"),value:{tasks:length,captures:(map(.capturesRecorded)|add//0),duplicates:(map(.duplicatesSkipped)|add//0),quarantined:(map(.quarantined)|add//0)}}) | from_entries' \
            p1-diagnostics.json > p1-by-platform.json

          captures_recorded="$(jq '[.[].capturesRecorded] | add // 0' p1-diagnostics.json)"
          duplicates_skipped="$(jq '[.[].duplicatesSkipped] | add // 0' p1-diagnostics.json)"
          quarantined="$(jq '[.[].quarantined] | add // 0' p1-diagnostics.json)"
          contents_found="$(jq '[.[].contentsFound] | add // 0' p1-diagnostics.json)"
          by_platform="$(jq -c . p1-by-platform.json)"

          jq -nc \
            --arg dispatchId "$dispatch_id" --argjson processed "$processed" --argjson completed "$completed" \
            --argjson partial "$partial" --argjson retried "$retried" --argjson skipped "$skipped" --argjson failed "$failed" \
            --argjson iterations "$iteration" --argjson p1Remaining "$p1_remaining" --argjson globalRemaining "$global_remaining" \
            --argjson capturesRecorded "$captures_recorded" --argjson duplicatesSkipped "$duplicates_skipped" \
            --argjson quarantined "$quarantined" --argjson contentsFound "$contents_found" \
            --slurpfile byPlatform p1-by-platform.json --slurpfile diagnostics p1-diagnostics.json \
            --slurpfile final p1-final-response.json \
            '{ok:true,diagnosticsVersion:"WORK-DIAG-V1.0",dispatchId:$dispatchId,processed:$processed,completed:$completed,partial:$partial,retried:$retried,skipped:$skipped,failed:$failed,iterations:$iterations,p1Remaining:$p1Remaining,globalRemaining:$globalRemaining,capturesRecorded:$capturesRecorded,duplicatesSkipped:$duplicatesSkipped,quarantined:$quarantined,contentsFound:$contentsFound,byPlatform:$byPlatform[0],diagnostics:$diagnostics[0],final:$final[0]}' \
            > metrics-p1-result.json

          {
            printf '### Metrics Top 50 P1\n'
            printf -- '- Dispatch : `%s`\n' "$dispatch_id"
            printf -- '- Tâches traitées : %s\n' "$processed"
            printf -- '- Terminées / partielles / ignorées / échouées : %s / %s / %s / %s\n' "$completed" "$partial" "$skipped" "$failed"
            printf -- '- Captures nouvelles / doublons / quarantaine : %s / %s / %s\n' "$captures_recorded" "$duplicates_skipped" "$quarantined"
            printf -- '- Contenus observés : %s\n' "$contents_found"
            printf -- '- Diagnostic par plateforme : `%s`\n' "$by_platform"
            printf -- '- Réessais programmés : %s\n' "$retried"
            printf -- '- File P1 restante / globale : %s / %s\n' "$p1_remaining" "$global_remaining"
            printf -- '- P1 en retry_wait : %s\n' "$retry_wait"
            printf -- '- Prochain réessai P1 : %s\n' "$next_attempt"
            printf -- '- Plateforme / tentatives de la prochaine tâche : %s / %s\n' "$next_platform" "$next_attempts"
            printf -- '- Écriture app_state : `0`\n'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            printf 'processed=%s\nremaining=%s\nglobal_remaining=%s\nretry_wait=%s\ndispatch_id=%s\n' "$processed" "$p1_remaining" "$global_remaining" "$retry_wait" "$dispatch_id"
            printf 'captures_recorded=%s\nduplicates_skipped=%s\nquarantined=%s\n' "$captures_recorded" "$duplicates_skipped" "$quarantined"
          } >> "$GITHUB_OUTPUT"

      - name: Publish sanitized P1 status
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STEP_OUTCOME: ${{ steps.collection.outcome }}
          PROCESSED: ${{ steps.collection.outputs.processed }}
          REMAINING: ${{ steps.collection.outputs.remaining }}
          RETRY_WAIT: ${{ steps.collection.outputs.retry_wait }}
          CAPTURES: ${{ steps.collection.outputs.captures_recorded }}
          DUPLICATES: ${{ steps.collection.outputs.duplicates_skipped }}
        run: |
          set -euo pipefail
          processed="${PROCESSED:-0}"; remaining="${REMAINING:-0}"; retry_wait="${RETRY_WAIT:-0}"
          captures="${CAPTURES:-0}"; duplicates="${DUPLICATES:-0}"
          state="success"; description="P1 terminé · ${processed} tâches · ${captures} captures · ${duplicates} doublons · app_state 0"
          if [ "$STEP_OUTCOME" != "success" ]; then state="failure"; description="P1 interrompu · classement public inchangé";
          elif [ "$remaining" != "0" ]; then state="pending"; description="P1 en attente · ${processed} traitées · ${remaining} restantes (${retry_wait} retry) · app_state 0"; fi
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(jq -nc --arg state "$state" --arg target_url "$target_url" --arg description "$description" --arg context "pass50/metrics-p1" '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl --fail-with-body --silent --show-error -X POST -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}"

      - name: Archive sanitized P1 result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: metrics-p1-${{ github.run_id }}-${{ github.run_attempt }}
          path: metrics-p1-result.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Dispatch experimental ranking
        if: ${{ steps.collection.outcome == 'success' && steps.collection.outputs.remaining == '0' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg ref "main" '{ref:$ref}')"
          curl --fail-with-body --silent --show-error -X POST -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/metrics-ranking-experimental.yml/dispatches"
