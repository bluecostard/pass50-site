name: Metrics Top 50 P1

on:
  schedule:
    - cron: '7 */2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/metrics-top50-2h.yml'

permissions:
  actions: write
  contents: read
  statuses: write

concurrency:
  group: pass50-metrics-p1
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CRON_URL: ${{ secrets.PASS50_METRICS_CRON_URL }}
      CRON_SECRET: ${{ secrets.PASS50_METRICS_CRON_SECRET }}
      STATUS_SHA: ${{ github.sha }}
    steps:
      - name: Dispatch and process P1
        id: collection
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::PASS50 metrics cron secrets are not configured."
            exit 0
          fi
          dispatch_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-p1"
          call_cron() {
            local body="$1" timestamp signature
            timestamp="$(date +%s)"
            signature="$(printf '%s\n%s' "$timestamp" "$body" | openssl dgst -sha256 -hmac "$CRON_SECRET" -r | awk '{print $1}')"
            curl --fail-with-body --silent --show-error --max-time 55 \
              -H "Content-Type: application/json" -H "X-P50-Timestamp: $timestamp" \
              -H "X-P50-Signature: $signature" --data "$body" "$CRON_URL"
          }
          response="$(call_cron "$(jq -nc --arg id "$dispatch_id" '{action:"dispatch",cadence:"p1",dispatchId:$id}')")"
          remaining="$(jq -r '.remaining // 0' <<<"$response")"
          processed=0
          for iteration in $(seq 1 180); do
            [ "$remaining" -eq 0 ] && break
            response="$(call_cron "$(jq -nc --arg id "$dispatch_id" --argjson iteration "$iteration" '{action:"work",cadence:"p1",dispatchId:$id,iteration:$iteration}')")"
            remaining="$(jq -r '.remaining // 0' <<<"$response")"
            processed=$((processed + $(jq -r '.processed // 0' <<<"$response")))
          done
          printf '%s\n' "$response" > metrics-p1-result.json
          {
            printf '### Metrics Top 50 P1\n'
            printf -- '- Dispatch : `%s`\n' "$dispatch_id"
            printf -- '- Tâches traitées : %s\n' "$processed"
            printf -- '- File restante : %s\n' "$remaining"
            printf -- '- Écriture app_state : `0`\n'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            printf 'processed=%s\n' "$processed"
            printf 'remaining=%s\n' "$remaining"
            printf 'dispatch_id=%s\n' "$dispatch_id"
          } >> "$GITHUB_OUTPUT"

      - name: Publish sanitized P1 status
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STEP_OUTCOME: ${{ steps.collection.outcome }}
          PROCESSED: ${{ steps.collection.outputs.processed }}
          REMAINING: ${{ steps.collection.outputs.remaining }}
        run: |
          set -euo pipefail
          processed="${PROCESSED:-0}"
          remaining="${REMAINING:-0}"
          state="success"
          description="P1 terminé · ${processed} tâches traitées · ${remaining} restantes · app_state 0"
          if [ "$STEP_OUTCOME" != "success" ]; then
            state="failure"
            description="P1 interrompu · classement public inchangé"
          elif [ "$remaining" != "0" ]; then
            state="pending"
            description="P1 incomplet · ${processed} traitées · ${remaining} restantes · app_state 0"
          fi
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(jq -nc --arg state "$state" --arg target_url "$target_url" --arg description "$description" --arg context "pass50/metrics-p1" '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl --fail-with-body --silent --show-error \
            -X POST -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}"

      - name: Archive sanitized P1 result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: metrics-p1-${{ github.run_id }}-${{ github.run_attempt }}
          path: metrics-p1-result.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Dispatch experimental ranking
        if: ${{ steps.collection.outcome == 'success' && steps.collection.outputs.remaining == '0' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg ref "main" '{ref:$ref}')"
          curl --fail-with-body --silent --show-error \
            -X POST -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/metrics-ranking-experimental.yml/dispatches"
