name: Validate Live Radar V4

on:
  pull_request:
    paths:
      - 'api/live-radar-v4-core.php'
      - 'api/live-radar-v4-source.php'
      - 'api/live-radar-v4-parsers.php'
      - 'api/live-radar-v4-storage.php'
      - 'api/live-status-v4.php'
      - 'api/live-radar-unknown-audit.php'
      - 'api/live-status.php'
      - 'api/live-dismiss.php'
      - 'live-radar-v3.js'
      - 'live-experience-v4-1.js'
      - 'live-dismiss-ui-v1.js'
      - 'public-copy-fixes.js'
      - 'sw.js'
      - 'LIVE_RADAR_V4_NOTES.md'
      - 'tests/test_live_radar_v3.py'
      - 'tests/test_live_experience_v4_1.py'
      - 'tests/test_live_radar_v4_static.py'
      - 'tests/test_live_radar_v4_docs.py'
      - 'tests/test_live_radar_runtime_v4.py'
      - 'tests/live_radar_v4_core.php'
      - 'tests/live_radar_v4_mariadb.php'
      - 'scripts/live_radar_unknown_audit.py'
      - 'scripts/live_radar_p0_webcast.py'
      - 'scripts/live_radar_continuous_tick.py'
      - 'tests/test_live_radar_unknown_audit.py'
      - 'tests/test_live_radar_p0_webcast.py'
      - 'tests/test_live_radar_autonomy_freeze_v1.py'
      - 'tests/test_cahie_kunta_live_radar.py'
      - 'tests/test_daniel_m_live_radar.py'
      - 'tests/test_akalajoie_live_radar.py'
      - 'tests/test_roseline_layo_live_radar.py'
      - 'tests/test_rach_makosso_live_radar.py'
      - '.github/workflows/validate-live-radar-v3.yml'
      - '.github/workflows/live-radar-sweep.yml'
      - '.github/workflows/live-radar-unknown-audit.yml'
      - '.github/workflows/live-radar-quick.yml'
      - '.github/workflows/live-radar-p0.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: pass50_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      P50_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=pass50_test;charset=utf8mb4
      P50_TEST_DB_USER: root
      P50_TEST_DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Vérifier la syntaxe PHP
        run: |
          php -l api/live-radar-v4-core.php
          php -l api/live-radar-v4-source.php
          php -l api/live-radar-v4-parsers.php
          php -l api/live-radar-v4-storage.php
          php -l api/live-status-v4.php
          php -l api/live-radar-unknown-audit.php
          php -l api/live-status.php
          php -l api/live-dismiss.php
          php -l tests/live_radar_v4_core.php
          php -l tests/live_radar_v4_mariadb.php
      - name: Vérifier la syntaxe JavaScript
        run: |
          node --check live-radar-v3.js
          node --check live-experience-v4-1.js
          node --check live-dismiss-ui-v1.js
          node --check public-copy-fixes.js
      - name: Exécuter les tests déterministes
        run: |
          python3 -m unittest tests/test_live_radar_v3.py
          python3 -m unittest tests/test_live_experience_v4_1.py
          python3 -m unittest tests/test_live_radar_v4_static.py
          python3 -m unittest tests/test_live_radar_v4_docs.py
          python3 -m unittest tests/test_live_radar_runtime_v4.py
          python3 -m unittest tests/test_live_radar_unknown_audit.py
          python3 -m unittest tests/test_live_radar_p0_webcast.py
          python3 -m unittest tests/test_live_radar_autonomy_freeze_v1.py
          python3 -m unittest tests/test_cahie_kunta_live_radar.py
          python3 -m unittest tests/test_daniel_m_live_radar.py
          python3 -m unittest tests/test_akalajoie_live_radar.py
          python3 -m unittest tests/test_roseline_layo_live_radar.py
          python3 -m unittest tests/test_rach_makosso_live_radar.py
          php tests/live_radar_v4_core.php
      - name: Vérifier la continuité MariaDB
        run: php tests/live_radar_v4_mariadb.php
      - name: Vérifier le diff
        run: git diff --check origin/${{ github.base_ref }}...HEAD
