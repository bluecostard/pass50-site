name: Metrics Ranking Publication Watchdog

# Anti-silence: if public ranking was not written for too long while flags are on
# and a candidate is eligible, republish. Fail loudly if flags are off or recovery fails.

"on":
  schedule:
    - cron: '10,40 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  statuses: write

concurrency:
  group: pass50-metrics-ranking-publication-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CRON_URL: ${{ secrets.PASS50_METRICS_CRON_URL }}
      CRON_SECRET: ${{ secrets.PASS50_METRICS_CRON_SECRET }}
      MAX_STALE_HOURS: '2.0'
    steps:
      - name: Probe flags, freshness, recover if stale
        id: watchdog
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CRON_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Secrets PASS50 metrics cron manquants."
            exit 1
          fi
          CRON_URL="${CRON_URL//www.pass50.store/pass50.store}"
          CRON_URL="${CRON_URL/#http:/https:}"

          case "$CRON_URL" in
            */metrics-cron.php)
              APPLY_URL="${CRON_URL%/metrics-cron.php}/metrics-ranking-publication-apply-cron.php"
              HISTORY_URL="${CRON_URL%/metrics-cron.php}/metrics-ranking-publication-apply-history-cron-v1.php"
              ;;
            *)
              echo "::error::PASS50_METRICS_CRON_URL doit se terminer par /metrics-cron.php"
              exit 1
              ;;
          esac
          case "$APPLY_URL" in
            http://*) APPLY_URL="https://${APPLY_URL#http://}" ;;
          esac
          case "$APPLY_URL" in
            https://www.pass50.store/*) APPLY_URL="https://pass50.store/${APPLY_URL#https://www.pass50.store/}" ;;
          esac
          case "$HISTORY_URL" in
            http://*) HISTORY_URL="https://${HISTORY_URL#http://}" ;;
          esac
          case "$HISTORY_URL" in
            https://www.pass50.store/*) HISTORY_URL="https://pass50.store/${HISTORY_URL#https://www.pass50.store/}" ;;
          esac

          signed_post() {
            local url="$1"
            local body="$2"
            local out="$3"
            local timestamp signature code st
            timestamp="$(date +%s)"
            signature="$(
              printf '%s\n%s' "$timestamp" "$body" |
                openssl dgst -sha256 -hmac "$CRON_SECRET" -r |
                awk '{print $1}'
            )"
            set +e
            code="$(
              curl --silent --show-error --max-time 180 \
                --output "$out" \
                --write-out '%{http_code}' \
                -H "Content-Type: application/json" \
                -H "X-P50-Timestamp: $timestamp" \
                -H "X-P50-Signature: $signature" \
                --data "$body" \
                "$url"
            )"
            st=$?
            set -e
            echo "$code"
            return "$st"
          }

          dispatch_base="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-watchdog"

          probe_body="$(jq -nc --arg dispatchId "${dispatch_base}-probe" '{action:"probe",dispatchId:$dispatchId}')"
          probe_code="$(signed_post "$APPLY_URL" "$probe_body" watchdog-probe.json || true)"
          if [ "$probe_code" != "200" ]; then
            echo "::error::Probe flags HTTP $probe_code"
            cat watchdog-probe.json || true
            exit 1
          fi
          jq -e '.ok == true' watchdog-probe.json >/dev/null
          pub="$(jq -r '.publicationEnabled // false' watchdog-probe.json)"
          auto="$(jq -r '.automaticPublicationEnabled // false' watchdog-probe.json)"
          if [ "$pub" != "true" ] || [ "$auto" != "true" ]; then
            echo "::error::Flags publication eteints (publicationEnabled=$pub, automaticPublicationEnabled=$auto). Relancer Enable Ranking Publication Flags."
            exit 1
          fi

          hist_body="$(jq -nc --arg dispatchId "${dispatch_base}-history" '{action:"history",dispatchId:$dispatchId}')"
          hist_code="$(signed_post "$HISTORY_URL" "$hist_body" watchdog-history.json || true)"
          if [ "$hist_code" != "200" ]; then
            echo "::error::Historique apply HTTP $hist_code"
            cat watchdog-history.json || true
            exit 1
          fi
          jq -e '.ok == true' watchdog-history.json >/dev/null

          latest_at="$(jq -r '.latestApplied.generatedAt // empty' watchdog-history.json)"
          latest_rev="$(jq -r '.latestApplied.publicRevisionAfter // 0' watchdog-history.json)"
          if [ -z "$latest_at" ] || [ "$latest_at" = "null" ]; then
            echo "::error::Aucune publication apply reussie trouvee dans l historique."
            exit 1
          fi

          age_hours="$(
            LATEST_AT="$latest_at" python3 -c 'import os; from datetime import datetime, timezone; raw=os.environ["LATEST_AT"].strip().replace(" ","T"); raw=(raw[:-1]+"+00:00") if raw.endswith("Z") else raw; raw=(raw[:19].replace(" ","T")+"+00:00") if ("T" not in raw and len(raw)>=19) else ((raw[:19]+"+00:00") if ("+" not in raw[10:] and "Z" not in raw) else raw); dt=datetime.fromisoformat(raw); dt=dt.replace(tzinfo=timezone.utc) if dt.tzinfo is None else dt; print(f"{(datetime.now(timezone.utc)-dt.astimezone(timezone.utc)).total_seconds()/3600.0:.3f}")'
          )"
          echo "Derniere ecriture : $latest_at (rev. $latest_rev) / age ${age_hours}h"

          preview_body="$(jq -nc --arg dispatchId "${dispatch_base}-preview" '{action:"preview",dispatchId:$dispatchId}')"
          preview_code="$(signed_post "$APPLY_URL" "$preview_body" watchdog-preview.json || true)"
          if [ "$preview_code" != "200" ]; then
            echo "::error::Preview HTTP $preview_code"
            cat watchdog-preview.json || true
            exit 1
          fi
          jq -e '.ok == true' watchdog-preview.json >/dev/null
          eligible="$(jq -r '.publicationEligible // .automaticPublicationEligible // false' watchdog-preview.json)"
          mutations="$(jq -r '.summary.mutations // .totalMutations // 0' watchdog-preview.json)"

          {
            printf '### Watchdog publication classement\n'
            printf -- '- flags : publication=`%s` automatic=`%s`\n' "$pub" "$auto"
            printf -- '- derniere ecriture : `%s` (rev. `%s`)\n' "$latest_at" "$latest_rev"
            printf -- '- age : `%sh` (seuil `%s`)\n' "$age_hours" "$MAX_STALE_HOURS"
            printf -- '- preview eligible : `%s` / mutations : `%s`\n' "$eligible" "$mutations"
          } >> "$GITHUB_STEP_SUMMARY"

          stale="$(python3 -c "print('true' if float('$age_hours') >= float('$MAX_STALE_HOURS') else 'false')")"

          if [ "$stale" != "true" ]; then
            echo "::notice::Classement frais (${age_hours}h < ${MAX_STALE_HOURS}h). Rien a faire."
            printf 'stale=false\nrecovered=false\nage_hours=%s\n' "$age_hours" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::warning::Classement stale (${age_hours}h). Tentative de recovery."

          if [ "$eligible" != "true" ]; then
            echo "::error::Classement stale et candidat non eligible (mutations=$mutations). Intervention requise."
            exit 1
          fi

          apply_body="$(jq -nc --arg dispatchId "${dispatch_base}-apply" '{action:"apply",dispatchId:$dispatchId,confirm:true}')"
          apply_code="$(signed_post "$APPLY_URL" "$apply_body" watchdog-apply.json || true)"
          if [ "$apply_code" != "200" ]; then
            echo "::error::Recovery apply HTTP $apply_code"
            cat watchdog-apply.json || true
            exit 1
          fi
          jq -e '.ok == true' watchdog-apply.json >/dev/null
          skipped="$(jq -r '.skipped // false' watchdog-apply.json)"
          reason="$(jq -r '.reason // .error // "-"' watchdog-apply.json)"
          writes="$(jq -r '.publicStateWrites // 0' watchdog-apply.json)"
          revision="$(jq -r '.publicStateRevision // 0' watchdog-apply.json)"

          if [ "$skipped" = "true" ] || [ "${reason}" = "automatic_disabled" ]; then
            echo "::error::Recovery skippee : $reason"
            exit 1
          fi
          if [ "$writes" = "0" ]; then
            echo "::error::Recovery sans ecriture publique (rev=$revision)."
            cat watchdog-apply.json || true
            exit 1
          fi

          echo "::notice::Recovery OK / revision $revision / writes=$writes"
          {
            printf -- '- recovery : `ok` / revision `%s` / writes `%s`\n' "$revision" "$writes"
          } >> "$GITHUB_STEP_SUMMARY"
          printf 'stale=true\nrecovered=true\nage_hours=%s\nrevision=%s\n' "$age_hours" "$revision" >> "$GITHUB_OUTPUT"

      - name: Archive watchdog evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: publication-watchdog-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            watchdog-probe.json
            watchdog-history.json
            watchdog-preview.json
            watchdog-apply.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish commit status
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STEP_OUTCOME: ${{ steps.watchdog.outcome }}
        run: |
          set -euo pipefail
          state="success"
          description="watchdog classement OK"
          if [ "$STEP_OUTCOME" != "success" ]; then
            state="failure"
            description="watchdog classement en echec"
          fi
          payload="$(jq -nc \
            --arg state "$state" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg description "$description" \
            --arg context "pass50/publication-watchdog" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
