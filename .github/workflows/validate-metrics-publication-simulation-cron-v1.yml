name: Validate Metrics Publication Simulation Cron V1

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PHP lint
        run: php -l api/metrics-ranking-publication-simulate-cron.php
      - name: Static tests
        run: python3 -m unittest tests.test_metrics_ranking_publication_simulation_cron_v1
      - name: Workflow syntax guards
        run: |
          grep -F "cron: '12 1-23/2 * * *'" .github/workflows/metrics-ranking-publication-simulation.yml
          grep -F 'p50_mo_verify_cron_signature' api/metrics-ranking-publication-simulate-cron.php
          grep -F '.scope.publicStateWrites == 0' .github/workflows/metrics-ranking-publication-simulation.yml
      - name: Diff check
        run: git diff --check origin/${{ github.base_ref }}...HEAD
