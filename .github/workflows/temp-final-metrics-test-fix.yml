name: Temporary final metrics test fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/metrics-control-center-youtube-v1
          fetch-depth: 0
      - name: Corriger les deux attentes restantes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          test = Path('tests/metrics_control_center_youtube_mariadb.php')
          text = test.read_text(encoding='utf-8')
          old1 = "$pdo->prepare('INSERT INTO p50_profile_registry(profile_id,public_name,state_hash) VALUES(?,?,?)')->execute(['profile-youtube-1','Profil YouTube 1',str_repeat('a',64)]);"
          new1 = "$pdo->prepare('INSERT INTO p50_profile_registry(profile_id,public_name,alive) VALUES(?,?,1)')->execute(['profile-youtube-1','Profil YouTube 1']);"
          old2 = "$pdo->prepare('INSERT INTO p50_profile_registry(profile_id,public_name,state_hash) VALUES(?,?,?)')->execute(['profile-youtube-2','Profil YouTube 2',str_repeat('b',64)]);"
          new2 = "$pdo->prepare('INSERT INTO p50_profile_registry(profile_id,public_name,alive) VALUES(?,?,1)')->execute(['profile-youtube-2','Profil YouTube 2']);"
          for old,new in ((old1,new1),(old2,new2)):
              if text.count(old)!=1: raise SystemExit('Insertion de fiche test introuvable')
              text=text.replace(old,new,1)
          test.write_text(text,encoding='utf-8')

          calibration=Path('tests/test_metrics_ranking_calibration_v1.py')
          value=calibration.read_text(encoding='utf-8')
          replacements={
              'data-engine-ui.js?v=18.0':'data-engine-ui.js?v=18.1',
              'pass50-v44-ranking-calibration':'pass50-v45-metrics-control-center',
          }
          for old,new in replacements.items():
              if old not in value: raise SystemExit(f'Attente cache introuvable: {old}')
              value=value.replace(old,new)
          calibration.write_text(value,encoding='utf-8')
          PY
      - name: Vérifier les tests corrigés
        run: |
          php -l tests/metrics_control_center_youtube_mariadb.php
          python3 -m unittest tests.test_metrics_ranking_calibration_v1
      - name: Enregistrer les corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/metrics_control_center_youtube_mariadb.php tests/test_metrics_ranking_calibration_v1.py
          git commit -m "Finaliser les tests du centre de contrôle métrique"
          git push origin HEAD:feat/metrics-control-center-youtube-v1
