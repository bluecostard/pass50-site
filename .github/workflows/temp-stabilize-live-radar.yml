name: Temporary stabilize live radar

on:
  push:
    branches:
      - fix/live-radar-confirmed-only
    paths:
      - '.github/workflows/temp-stabilize-live-radar.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-radar-confirmed-only
          fetch-depth: 0
      - name: Appliquer les correctifs ciblés
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          parser_path = Path('api/live-radar-v4-parsers.php')
          parser = parser_path.read_text(encoding='utf-8')
          facebook = r'''function p50_live_v4_parse_facebook(array $source,array $responses): array {
              $identity=p50_live_v4_identity('Facebook',(string)$source['url']);$errors=[];$maxMs=0;$ok=0;$blocked=0;$positive=[];$activeWithoutVideo=[];$endedLabels=[];$videoVotes=[];$bodies=[];$structuredLabels=[];
              foreach($responses as $label=>$r){
                  $maxMs=max($maxMs,(int)($r['timeMs']??0));
                  if(empty($r['ok'])){$errors[]=$label.':http_'.($r['status']??0);continue;}
                  $ok++;$body=p50_live_v4_unescape((string)($r['body']??''));$probe=$body."\n".(string)($r['finalUrl']??'');$bodies[$label]=$body;
                  if($body===''||p50_live_v4_block_page($probe)){$blocked++;continue;}
                  $structuredActive=(bool)preg_match('/"(?:is_live_streaming|isLiveStreaming|is_live|isLive)"\s*:\s*true|"broadcast_status"\s*:\s*"(?:LIVE|ACTIVE)"/i',$probe);
                  $textActive=(bool)preg_match('/\b(?:est\s+en\s+direct|en\s+direct\s+maintenant|is\s+live(?:\s+now)?|currently\s+live|live\s+now|diffusion\s+en\s+direct)\b/iu',$probe);
                  $ended=(bool)preg_match('/"(?:is_live_streaming|isLiveStreaming|is_live|isLive)"\s*:\s*false|"broadcast_status"\s*:\s*"(?:VOD|ENDED|FINISHED)"|live video has ended|\bwas live\b|\bétait en direct\b|\bdirect (?:est )?termin(?:é|e)\b/iu',$probe);
                  $ids=[];
                  foreach([
                      '#facebook\.com/(?:watch/\?v=|[^"\'<>\s]+/videos/)([1-9]\d{5,})#i',
                      '#/(?:videos|live_videos)/([1-9]\d{5,})#i',
                      '/"(?:video_id|videoId|broadcast_id|broadcastId)"\s*:\s*"?([1-9]\d{5,})"?/i',
                  ] as $pattern)if(preg_match_all($pattern,$probe,$matches))foreach($matches[1] as $id)$ids[(string)$id]=true;
                  if($ended&&!$structuredActive){$endedLabels[]=$label;continue;}
                  $active=$structuredActive||$textActive;
                  if(!$active)continue;
                  if($structuredActive)$structuredLabels[]=$label;
                  if(!$ids){$activeWithoutVideo[]=$label;continue;}
                  $positive[$label]=array_keys($ids);
                  foreach(array_keys($ids) as $id)$videoVotes[$id]=($videoVotes[$id]??0)+1;
              }
              if($ok===0)return ['state'=>'unknown','error'=>implode(';',$errors),'confidence'=>0,'responseMs'=>$maxMs];
              $bestId='';$votes=0;if($videoVotes){arsort($videoVotes);$bestId=(string)array_key_first($videoVotes);$votes=(int)($videoVotes[$bestId]??0);}
              $hasStructuredVideo=false;foreach($structuredLabels as $label)if(!empty($positive[$label])){$hasStructuredVideo=true;break;}
              if($bestId!==''&&($hasStructuredVideo||$votes>=2||$positive)){
                  $confidence=$hasStructuredVideo?96:($votes>=2?91:86);$bestLabel='';
                  foreach(array_keys($positive) as $label)if(in_array($bestId,$positive[$label],true)){$bestLabel=$label;break;}
                  if($bestLabel==='')$bestLabel=(string)array_key_first($positive);
                  $bestBody=(string)($bodies[$bestLabel]??'');$meta=p50_page_metadata($bestBody,(string)($responses[$bestLabel]['finalUrl']??$identity['liveUrl']));
                  $title=trim((string)($meta['title']??''));if($title===''||preg_match('/^(Facebook|Watch Facebook)$/iu',$title))$title=trim((string)($source['public_name']??'Facebook')).' est en direct';
                  $url='https://www.facebook.com/watch/?v='.rawurlencode($bestId);
                  return ['state'=>'live','confidence'=>$confidence,'responseMs'=>$maxMs,'live'=>['profileId'=>(string)$source['profile_id'],'platform'=>'Facebook','title'=>$title,'url'=>$url,'thumbnail'=>(string)($meta['image']??''),'confidence'=>$confidence,'startedAt'=>null,'viewers'=>p50_live_v4_viewers(implode("\n",$bodies)),'metadata'=>['profileUrl'=>$identity['profileUrl'],'videoId'=>$bestId,'probeLabels'=>array_keys($positive),'videoVotes'=>$votes,'structuredLabels'=>$structuredLabels,'probe'=>'public_multi_probe']],'evidence'=>['positive'=>array_keys($positive),'ended'=>$endedLabels,'blocked'=>$blocked,'videoVotes'=>$videoVotes]];
              }
              if($activeWithoutVideo)return ['state'=>'probable','error'=>'facebook_active_without_specific_video','confidence'=>74,'responseMs'=>$maxMs,'live'=>['profileId'=>(string)$source['profile_id'],'platform'=>'Facebook','title'=>trim((string)($source['public_name']??'Facebook')).' semble être en direct','url'=>$identity['liveUrl'],'thumbnail'=>'','confidence'=>74,'startedAt'=>null,'viewers'=>p50_live_v4_viewers(implode("\n",$bodies)),'metadata'=>['profileUrl'=>$identity['profileUrl'],'classification'=>'probable','probeLabels'=>$activeWithoutVideo]],'evidence'=>['positive'=>[],'ended'=>$endedLabels,'blocked'=>$blocked]];
              if($endedLabels)return ['state'=>'offline','error'=>'facebook_explicit_offline','confidence'=>96,'responseMs'=>$maxMs,'evidence'=>['ended'=>$endedLabels,'blocked'=>$blocked]];
              return ['state'=>'unknown','error'=>$blocked>0?'facebook_blocked_or_challenged':'facebook_no_public_live_signal','confidence'=>0,'responseMs'=>$maxMs,'evidence'=>['ended'=>$endedLabels,'blocked'=>$blocked,'errors'=>$errors]];
          }'''
          pattern = r"function p50_live_v4_parse_facebook\(.*?\n}\n\nfunction p50_live_v4_parse_source"
          parser, count = re.subn(pattern, facebook + "\n\nfunction p50_live_v4_parse_source", parser, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Bloc Facebook remplacé {count} fois')
          parser_path.write_text(parser, encoding='utf-8')

          storage_path = Path('api/live-radar-v4-storage.php')
          storage = storage_path.read_text(encoding='utf-8')
          active_rows = r'''function p50_live_v4_active_rows(): array {
              db()->exec("UPDATE p50_live_streams SET status='ended',ended_at=COALESCE(ended_at,UTC_TIMESTAMP()) WHERE source='automatic' AND status='unconfirmed' AND last_seen_at<DATE_SUB(UTC_TIMESTAMP(),INTERVAL 24 HOUR)");
              db()->exec("UPDATE p50_live_streams SET status='ended',ended_at=COALESCE(ended_at,UTC_TIMESTAMP()) WHERE source='meta_authorized' AND status='live' AND last_seen_at<DATE_SUB(UTC_TIMESTAMP(),INTERVAL 20 MINUTE)");
              db()->exec("UPDATE p50_live_streams s JOIN p50_live_source_health h ON h.profile_id=s.profile_id AND h.platform=s.platform SET s.status='unconfirmed',s.metadata=JSON_SET(COALESCE(s.metadata,'{}'),'$.withdrawalReason','latest_probe_not_confirmed') WHERE s.source='automatic' AND s.status='live' AND h.last_state IN ('unknown','probable') AND s.last_seen_at<DATE_SUB(UTC_TIMESTAMP(),INTERVAL 3 MINUTE)");
              foreach(P50_LIVE_V4_GRACE_MINUTES as $platform=>$minutes){$minutes=max(1,(int)$minutes);$stmt=db()->prepare("UPDATE p50_live_streams SET status='unconfirmed',metadata=JSON_SET(COALESCE(metadata,'{}'),'$.withdrawalReason','confirmation_grace_expired') WHERE source='automatic' AND status='live' AND platform=? AND last_seen_at<DATE_SUB(UTC_TIMESTAMP(),INTERVAL {$minutes} MINUTE)");$stmt->execute([$platform]);}
              $conditions=[];$params=[];
              foreach(P50_LIVE_V4_GRACE_MINUTES as $platform=>$minutes){$minutes=max(1,(int)$minutes);$conditions[]="(s.source='automatic' AND s.platform=? AND s.last_seen_at>=DATE_SUB(UTC_TIMESTAMP(),INTERVAL {$minutes} MINUTE) AND (h.last_state='live' OR (h.last_state='unknown' AND s.last_seen_at>=DATE_SUB(UTC_TIMESTAMP(),INTERVAL 3 MINUTE))))";$params[]=$platform;}
              $conditions[]="(s.source='meta_authorized' AND s.last_seen_at>=DATE_SUB(UTC_TIMESTAMP(),INTERVAL 20 MINUTE))";
              $stmt=db()->prepare("SELECT s.*,h.last_state,h.last_checked_at,h.last_live_at,h.last_error,h.response_ms FROM p50_live_streams s LEFT JOIN p50_live_source_health h ON h.profile_id=s.profile_id AND h.platform=s.platform WHERE s.source IN ('automatic','meta_authorized') AND s.status='live' AND (".implode(' OR ',$conditions).") ORDER BY (s.source='meta_authorized') DESC,s.last_seen_at DESC");$stmt->execute($params);$out=[];
              foreach($stmt->fetchAll() as $row){$source=(string)$row['source'];$out[]=['id'=>($source==='meta_authorized'?'meta_':'auto_').substr((string)$row['stream_key'],0,18),'profileId'=>(string)$row['profile_id'],'platform'=>(string)$row['platform'],'title'=>(string)$row['title'],'url'=>(string)$row['url'],'thumbnail'=>(string)($row['thumbnail_url']??''),'status'=>'live','source'=>$source,'confidence'=>(int)$row['confidence'],'viewers'=>$row['viewers']!==null?(int)$row['viewers']:null,'startedAt'=>p50_live_v4_iso($row['started_at']??null),'lastSeenAt'=>p50_live_v4_iso($row['last_seen_at']??null),'lastConfirmedAt'=>p50_live_v4_iso($row['last_seen_at']??null),'lastCheckState'=>$source==='meta_authorized'?'live':(string)($row['last_state']??'unknown'),'endsAt'=>null];}
              return $out;
          }'''
          pattern = r"function p50_live_v4_active_rows\(\): array \{.*?\n}\nfunction p50_live_v4_manual_streams"
          storage, count = re.subn(pattern, active_rows + "\nfunction p50_live_v4_manual_streams", storage, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Bloc active_rows remplacé {count} fois')
          storage_path.write_text(storage, encoding='utf-8')

          test_path = Path('tests/test_live_radar_v4_static.py')
          tests = test_path.read_text(encoding='utf-8')
          anchor = "\n\nif __name__ == '__main__':"
          extra = '''

    def test_public_rows_require_latest_confirmation(self):
        storage = FILES['storage']
        self.assertIn("h.last_state='live'", storage)
        self.assertIn("INTERVAL 3 MINUTE", storage)
        self.assertIn("latest_probe_not_confirmed", storage)
        self.assertNotIn("h.last_state='probable' OR", storage)

    def test_facebook_uses_specific_video_and_independent_probes(self):
        parser = FILES['parsers']
        self.assertIn('videoVotes', parser)
        self.assertIn('public_multi_probe', parser)
        self.assertIn("$votes>=2", parser)
        self.assertIn('facebook_active_without_specific_video', parser)
'''
          if 'test_public_rows_require_latest_confirmation' not in tests:
              if anchor not in tests:
                  raise SystemExit('Ancre de test introuvable')
              tests = tests.replace(anchor, extra + anchor, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY
      - name: Vérifier PHP et les tests Radar
        run: |
          php -l api/live-radar-v4-parsers.php
          php -l api/live-radar-v4-storage.php
          python3 -m unittest discover -s tests -p 'test_live_radar_v4*.py'
      - name: Enregistrer la stabilisation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/live-radar-v4-parsers.php api/live-radar-v4-storage.php tests/test_live_radar_v4_static.py
          git commit -m "Stabiliser les LIVE actifs et élargir Facebook public"
          git push origin HEAD:fix/live-radar-confirmed-only

# trigger
