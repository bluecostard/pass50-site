name: Temporary Meta OAuth metrics patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/meta-oauth-automatic-metrics
          fetch-depth: 0
      - name: Appliquer les raccordements stricts
        run: python3 tools/apply_meta_oauth_metrics_patch.py
      - name: Vérifier avant commit
        run: |
          php -l api/metrics-collectors-core.php
          php -l api/metrics-orchestrator-core.php
          node --check data-engine-ui.js
          python3 -m unittest tests.test_meta_oauth_automatic_metrics
      - name: Enregistrer les raccordements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/metrics-collectors-core.php api/metrics-orchestrator-core.php data-engine-ui.js v9-tools.js sw.js tests/test_metrics_ranking_experimental_v1.py tests/test_metrics_ranking_calibration_v1.py
          git commit -m "Raccorder les actifs Meta OAuth au pipeline métrique"
          git push origin HEAD:feat/meta-oauth-automatic-metrics
