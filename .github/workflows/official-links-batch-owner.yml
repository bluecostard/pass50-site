name: Official Links Batch Owner
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['api/official-links-batch-owner-cron-v1.php','.github/workflows/official-links-batch-owner.yml']
permissions: {contents: read, statuses: write}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CRON_URL: ${{ secrets.PASS50_METRICS_CRON_URL }}
      CRON_SECRET: ${{ secrets.PASS50_METRICS_CRON_SECRET }}
    steps:
      - name: Confirm owner supplied official accounts
        shell: bash
        run: |
          set -euo pipefail
          case "${CRON_URL:-}" in */metrics-cron.php) ENDPOINT="${CRON_URL%/metrics-cron.php}/official-links-batch-owner-cron-v1.php" ;; *) exit 1 ;; esac
          case "$ENDPOINT" in http://*) ENDPOINT="https://${ENDPOINT#http://}" ;; esac
          case "$ENDPOINT" in https://www.pass50.store/*) ENDPOINT="https://pass50.store/${ENDPOINT#https://www.pass50.store/}" ;; esac
          body="$(jq -nc --arg dispatchId "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" '{dispatchId:$dispatchId}')"
          for attempt in $(seq 1 36);do timestamp="$(date +%s)";signature="$(printf '%s\n%s' "$timestamp" "$body"|openssl dgst -sha256 -hmac "$CRON_SECRET" -r|awk '{print $1}')";code="$(curl --silent --show-error --max-time 90 --output /tmp/links-batch.json --write-out '%{http_code}' -H 'Content-Type: application/json' -H "X-P50-Timestamp: $timestamp" -H "X-P50-Signature: $signature" --data "$body" "$ENDPOINT"||true)";if [ "$code" = 200 ]&&jq -e '.ok==true and .version=="OFFICIAL-LINKS-BATCH-OWNER-V1.2" and .validatedCount>=23 and .targetFrozenProfileCount==3 and .targetFrozenLinkCount>=10 and .publicStateWrites==1' /tmp/links-batch.json >/dev/null 2>&1;then break;fi;echo "Endpoint en attente · $attempt/36 · HTTP ${code:-000}";sleep 10;done
          jq -e '.ok==true and .version=="OFFICIAL-LINKS-BATCH-OWNER-V1.2" and .validatedCount>=23 and .targetFrozenProfileCount==3 and .targetFrozenLinkCount>=10 and .publicStateWrites==1' /tmp/links-batch.json >/dev/null
          jq -e '[.targetFrozenProfiles[].name|ascii_downcase] | any(. == "zagba le requin")' /tmp/links-batch.json >/dev/null
          jq -e '[.targetFrozenProfiles[].name|ascii_downcase] | any(. == "zeinab bancé" or . == "zeinab bance")' /tmp/links-batch.json >/dev/null
          jq -e '[.targetFrozenProfiles[].name|ascii_downcase] | any(. == "samo samo")' /tmp/links-batch.json >/dev/null
          jq -e '[.targetFrozenLinks[] | select(.profileId=="zeinab" and (.platform|ascii_downcase)=="facebook") | .url] | any(. == "https://facebook.com/p/Zeinab-BANCE-WRG-61568549139334")' /tmp/links-batch.json >/dev/null
          cat /tmp/links-batch.json
      - name: Archive proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-links-batch-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/links-batch.json
          if-no-files-found: warn
          retention-days: 30
