name: Disable Instagram Metrics

# Coupe temporairement Instagram dans la collecte métriques (P0/P1 + fraîcheur).
# Les liens officiels et le radar LIVE restent inchangés.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: ${{ secrets.IONOS_SFTP_HOST }}
      USER: ${{ secrets.IONOS_SFTP_USER }}
      PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
      REMOTE_DIR: ${{ secrets.IONOS_REMOTE_DIR }}
      CRON_URL: ${{ secrets.PASS50_METRICS_CRON_URL }}
      CRON_SECRET: ${{ secrets.PASS50_METRICS_CRON_SECRET }}
    steps:
      - name: Installer SFTP
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Couper instagram_enabled dans config.php
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${HOST:-}" ] || [ -z "${USER:-}" ] || [ -z "${PASSWORD:-}" ] || [ -z "${REMOTE_DIR:-}" ]; then
            echo "::error::Secrets IONOS SFTP manquants."
            exit 1
          fi
          mkdir -p /tmp/p50cfg
          lftp <<LFTP
          set cmd:fail-exit yes
          set sftp:auto-confirm yes
          open -u "$USER","$PASSWORD" sftp://$HOST:22
          get "$REMOTE_DIR/api/config.php" -o /tmp/p50cfg/config.php
          bye
          LFTP

          python3 <<'PY'
          from pathlib import Path
          import re
          path = Path('/tmp/p50cfg/config.php')
          text = path.read_text(encoding='utf-8')
          original = text
          key = 'instagram_enabled'
          value = 'false'

          def replace_flag(src: str, key: str, value: str) -> str:
              pat = re.compile(rf"(['\"]{re.escape(key)}['\"]\s*=>\s*)([^,\n\]]+)", re.M)
              m = pat.search(src)
              if not m:
                  return src
              return src[:m.start(2)] + value + src[m.end(2):]

          def find_metrics_open(src: str):
              for pat in (r"(['\"]metrics['\"]\s*=>\s*\[)", r"(['\"]metrics['\"]\s*=>\s*array\s*\()"):
                  m = re.search(pat, src, re.I)
                  if m:
                      return m
              return None

          before = text
          text = replace_flag(text, key, value)
          if text == before:
              if re.search(rf"['\"]{re.escape(key)}['\"]\s*=>\s*false\b", text):
                  print('already_false', key)
              else:
                  metrics = find_metrics_open(text)
                  if metrics is None:
                      raise SystemExit('Section metrics introuvable')
                  inject = f"\n        '{key}' => {value},"
                  text = text[:metrics.end()] + inject + text[metrics.end():]
                  print('injected', key)
          else:
              print('updated', key)

          if not re.search(rf"['\"]{re.escape(key)}['\"]\s*=>\s*false\b", text):
              raise SystemExit('instagram_enabled pas à false après patch')
          path.write_text(text, encoding='utf-8')
          print('changed=', text != original, 'delta=', len(text) - len(original))
          PY

          if command -v php >/dev/null; then php -l /tmp/p50cfg/config.php; else
            sudo apt-get install -y -qq php-cli >/dev/null
            php -l /tmp/p50cfg/config.php
          fi

          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          lftp <<LFTP
          set cmd:fail-exit yes
          set sftp:auto-confirm yes
          open -u "$USER","$PASSWORD" sftp://$HOST:22
          get "$REMOTE_DIR/api/config.php" -o /tmp/p50cfg/config.php.bak
          put /tmp/p50cfg/config.php.bak -o "$REMOTE_DIR/api/config.php.bak-$stamp"
          put /tmp/p50cfg/config.php -o "$REMOTE_DIR/api/config.php"
          bye
          LFTP
          echo "Instagram métriques coupé (backup config.php.bak-$stamp)."

      - name: Purger la file Instagram via un cycle worker
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CRON_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::warning::Secrets cron absents — config patchée, purge file reportée au prochain P0/P1."
            exit 0
          fi
          body="$(jq -nc --arg dispatchId "${GITHUB_RUN_ID}-ig-disable-work" '{action:"work",cadence:"p1",dispatchId:$dispatchId}')"
          timestamp="$(date +%s)"
          signature="$(printf '%s\n%s' "$timestamp" "$body" | openssl dgst -sha256 -hmac "$CRON_SECRET" -r | awk '{print $1}')"
          code="$(curl --silent --show-error --max-time 60 \
            --output /tmp/ig-disable-work.json --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H "X-P50-Timestamp: $timestamp" \
            -H "X-P50-Signature: $signature" \
            --data "$body" "$CRON_URL" || true)"
          echo "work HTTP $code"
          cat /tmp/ig-disable-work.json 2>/dev/null || true
          {
            printf '### Instagram métriques désactivé\n'
            printf -- '- `instagram_enabled` : `false`\n'
            printf -- '- OAuth / tokens ignorés tant que le flag reste false\n'
            printf -- '- Jobs IG pending/running/retry_wait → skipped au prochain recover\n'
          } >> "$GITHUB_STEP_SUMMARY"
