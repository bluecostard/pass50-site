name: Validate Metrics Canonical Schema V1

on:
  pull_request:
    paths:
      - 'api/metrics-schema-core.php'
      - 'api/metrics-migrate.php'
      - 'api/metrics-diagnostic.php'
      - 'api/metrics-observability-core.php'
      - 'data-engine-ui.js'
      - 'tests/test_metrics_schema_v1.py'
      - 'tests/test_metrics_schema_activation.py'
      - 'tests/metrics_schema_integration.php'
      - '.github/workflows/validate-metrics-schema-v1.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: pass50_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier les syntaxes
        run: |
          php -l api/metrics-schema-core.php
          php -l api/metrics-migrate.php
          php -l tests/metrics_schema_integration.php
          node --check data-engine-ui.js
      - name: Exécuter les tests Python
        run: |
          python3 -m unittest tests/test_metrics_schema_activation.py
          python3 -m unittest tests/test_metrics_schema_v1.py tests/test_metrics_observability_v1.py
      - name: Exécuter l’intégration MariaDB
        env:
          P50_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=pass50_test;charset=utf8mb4
          P50_TEST_DB_USER: root
          P50_TEST_DB_PASSWORD: root
        run: php tests/metrics_schema_integration.php
      - name: Vérifier le diff
        run: git diff --check
