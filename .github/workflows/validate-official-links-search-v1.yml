name: Validate Official Links Search V1

on:
  pull_request:
    paths:
      - 'official-links-protection-v4.js'
      - 'tests/test_official_links_search_bar_v1.py'
      - '.github/workflows/validate-official-links-search-v1.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - run: node --check official-links-protection-v4.js
      - run: python3 -m unittest tests.test_official_links_search_bar_v1
