name: Déployer PASS50 sur IONOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: pass50-ionos-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Préparer les fichiers
        run: |
          set -euo pipefail
          mkdir -p .deploy
          rsync -a ./ .deploy/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.deploy/' \
            --exclude 'api/config.php' \
            --exclude 'uploads/' \
            --exclude 'install.php' \
            --exclude '*.zip' \
            --exclude '*.md'
          jq -nc --arg commit "$GITHUB_SHA" --arg deployedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{commit:$commit,deployedAt:$deployedAt,environment:"production",serviceWorker:"disabled-v81",frontend:"v82-share-v2-only"}' > .deploy/deployment-version.json

      - name: Installer SFTP
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Déployer l’interface V82 et les runtimes actualité en priorité
        env:
          HOST: ${{ secrets.IONOS_SFTP_HOST }}
          USER: ${{ secrets.IONOS_SFTP_USER }}
          PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.IONOS_REMOTE_DIR }}
        run: |
          set -euo pipefail
          if [ -z "${HOST:-}" ] || [ -z "${USER:-}" ] || [ -z "${PASSWORD:-}" ] || [ -z "${REMOTE_DIR:-}" ]; then
            echo '::error::Configuration SFTP IONOS incomplète.'
            exit 1
          fi

          SCRIPT_DIR="$(mktemp -d)"
          trap 'rm -rf "$SCRIPT_DIR"' EXIT

          # Script lftp sans coller le mot de passe dans une URL (caractères spéciaux).
          cat > "$SCRIPT_DIR/priority.lftp" <<EOF
          set cmd:fail-exit yes
          set net:max-retries 10
          set net:persist-retries 10
          set net:reconnect-interval-base 4
          set net:reconnect-interval-multiplier 1.4
          set net:timeout 60
          set net:connection-limit 1
          set dns:order inet
          set sftp:auto-confirm yes
          set ftp:passive-mode true
          open -u ${USER@Q},${PASSWORD@Q} sftp://${HOST}:22
          put -O ${REMOTE_DIR@Q} .deploy/.htaccess
          put -O ${REMOTE_DIR@Q} .deploy/sw.js
          put -O ${REMOTE_DIR@Q} .deploy/index.html
          put -O ${REMOTE_DIR@Q} .deploy/mon-fil.html
          put -O ${REMOTE_DIR@Q} .deploy/mon-fil.js
          put -O ${REMOTE_DIR@Q} .deploy/app-config.js
          put -O ${REMOTE_DIR@Q} .deploy/public-copy-fixes.js
          put -O ${REMOTE_DIR@Q} .deploy/public-ui-sanitizer-v1.js
          put -O ${REMOTE_DIR@Q} .deploy/context-share-v2.js
          put -O ${REMOTE_DIR@Q} .deploy/mobile-bottom-nav-v1.js
          put -O ${REMOTE_DIR@Q} .deploy/v9-tools.js
          put -O ${REMOTE_DIR@Q} .deploy/v9-tools.css
          put -O ${REMOTE_DIR@Q} .deploy/data-engine-ui.js
          put -O ${REMOTE_DIR@Q} .deploy/facebook-video-player-v1.js
          put -O ${REMOTE_DIR@Q} .deploy/content-intelligence.js
          put -O ${REMOTE_DIR@Q} .deploy/coules-share-simple-v1.js
          put -O ${REMOTE_DIR@Q} .deploy/share-center-v1.js
          put -O ${REMOTE_DIR@Q} .deploy/admin-pronostics.html
          put -O ${REMOTE_DIR@Q} .deploy/admin-membres.html
          put -O ${REMOTE_DIR@Q} .deploy/pronostics.html
          put -O ${REMOTE_DIR@Q} .deploy/pronostics.js
          put -O ${REMOTE_DIR@Q} .deploy/deployment-version.json
          put -O ${REMOTE_DIR@Q}/api .deploy/api/content-feed.php
          put -O ${REMOTE_DIR@Q}/api .deploy/api/content-freshness-platform-audit-cron-v2.php
          put -O ${REMOTE_DIR@Q}/api .deploy/api/content-freshness-cron-v4.php
          put -O ${REMOTE_DIR@Q}/api .deploy/api/content-freshness-core.php
          put -O ${REMOTE_DIR@Q}/api .deploy/api/content-freshness-admin-refresh.php
          put -O ${REMOTE_DIR@Q}/api .deploy/api/metrics-collector-facebook.php
          put -O ${REMOTE_DIR@Q}/api .deploy/api/prono-core.php
          put -O ${REMOTE_DIR@Q}/api .deploy/api/prono-admin-save.php
          put -O ${REMOTE_DIR@Q}/api .deploy/api/admin-users.php
          put -O ${REMOTE_DIR@Q}/api .deploy/api/prono-admin-profiles.php
          put -O ${REMOTE_DIR@Q}/api .deploy/api/prono-daily.php
          put -O ${REMOTE_DIR@Q}/api .deploy/api/prono-daily-core.php
          put -O ${REMOTE_DIR@Q}/api .deploy/api/prono-history.php
          bye
          EOF

          cat > "$SCRIPT_DIR/mirror.lftp" <<EOF
          set cmd:fail-exit yes
          set net:max-retries 10
          set net:persist-retries 10
          set net:reconnect-interval-base 4
          set net:reconnect-interval-multiplier 1.4
          set net:timeout 60
          set net:connection-limit 1
          set dns:order inet
          set sftp:auto-confirm yes
          open -u ${USER@Q},${PASSWORD@Q} sftp://${HOST}:22
          mirror --reverse --verbose --only-newer --parallel=1 .deploy/ ${REMOTE_DIR@Q}
          bye
          EOF

          with_retries() {
            local label="$1"
            local file="$2"
            local attempt=1
            local max=8
            local delay=10
            while true; do
              echo "==> $label (essai $attempt/$max)"
              if lftp -f "$file"; then
                echo "==> $label OK"
                return 0
              fi
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::$label a échoué après $max tentatives SFTP IONOS."
                return 1
              fi
              echo "Connexion SFTP coupée par IONOS, nouvel essai dans ${delay}s…"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay + 8))
            done
          }

          with_retries "Fichiers prioritaires" "$SCRIPT_DIR/priority.lftp"
          with_retries "Miroir complet" "$SCRIPT_DIR/mirror.lftp"

      - name: Vérifier la version réellement servie
        shell: bash
        run: |
          set -euo pipefail
          sites=('https://pass50.store' 'https://www.pass50.store')
          for site in "${sites[@]}"; do
            ready=false
            for attempt in $(seq 1 30); do
              marker="$(curl --location --silent --show-error --max-time 15 -H 'Cache-Control: no-cache, no-store' "$site/deployment-version.json?sha=$GITHUB_SHA&attempt=$attempt" || true)"
              worker="$(curl --location --silent --show-error --max-time 15 -H 'Cache-Control: no-cache, no-store' "$site/sw.js?sha=$GITHUB_SHA&attempt=$attempt" || true)"
              runtime="$(curl --location --silent --show-error --max-time 15 -H 'Cache-Control: no-cache, no-store' "$site/public-copy-fixes.js?sha=$GITHUB_SHA&attempt=$attempt" || true)"
              share="$(curl --location --silent --show-error --max-time 15 -H 'Cache-Control: no-cache, no-store' "$site/context-share-v2.js?sha=$GITHUB_SHA&attempt=$attempt" || true)"
              facebook_viewer="$(curl --location --silent --show-error --max-time 15 -H 'Cache-Control: no-cache, no-store' "$site/facebook-video-player-v1.js?sha=$GITHUB_SHA&attempt=$attempt" || true)"
              page="$(curl --location --silent --show-error --max-time 20 -H 'Cache-Control: no-cache, no-store' "$site/?health=$GITHUB_SHA&attempt=$attempt" || true)"
              ok=true
              jq -e --arg sha "$GITHUB_SHA" '.commit == $sha and .frontend == "v82-share-v2-only"' >/dev/null 2>&1 <<<"$marker" || ok=false
              grep -q "pass50-v81-service-worker-disabled" <<<"$worker" || ok=false
              grep -Eq "PASS50-PUBLIC-RUNTIME-V9[0-9]+" <<<"$runtime" || ok=false
              grep -q "context-share-v2.js?v=2.6" <<<"$runtime" || ok=false
              grep -q "facebook-video-player-v1.js?v=1.2" <<<"$runtime" || ok=false
              ! grep -q "loadScript('script\[data-pass50-context-share\]','./context-share-v1.js" <<<"$runtime" || ok=false
              grep -q "PASS50-CONTEXT-SHARE-V2.0" <<<"$share" || ok=false
              grep -q "PASS50-FACEBOOK-VIDEO-PLAYER-V1.2" <<<"$facebook_viewer" || ok=false
              grep -q "Voir dans Pass50" <<<"$facebook_viewer" || ok=false
              grep -q "plugins/\${plugin}.php" <<<"$facebook_viewer" || ok=false
              grep -q "PASS50" <<<"$page" || ok=false
              if [ "$ok" = true ]; then
                ready=true
                echo "$site sert bien l’interface V82, le runtime V91, le partage V2.6 et le lecteur Facebook V1.2."
                break
              fi
              echo "Propagation V82 en attente pour $site ($attempt/30)."
              sleep 5
            done
            if [ "$ready" != true ]; then
              echo "::error::$site : vérification V82/share/Facebook échouée après propagation."
              echo "marker=$marker"
              echo "sw_has_disabled=$(grep -c 'pass50-v81-service-worker-disabled' <<<"$worker" || true)"
              echo "runtime_v91=$(grep -c 'PASS50-PUBLIC-RUNTIME-V91' <<<"$runtime" || true)"
              echo "runtime_share_v26=$(grep -c 'context-share-v2.js?v=2.6' <<<"$runtime" || true)"
              echo "facebook_v12=$(grep -c 'PASS50-FACEBOOK-VIDEO-PLAYER-V1.2' <<<"$facebook_viewer" || true)"
              exit 1
            fi
          done
          {
            echo '### Déploiement PASS50 V82'
            echo "- Commit vérifié : \`$GITHUB_SHA\`"
            echo '- Interface : `V82 share-v2-only`'
            echo '- Runtime public : `PASS50-PUBLIC-RUNTIME-V91`'
            echo '- Partage contexte : `context-share-v2.js?v=2.6`'
            echo '- Lecteur Facebook : `V1.2`, toutes les publications consultables dans Pass50'
            echo '- Vidéos reconnues : bouton `Lire la vidéo`'
            echo '- Publications photo/post : bouton `Voir dans Pass50`'
            echo '- Runtimes actualité V4 + pronos daily : déploiement prioritaire forcé'
            echo '- Service worker : désactivé (`pass50-v81-service-worker-disabled`)'
            echo '- Cache HTTP HTML/JS/CSS : désactivé temporairement'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Vérifier la fiche Apoutchou National
        id: apoutchou
        shell: bash
        run: |
          set -euo pipefail
          feed='apoutchou-feed.json'; ready=false
          for attempt in $(seq 1 12); do
            curl --location --silent --show-error --max-time 30 -H 'Accept: application/json' -H 'Cache-Control: no-cache, no-store' \
              "https://www.pass50.store/api/content-feed.php?period=24h&profileId=apoutchou&newsLimit=30&sha=$GITHUB_SHA&attempt=$attempt" > "$feed" || true
            if jq -e '.ok==true and .ready==true and .rules.facebookEmbedRouting==true' "$feed" >/dev/null 2>&1; then ready=true; break; fi
            sleep 5
          done
          [ "$ready" = true ] || { echo '::error::Le flux Facebook d’Apoutchou n’est pas servi'; cat "$feed" 2>/dev/null || true; exit 1; }

          jq '[.news[] | select((.platform|ascii_downcase)=="facebook")]' "$feed" > apoutchou-facebook.json
          count="$(jq 'length' apoutchou-facebook.json)"
          video_count="$(jq '[.[] | select(.playableInPass50==true)] | length' apoutchou-facebook.json)"
          generic_count="$(jq '[.[] | select(.playableInPass50!=true)] | length' apoutchou-facebook.json)"
          item_type='none'
          source=''

          if [ "$count" -eq 0 ]; then
            echo '::warning::Aucune publication Facebook récente Apoutchou dans la fenêtre 24 h — validation contrat lecteur seule.'
            viewer="$(curl --location --silent --show-error --max-time 20 -H 'Cache-Control: no-cache, no-store' \
              "https://www.pass50.store/facebook-video-player-v1.js?sha=$GITHUB_SHA&soft=1" || true)"
            grep -q 'PASS50-FACEBOOK-VIDEO-PLAYER-V1.2' <<<"$viewer" \
              && grep -q 'Voir dans Pass50' <<<"$viewer" \
              && grep -q 'plugins/\${plugin}.php' <<<"$viewer" \
              || { echo '::error::Lecteur Facebook V1.2 absent alors que le flux Apoutchou est vide'; exit 1; }
            item_type='soft-pass-no-recent-facebook'
          else
            source="$(jq -r '.[0].url // ""' apoutchou-facebook.json)"
            item_type="$(jq -r '.[0].itemType // "unknown"' apoutchou-facebook.json)"
            [ -n "$source" ] || { echo '::error::URL Facebook d’Apoutchou absente'; exit 1; }
            encoded="$(jq -rn --arg u "$source" '$u|@uri')"
            post_body='apoutchou-facebook-post.html'
            post_code="$(curl --location --silent --show-error --max-time 40 --output "$post_body" --write-out '%{http_code}' -H 'Accept-Language: fr-FR,fr;q=0.9,en;q=0.8' \
              "https://www.facebook.com/plugins/post.php?href=${encoded}&show_text=true&width=820" || true)"
            post_unavailable=false
            if grep -Eqi "ce contenu n.est pas disponible|contenu indisponible|this content isn.t available|content not available|publication indisponible" "$post_body" 2>/dev/null; then post_unavailable=true; fi
            [ "$post_code" = 200 ] || { echo "::error::Plugin de publication Facebook HTTP $post_code"; exit 1; }
            [ "$post_unavailable" = false ] || { echo '::error::La publication Apoutchou reste indisponible dans post.php'; exit 1; }
          fi

          {
            printf 'count=%s\n' "$count"
            printf 'video_count=%s\n' "$video_count"
            printf 'generic_count=%s\n' "$generic_count"
            printf 'item_type=%s\n' "$item_type"
          } >> "$GITHUB_OUTPUT"
          {
            echo '### Test de la fiche Apoutchou National'
            printf -- '- Publications Facebook reçues : %s\n' "$count"
            printf -- '- Vidéos reconnues : %s\n' "$video_count"
            printf -- '- Publications génériques malgré un type photo/post : %s\n' "$generic_count"
            printf -- '- Premier type observé : `%s`\n' "$item_type"
            if [ "$count" -eq 0 ]; then
              echo '- Soft-pass : fenêtre 24 h vide, contrat lecteur Facebook V1.2 vérifié'
            else
              echo '- Le plugin `post.php` accepte la publication réelle d’Apoutchou'
              echo '- Le lecteur V1.2 ajoutera `Voir dans Pass50` même si Facebook la classe en photo'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier le statut du lecteur Apoutchou
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.apoutchou.outcome }}
          COUNT: ${{ steps.apoutchou.outputs.count }}
          VIDEO_COUNT: ${{ steps.apoutchou.outputs.video_count }}
          GENERIC_COUNT: ${{ steps.apoutchou.outputs.generic_count }}
          ITEM_TYPE: ${{ steps.apoutchou.outputs.item_type }}
        run: |
          set -euo pipefail
          state=success
          description="Apoutchou: ${COUNT:-0} publication(s), vidéo ${VIDEO_COUNT:-0}, générique ${GENERIC_COUNT:-0}, type ${ITEM_TYPE:-?}, V1.2"
          if [ "${OUTCOME:-failure}" != success ]; then state=failure; description='lecteur des publications Facebook Apoutchou non validé'; fi
          payload="$(jq -nc --arg state "$state" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --arg description "$description" --arg context 'pass50/apoutchou-facebook-viewer' '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl --fail-with-body --silent --show-error -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' --data "$payload" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
