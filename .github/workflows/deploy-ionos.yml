name: Déployer PASS50 sur IONOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pass50-ionos-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Préparer les fichiers
        run: |
          set -euo pipefail
          mkdir -p .deploy
          rsync -a ./ .deploy/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.deploy/' \
            --exclude 'api/config.php' \
            --exclude 'uploads/' \
            --exclude 'install.php' \
            --exclude '*.zip' \
            --exclude '*.md'
          jq -nc --arg commit "$GITHUB_SHA" --arg deployedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{commit:$commit,deployedAt:$deployedAt,environment:"production",serviceWorker:"disabled-v81"}' > .deploy/deployment-version.json

      - name: Installer SFTP
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Déployer le correctif d’accès en priorité
        env:
          HOST: ${{ secrets.IONOS_SFTP_HOST }}
          USER: ${{ secrets.IONOS_SFTP_USER }}
          PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.IONOS_REMOTE_DIR }}
        run: |
          set -euo pipefail
          if [ -z "${HOST:-}" ] || [ -z "${USER:-}" ] || [ -z "${PASSWORD:-}" ] || [ -z "${REMOTE_DIR:-}" ]; then
            echo '::error::Configuration SFTP IONOS incomplète.'
            exit 1
          fi
          lftp <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 20
          set sftp:auto-confirm yes
          open -u "$USER","$PASSWORD" sftp://$HOST:22
          put -O "$REMOTE_DIR" .deploy/sw.js
          put -O "$REMOTE_DIR" .deploy/public-copy-fixes.js
          put -O "$REMOTE_DIR" .deploy/deployment-version.json
          mirror --reverse --verbose --only-newer --parallel=2 .deploy/ "$REMOTE_DIR"
          bye
          LFTP

      - name: Vérifier la remise en ligne
        shell: bash
        run: |
          set -euo pipefail
          sites=('https://pass50.store' 'https://www.pass50.store')
          for site in "${sites[@]}"; do
            ready=false
            for attempt in $(seq 1 24); do
              marker="$(curl --location --silent --show-error --max-time 15 \
                -H 'Cache-Control: no-cache, no-store' \
                "$site/deployment-version.json?sha=$GITHUB_SHA&attempt=$attempt" || true)"
              worker="$(curl --location --silent --show-error --max-time 15 \
                -H 'Cache-Control: no-cache, no-store' \
                "$site/sw.js?sha=$GITHUB_SHA&attempt=$attempt" || true)"
              page="$(curl --location --silent --show-error --max-time 20 \
                -H 'Cache-Control: no-cache, no-store' \
                "$site/?health=$GITHUB_SHA&attempt=$attempt" || true)"
              if jq -e --arg sha "$GITHUB_SHA" '.commit == $sha' >/dev/null 2>&1 <<<"$marker" \
                && grep -q "pass50-v81-service-worker-disabled" <<<"$worker" \
                && grep -q "PASS50" <<<"$page"; then
                ready=true
                echo "$site sert bien le commit $GITHUB_SHA avec le service worker désactivé."
                break
              fi
              echo "Remise en ligne en attente pour $site ($attempt/24)."
              sleep 5
            done
            if [ "$ready" != true ]; then
              echo "::error::$site ne sert pas le correctif V81 après deux minutes."
              exit 1
            fi
          done
          {
            echo '### Remise en ligne PASS50'
            echo "- Commit vérifié : \`$GITHUB_SHA\`"
            echo '- Domaine principal : `https://pass50.store`'
            echo '- Domaine www : `https://www.pass50.store`'
            echo '- Service worker : désactivé temporairement (`V81`)'
          } >> "$GITHUB_STEP_SUMMARY"
