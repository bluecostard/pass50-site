name: Déployer PASS50 sur IONOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pass50-ionos-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Préparer les fichiers
        run: |
          set -euo pipefail
          mkdir -p .deploy
          rsync -a ./ .deploy/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.deploy/' \
            --exclude 'api/config.php' \
            --exclude 'uploads/' \
            --exclude 'install.php' \
            --exclude '*.zip' \
            --exclude '*.md'
          jq -nc --arg commit "$GITHUB_SHA" --arg deployedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{commit:$commit,deployedAt:$deployedAt,environment:"production"}' > .deploy/deployment-version.json

      - name: Installer SFTP
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Déployer sur IONOS
        env:
          HOST: ${{ secrets.IONOS_SFTP_HOST }}
          USER: ${{ secrets.IONOS_SFTP_USER }}
          PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.IONOS_REMOTE_DIR }}
        run: |
          set -euo pipefail
          if [ -z "${HOST:-}" ] || [ -z "${USER:-}" ] || [ -z "${PASSWORD:-}" ] || [ -z "${REMOTE_DIR:-}" ]; then
            echo '::error::Configuration SFTP IONOS incomplète.'
            exit 1
          fi
          lftp <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 20
          set sftp:auto-confirm yes
          open -u "$USER","$PASSWORD" sftp://$HOST:22
          mirror --reverse --verbose --transfer-all --parallel=4 .deploy/ "$REMOTE_DIR"
          bye
          LFTP

      - name: Vérifier la version réellement servie
        shell: bash
        run: |
          set -euo pipefail
          sites=('https://pass50.store' 'https://www.pass50.store')
          for site in "${sites[@]}"; do
            ready=false
            for attempt in $(seq 1 18); do
              marker="$(curl --location --silent --show-error --max-time 20 \
                -H 'Cache-Control: no-cache, no-store' \
                "$site/deployment-version.json?sha=$GITHUB_SHA&attempt=$attempt" || true)"
              if jq -e --arg sha "$GITHUB_SHA" '.commit == $sha' >/dev/null 2>&1 <<<"$marker"; then
                worker="$(curl --location --silent --show-error --max-time 20 \
                  -H 'Cache-Control: no-cache, no-store' \
                  "$site/sw.js?sha=$GITHUB_SHA&attempt=$attempt" || true)"
                if grep -q "pass50-v80-site-recovery" <<<"$worker"; then
                  ready=true
                  echo "$site sert bien le commit $GITHUB_SHA et le service worker V80."
                  break
                fi
              fi
              echo "Propagation IONOS en attente pour $site ($attempt/18)."
              sleep 10
            done
            if [ "$ready" != true ]; then
              echo "::error::$site ne sert pas la version déployée après trois minutes."
              exit 1
            fi
          done
          {
            echo '### Déploiement PASS50 sur IONOS'
            echo "- Commit vérifié : \`$GITHUB_SHA\`"
            echo '- Domaine principal : `https://pass50.store`'
            echo '- Domaine www : `https://www.pass50.store`'
            echo '- Service worker : `pass50-v80-site-recovery`'
          } >> "$GITHUB_STEP_SUMMARY"
