name: Déployer PASS50 sur IONOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: pass50-ionos-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer SFTP
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Déployer immédiatement le lecteur Facebook V1.2
        id: facebook_deploy
        env:
          HOST: ${{ secrets.IONOS_SFTP_HOST }}
          USER: ${{ secrets.IONOS_SFTP_USER }}
          PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.IONOS_REMOTE_DIR }}
        run: |
          set -euo pipefail
          if [ -z "${HOST:-}" ] || [ -z "${USER:-}" ] || [ -z "${PASSWORD:-}" ] || [ -z "${REMOTE_DIR:-}" ]; then
            echo '::error::Configuration SFTP IONOS incomplète.'
            exit 1
          fi
          grep -q 'PASS50-FACEBOOK-VIDEO-PLAYER-V1.2' facebook-video-player-v1.js
          grep -q 'Voir dans Pass50' facebook-video-player-v1.js
          grep -q 'facebook-video-player-v1.js?v=1.2' public-copy-fixes.js
          lftp <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 20
          set sftp:auto-confirm yes
          open -u "$USER","$PASSWORD" sftp://$HOST:22
          put -O "$REMOTE_DIR" facebook-video-player-v1.js
          put -O "$REMOTE_DIR" public-copy-fixes.js
          put -O "$REMOTE_DIR/api" api/content-feed.php
          bye
          LFTP

      - name: Vérifier immédiatement Facebook V1.2 et Apoutchou
        id: facebook_verify
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 30); do
            viewer="$(curl --location --silent --show-error --max-time 20 -H 'Cache-Control: no-cache, no-store' \
              "https://www.pass50.store/facebook-video-player-v1.js?early=$GITHUB_SHA-$attempt" || true)"
            loader="$(curl --location --silent --show-error --max-time 20 -H 'Cache-Control: no-cache, no-store' \
              "https://www.pass50.store/public-copy-fixes.js?early=$GITHUB_SHA-$attempt" || true)"
            if grep -q 'PASS50-FACEBOOK-VIDEO-PLAYER-V1.2' <<<"$viewer" \
              && grep -q 'Voir dans Pass50' <<<"$viewer" \
              && grep -q 'facebook-video-player-v1.js?v=1.2' <<<"$loader" \
              && ! grep -q 'item.playableInPass50!==true' <<<"$viewer"; then
              ready=true
              break
            fi
            echo "Propagation anticipée V1.2 en attente ($attempt/30)."
            sleep 5
          done
          [ "$ready" = true ] || { echo '::error::Le lecteur Facebook V1.2 n’est pas servi après le transfert anticipé'; exit 1; }

          curl --fail-with-body --location --silent --show-error --max-time 30 \
            -H 'Accept: application/json' -H 'Cache-Control: no-cache, no-store' \
            "https://www.pass50.store/api/content-feed.php?period=24h&profileId=apoutchou&newsLimit=30&early=$GITHUB_SHA" \
            > apoutchou-early-feed.json
          jq -e '.ok==true and .ready==true' apoutchou-early-feed.json >/dev/null
          jq '[.news[] | select((.platform|ascii_downcase)=="facebook")]' apoutchou-early-feed.json > apoutchou-early-facebook.json
          count="$(jq 'length' apoutchou-early-facebook.json)"
          [ "$count" -gt 0 ] || { echo '::error::Aucune publication Facebook sur la fiche Apoutchou'; exit 1; }

          source="$(jq -r '.[0].url // ""' apoutchou-early-facebook.json)"
          item_type="$(jq -r '.[0].itemType // "unknown"' apoutchou-early-facebook.json)"
          old_playable="$(jq -r '.[0].playableInPass50 // false' apoutchou-early-facebook.json)"
          [ -n "$source" ] || { echo '::error::URL Facebook d’Apoutchou absente'; exit 1; }
          encoded="$(python3 - "$source" <<'PY'
import sys, urllib.parse
print(urllib.parse.quote(sys.argv[1], safe=''))
PY
)"
          post_body='apoutchou-early-facebook-post.html'
          post_code="$(curl --location --silent --show-error --max-time 40 --output "$post_body" --write-out '%{http_code}' \
            -H 'Accept-Language: fr-FR,fr;q=0.9,en;q=0.8' \
            "https://www.facebook.com/plugins/post.php?href=${encoded}&show_text=true&width=820" || true)"
          unavailable=false
          if grep -Eqi "ce contenu n.est pas disponible|contenu indisponible|this content isn.t available|content not available|publication indisponible" "$post_body" 2>/dev/null; then unavailable=true; fi
          [ "$post_code" = 200 ] || { echo "::error::Plugin Facebook post.php HTTP $post_code"; exit 1; }
          [ "$unavailable" = false ] || { echo '::error::La publication réelle d’Apoutchou reste indisponible dans post.php'; exit 1; }

          {
            printf 'count=%s\n' "$count"
            printf 'item_type=%s\n' "$item_type"
            printf 'old_playable=%s\n' "$old_playable"
          } >> "$GITHUB_OUTPUT"
          printf 'APOUTCHOU_V12_EARLY_DEPLOY count=%s itemType=%s oldPlayable=%s postUnavailable=%s\n' \
            "$count" "$item_type" "$old_playable" "$unavailable"

      - name: Publier le statut du transfert Facebook prioritaire
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_OUTCOME: ${{ steps.facebook_verify.outcome }}
          COUNT: ${{ steps.facebook_verify.outputs.count }}
          ITEM_TYPE: ${{ steps.facebook_verify.outputs.item_type }}
          OLD_PLAYABLE: ${{ steps.facebook_verify.outputs.old_playable }}
        run: |
          set -euo pipefail
          state=success
          description="Facebook V1.2 servi en priorité · Apoutchou ${COUNT:-0} publication(s) · type ${ITEM_TYPE:-?} · ancien playable ${OLD_PLAYABLE:-?}"
          if [ "${VERIFY_OUTCOME:-failure}" != success ]; then state=failure; description='Transfert prioritaire Facebook V1.2 interrompu'; fi
          payload="$(jq -nc --arg state "$state" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --arg description "$description" --arg context 'pass50/apoutchou-facebook-viewer' '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl --fail-with-body --silent --show-error -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' --data "$payload" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"

      - name: Préparer les fichiers
        run: |
          set -euo pipefail
          mkdir -p .deploy
          rsync -a ./ .deploy/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.deploy/' \
            --exclude 'api/config.php' \
            --exclude 'uploads/' \
            --exclude 'install.php' \
            --exclude '*.zip' \
            --exclude '*.md'
          jq -nc --arg commit "$GITHUB_SHA" --arg deployedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{commit:$commit,deployedAt:$deployedAt,environment:"production",serviceWorker:"disabled-v81",frontend:"v82-share-v2-only"}' > .deploy/deployment-version.json

      - name: Déployer l’interface V82 et les runtimes actualité
        env:
          HOST: ${{ secrets.IONOS_SFTP_HOST }}
          USER: ${{ secrets.IONOS_SFTP_USER }}
          PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.IONOS_REMOTE_DIR }}
        run: |
          set -euo pipefail
          lftp <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 20
          set sftp:auto-confirm yes
          open -u "$USER","$PASSWORD" sftp://$HOST:22
          put -O "$REMOTE_DIR" .deploy/.htaccess
          put -O "$REMOTE_DIR" .deploy/sw.js
          put -O "$REMOTE_DIR" .deploy/index.html
          put -O "$REMOTE_DIR" .deploy/mon-fil.html
          put -O "$REMOTE_DIR" .deploy/mon-fil.js
          put -O "$REMOTE_DIR" .deploy/app-config.js
          put -O "$REMOTE_DIR" .deploy/public-copy-fixes.js
          put -O "$REMOTE_DIR" .deploy/context-share-v2.js
          put -O "$REMOTE_DIR" .deploy/mobile-bottom-nav-v1.js
          put -O "$REMOTE_DIR" .deploy/v9-tools.js
          put -O "$REMOTE_DIR" .deploy/v9-tools.css
          put -O "$REMOTE_DIR" .deploy/facebook-video-player-v1.js
          put -O "$REMOTE_DIR" .deploy/deployment-version.json
          put -O "$REMOTE_DIR/api" .deploy/api/content-feed.php
          put -O "$REMOTE_DIR/api" .deploy/api/content-freshness-platform-audit-cron-v2.php
          put -O "$REMOTE_DIR/api" .deploy/api/content-freshness-cron-v4.php
          put -O "$REMOTE_DIR/api" .deploy/api/metrics-collector-facebook.php
          mirror --reverse --verbose --only-newer --parallel=2 .deploy/ "$REMOTE_DIR"
          bye
          LFTP

      - name: Vérifier la version générale réellement servie
        shell: bash
        run: |
          set -euo pipefail
          sites=('https://pass50.store' 'https://www.pass50.store')
          for site in "${sites[@]}"; do
            ready=false
            for attempt in $(seq 1 30); do
              marker="$(curl --location --silent --show-error --max-time 15 -H 'Cache-Control: no-cache, no-store' "$site/deployment-version.json?sha=$GITHUB_SHA&attempt=$attempt" || true)"
              worker="$(curl --location --silent --show-error --max-time 15 -H 'Cache-Control: no-cache, no-store' "$site/sw.js?sha=$GITHUB_SHA&attempt=$attempt" || true)"
              runtime="$(curl --location --silent --show-error --max-time 15 -H 'Cache-Control: no-cache, no-store' "$site/public-copy-fixes.js?sha=$GITHUB_SHA&attempt=$attempt" || true)"
              share="$(curl --location --silent --show-error --max-time 15 -H 'Cache-Control: no-cache, no-store' "$site/context-share-v2.js?sha=$GITHUB_SHA&attempt=$attempt" || true)"
              facebook_viewer="$(curl --location --silent --show-error --max-time 15 -H 'Cache-Control: no-cache, no-store' "$site/facebook-video-player-v1.js?sha=$GITHUB_SHA&attempt=$attempt" || true)"
              page="$(curl --location --silent --show-error --max-time 20 -H 'Cache-Control: no-cache, no-store' "$site/?health=$GITHUB_SHA&attempt=$attempt" || true)"
              if jq -e --arg sha "$GITHUB_SHA" '.commit == $sha and .frontend == "v82-share-v2-only"' >/dev/null 2>&1 <<<"$marker" \
                && grep -q "pass50-v81-service-worker-disabled" <<<"$worker" \
                && grep -q "PASS50-PUBLIC-RUNTIME-V82" <<<"$runtime" \
                && grep -q "context-share-v2.js?v=2.3" <<<"$runtime" \
                && grep -q "facebook-video-player-v1.js?v=1.2" <<<"$runtime" \
                && ! grep -q "loadScript('script\[data-pass50-context-share\]','./context-share-v1.js" <<<"$runtime" \
                && grep -q "PASS50-CONTEXT-SHARE-V2.0" <<<"$share" \
                && grep -q "PASS50-FACEBOOK-VIDEO-PLAYER-V1.2" <<<"$facebook_viewer" \
                && grep -q "Voir dans Pass50" <<<"$facebook_viewer" \
                && grep -q "plugins/\${plugin}.php" <<<"$facebook_viewer" \
                && grep -q "PASS50" <<<"$page"; then
                ready=true
                echo "$site sert bien l’interface V82, le partage V2 et le lecteur Facebook V1.2."
                break
              fi
              echo "Propagation V82 en attente pour $site ($attempt/30)."
              sleep 5
            done
            if [ "$ready" != true ]; then
              echo "::error::$site ne sert pas le lecteur Facebook V1.2 après deux minutes trente."
              exit 1
            fi
          done
          {
            echo '### Déploiement PASS50 V82'
            echo "- Commit vérifié : \`$GITHUB_SHA\`"
            echo '- Lecteur Facebook V1.2 transféré et validé avant le déploiement général'
            echo '- Interface : `V82 share-v2-only`'
            echo '- Runtimes actualité V4 : déploiement prioritaire forcé'
            echo '- Service worker : désactivé temporairement (`V81`)'
          } >> "$GITHUB_STEP_SUMMARY"
