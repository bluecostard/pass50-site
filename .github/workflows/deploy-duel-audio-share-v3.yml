name: Déployer partage audio Les Coulés V3

on:
  push:
    branches: [main]
    paths:
      - 'public-copy-fixes.js'
      - 'duel-audio-share-intercept-v1.js'
      - 'a.php'
      - 'duel-audio-og-v1.php'
      - '.github/workflows/deploy-duel-audio-share-v3.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: pass50-duel-audio-share-v3
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la syntaxe locale
        run: |
          set -euo pipefail
          node --check public-copy-fixes.js
          node --check duel-audio-share-intercept-v1.js
          php -l a.php
          php -l duel-audio-og-v1.php
          grep -Eq 'PASS50-PUBLIC-RUNTIME-V9[0-9]+' public-copy-fixes.js
          grep -q 'duel-audio-share-intercept-v1.js?v=1.0' public-copy-fixes.js
          grep -q 'PASS50-DUEL-AUDIO-SHARE-INTERCEPT-V1.0' duel-audio-share-intercept-v1.js

      - name: Installer SFTP
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Déployer les fichiers du partage audio
        env:
          HOST: ${{ secrets.IONOS_SFTP_HOST }}
          USER: ${{ secrets.IONOS_SFTP_USER }}
          PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.IONOS_REMOTE_DIR }}
        run: |
          set -euo pipefail
          test -n "${HOST:-}" && test -n "${USER:-}" && test -n "${PASSWORD:-}" && test -n "${REMOTE_DIR:-}"
          lftp <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 20
          set sftp:auto-confirm yes
          open -u "$USER","$PASSWORD" sftp://$HOST:22
          put -O "$REMOTE_DIR" public-copy-fixes.js
          put -O "$REMOTE_DIR" duel-audio-share-intercept-v1.js
          put -O "$REMOTE_DIR" a.php
          put -O "$REMOTE_DIR" duel-audio-og-v1.php
          bye
          LFTP

      - name: Vérifier la production
        run: |
          set -euo pipefail
          for site in https://pass50.store https://www.pass50.store; do
            ok=false
            for attempt in $(seq 1 24); do
              runtime="$(curl -LfsS --max-time 15 -H 'Cache-Control: no-cache, no-store' "$site/public-copy-fixes.js?v=$GITHUB_SHA-$attempt" || true)"
              intercept="$(curl -LfsS --max-time 15 -H 'Cache-Control: no-cache, no-store' "$site/duel-audio-share-intercept-v1.js?v=$GITHUB_SHA-$attempt" || true)"
              short_code="$(curl -L -sS --max-time 15 -o /dev/null -w '%{http_code}' -H 'Cache-Control: no-cache, no-store' "$site/a.php?k=000000000000&v=$GITHUB_SHA-$attempt" || true)"
              if grep -Eq 'PASS50-PUBLIC-RUNTIME-V9[0-9]+' <<<"$runtime" \
                && grep -q 'duel-audio-share-intercept-v1.js?v=1.0' <<<"$runtime" \
                && grep -q 'PASS50-DUEL-AUDIO-SHARE-INTERCEPT-V1.0' <<<"$intercept" \
                && grep -q 'one-short-link-no-files' <<<"$intercept" \
                && [ "$short_code" = 404 ]; then
                ok=true
                echo "$site charge réellement l’intercepteur audio V1 avant le partage V2."
                break
              fi
              sleep 5
            done
            [ "$ok" = true ] || { echo "::error::$site ne charge pas encore l’intercepteur audio V1"; exit 1; }
          done

      - name: Publier le statut
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
        run: |
          set -euo pipefail
          state=success
          description='intercepteur partage audio chargé et vérifié en production'
          if [ "$OUTCOME" != success ]; then state=failure; description='intercepteur partage audio non validé'; fi
          payload="$(jq -nc --arg state "$state" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --arg description "$description" --arg context 'pass50/duel-audio-share-v3' '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl --fail-with-body --silent --show-error -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' --data "$payload" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
