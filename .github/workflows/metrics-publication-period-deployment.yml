name: Metrics Publication Period Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'api/metrics-ranking-publication-period-core.php'
      - 'api/metrics-ranking-publication-simulate-cron.php'
      - '.github/workflows/metrics-publication-period-deployment.yml'

permissions:
  actions: write
  contents: read
  statuses: write

concurrency:
  group: pass50-metrics-publication-period-deployment
  cancel-in-progress: false

jobs:
  wait-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CRON_URL: ${{ secrets.PASS50_METRICS_CRON_URL }}
      CRON_SECRET: ${{ secrets.PASS50_METRICS_CRON_SECRET }}
      STATUS_SHA: ${{ github.sha }}
    steps:
      - name: Wait for period-selection contract
        id: deployment
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Les secrets du cron métrique sont incomplets."
            exit 1
          fi
          case "$CRON_URL" in
            */metrics-cron.php) SIMULATION_URL="${CRON_URL%/metrics-cron.php}/metrics-ranking-publication-simulate-cron.php" ;;
            *) echo "::error::PASS50_METRICS_CRON_URL invalide."; exit 1 ;;
          esac
          dispatch_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-period-probe"
          body="$(jq -nc --arg dispatchId "$dispatch_id" '{action:"probe",dispatchId:$dispatchId}')"
          deployed=false
          for attempt in $(seq 1 30); do
            timestamp="$(date +%s)"
            signature="$(printf '%s\n%s' "$timestamp" "$body" | openssl dgst -sha256 -hmac "$CRON_SECRET" -r | awk '{print $1}')"
            set +e
            http_code="$(curl --silent --show-error --max-time 55 --output period-contract.json --write-out '%{http_code}' \
              -H "Content-Type: application/json" -H "X-P50-Timestamp: $timestamp" -H "X-P50-Signature: $signature" \
              --data "$body" "$SIMULATION_URL")"
            curl_status=$?
            set -e
            if [ "$curl_status" -eq 0 ] && [ "$http_code" = "200" ] && \
              jq -e '.ok == true and .action == "probe" and .contract == "PUBSIM-PERIOD-V1.0" and .readOnly == true and .publicStateWrites == 0' period-contract.json >/dev/null 2>&1; then
              deployed=true
              break
            fi
            echo "Contrat PUBSIM-PERIOD-V1.0 en attente, tentative $attempt/30 (HTTP ${http_code:-000})."
            sleep 20
          done
          if [ "$deployed" != "true" ]; then
            echo "::error::Le contrat PUBSIM-PERIOD-V1.0 n'est pas disponible après le délai de déploiement."
            cat period-contract.json 2>/dev/null || true
            exit 1
          fi
          echo 'contract=PUBSIM-PERIOD-V1.0' >> "$GITHUB_OUTPUT"

      - name: Dispatch corrected publication simulation
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg ref "main" '{ref:$ref}')"
          curl --fail-with-body --silent --show-error \
            -X POST -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/metrics-ranking-publication-simulation.yml/dispatches"

      - name: Publish deployment status
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
          DISPATCH_OUTCOME: ${{ steps.dispatch.outcome }}
        run: |
          set -euo pipefail
          state="success"
          description="PUBSIM-PERIOD-V1.0 déployé · simulation corrigée dispatchée"
          if [ "$DEPLOYMENT_OUTCOME" != "success" ] || [ "$DISPATCH_OUTCOME" != "success" ]; then
            state="failure"
            description="Déploiement ou relance de la simulation corrigée en échec"
          fi
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(jq -nc --arg state "$state" --arg target_url "$target_url" --arg description "$description" --arg context "pass50/publication-period-deployment" '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl --fail-with-body --silent --show-error \
            -X POST -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}"

      - name: Write deployment summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            printf '### Déploiement du correctif de période\n'
            printf -- '- Contrat attendu : `PUBSIM-PERIOD-V1.0`\n'
            printf -- '- Simulation relancée après vérification : `%s`\n' "${{ steps.dispatch.outcome }}"
            printf -- '- Publication publique : `aucune`\n'
            printf -- '- Écriture app_state : `0`\n'
          } >> "$GITHUB_STEP_SUMMARY"
