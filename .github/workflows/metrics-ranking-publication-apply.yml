name: Metrics Ranking Publication Apply
# Relance opérateur du classement corrigé — 2026-08-10T16:54+02:00.

# Ce workflow ne possède volontairement aucun cron autonome.
# Il est déclenché :
# - manuellement pour un passage public contrôlé ;
# - par la simulation uniquement lorsque automaticPublicationEligible=true ;
# - sur modification explicite de ce workflow pour permettre un déclenchement opérateur traçable.
# - relance opérateur après assouplissement des barrières de mouvement PUBSIM-V1.1.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/metrics-ranking-publication-apply.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: pass50-metrics-ranking-publication-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CRON_URL: ${{ secrets.PASS50_METRICS_CRON_URL }}
      CRON_SECRET: ${{ secrets.PASS50_METRICS_CRON_SECRET }}
    steps:
      - name: Apply MR-V1.0 ranking to public state
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CRON_URL:-}" ] && [ -z "${CRON_SECRET:-}" ]; then
            echo "::warning::PASS50 metrics cron secrets are not configured."
            exit 0
          fi
          if [ -z "${CRON_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Les deux secrets PASS50 metrics cron doivent être configurés."
            exit 1
          fi

          case "$CRON_URL" in
            */metrics-cron.php)
              APPLY_URL="${CRON_URL%/metrics-cron.php}/metrics-ranking-publication-apply-cron.php"
              ;;
            *)
              echo "::error::PASS50_METRICS_CRON_URL doit se terminer par /metrics-cron.php"
              exit 1
              ;;
          esac

          # Éviter le 301 HTTP→HTTPS : la signature doit être envoyée directement à l’URL canonique.
          case "$APPLY_URL" in
            http://*) APPLY_URL="https://${APPLY_URL#http://}" ;;
          esac
          case "$APPLY_URL" in
            https://www.pass50.store/*) APPLY_URL="https://pass50.store/${APPLY_URL#https://www.pass50.store/}" ;;
          esac

          dispatch_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-publication-apply"
          body="$(jq -nc --arg dispatchId "$dispatch_id" '{action:"apply",dispatchId:$dispatchId,confirm:true}')"
          response_file="publication-apply.json"
          http_code="000"

          timestamp="$(date +%s)"
          signature="$(
            printf '%s\n%s' "$timestamp" "$body" |
              openssl dgst -sha256 -hmac "$CRON_SECRET" -r |
              awk '{print $1}'
          )"

          set +e
          http_code="$(
            curl --silent --show-error --max-time 180 \
              --output "$response_file" \
              --write-out '%{http_code}' \
              -H "Content-Type: application/json" \
              -H "X-P50-Timestamp: $timestamp" \
              -H "X-P50-Signature: $signature" \
              --data "$body" \
              "$APPLY_URL"
          )"
          curl_status=$?
          set -e

          if [ "$curl_status" -ne 0 ]; then
            echo "::error::Transport interrompu pendant la publication (curl $curl_status, HTTP ${http_code:-000})."
            cat "$response_file" 2>/dev/null || true
            exit 1
          fi

          if [ "$http_code" != "200" ]; then
            echo "::error::Publication refusée (HTTP $http_code)."
            cat "$response_file" || true
            exit 1
          fi

          jq -e '.ok == true' "$response_file" >/dev/null || {
            echo "::error::La réponse de publication n’est pas un résultat PASS50 valide."
            cat "$response_file" || true
            exit 1
          }

          skipped="$(jq -r '.skipped // false' "$response_file")"
          status="$(jq -r '.status // "unknown"' "$response_file")"
          writes="$(jq -r '.publicStateWrites // 0' "$response_file")"
          revision="$(jq -r '.publicStateRevision // 0' "$response_file")"
          run_uuid="$(jq -r '.runUuid // "—"' "$response_file")"
          scores="$(jq -r '.scoresWritten // 0' "$response_file")"
          reason="$(jq -r '.reason // .error // "—"' "$response_file")"

          if [ "$skipped" = "true" ]; then
            echo "::notice::Publication non exécutée : $reason. Aucune écriture publique."
          fi

          {
            printf '### Publication classement public MR-V1.0\n'
            printf -- '- déclenchement : `%s`\n' "${GITHUB_EVENT_NAME}"
            printf -- '- dispatchId : `%s`\n' "$dispatch_id"
            printf -- '- skipped : `%s`\n' "$skipped"
            printf -- '- status : `%s`\n' "$status"
            printf -- '- reason : %s\n' "$reason"
            printf -- '- runUuid : `%s`\n' "$run_uuid"
            printf -- '- scores écrits : %s\n' "$scores"
            printf -- '- écritures app_state : `%s`\n' "$writes"
            printf -- '- révision publique : `%s`\n' "$revision"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            printf 'skipped=%s\n' "$skipped"
            printf 'status=%s\n' "$status"
            printf 'writes=%s\n' "$writes"
          } >> "$GITHUB_OUTPUT"

      - name: Archive apply result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: publication-apply-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-apply.json
          if-no-files-found: ignore
          retention-days: 30
