name: Metrics Chain Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/metrics-chain-recovery.yml'

permissions:
  actions: write
  contents: read
  statuses: write

concurrency:
  group: pass50-metrics-chain-recovery
  cancel-in-progress: false

jobs:
  dispatch-p1:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STATUS_SHA: ${{ github.sha }}
    steps:
      - name: Dispatch Metrics Top 50 P1
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg ref "main" '{ref:$ref}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/metrics-top50-2h.yml/dispatches"
          echo "P1 dispatché sur main."

      - name: Publish recovery status
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STEP_OUTCOME: ${{ steps.dispatch.outcome }}
        run: |
          set -euo pipefail
          state="success"
          description="Récupération lancée · P1 dispatché sur main"
          if [ "$STEP_OUTCOME" != "success" ]; then
            state="failure"
            description="Échec du déclenchement de récupération P1"
          fi
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(jq -nc --arg state "$state" --arg target_url "$target_url" --arg description "$description" --arg context "pass50/metrics-chain-recovery" '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}"

      - name: Write recovery summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            printf '### Récupération de la chaîne métrique\n'
            printf -- '- Branche ciblée : `main`\n'
            printf -- '- Workflow demandé : `Metrics Top 50 P1`\n'
            printf -- '- Publication publique : `aucune`\n'
            printf -- '- Écriture app_state : `0`\n'
          } >> "$GITHUB_STEP_SUMMARY"
