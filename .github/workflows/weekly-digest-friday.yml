name: Weekly Digest Friday 21h

# Notification obligatoire chaque vendredi 21h (heure d’Abidjan = UTC).
# Contenu : live le plus suivi · N°1 le plus souvent · influenceur le plus pronostiqué.

on:
  schedule:
    - cron: '0 21 * * 5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Renvoyer même si déjà diffusé cette semaine'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      preview:
        description: 'Aperçu sans envoyer'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read
  statuses: write

concurrency:
  group: pass50-weekly-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CRON_URL: ${{ secrets.PASS50_METRICS_CRON_URL }}
      CRON_SECRET: ${{ secrets.PASS50_METRICS_CRON_SECRET }}
      GH_TOKEN: ${{ github.token }}
      FORCE_INPUT: ${{ github.event.inputs.force || 'false' }}
      PREVIEW_INPUT: ${{ github.event.inputs.preview || 'false' }}
    steps:
      - name: Diffuser le bilan hebdomadaire
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CRON_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo '::error::Secrets cron métriques manquants.'
            exit 1
          fi
          CRON_URL="${CRON_URL//www.pass50.store/pass50.store}"
          CRON_URL="${CRON_URL/#http:/https:}"
          case "$CRON_URL" in
            */metrics-cron.php) ENDPOINT="${CRON_URL%/metrics-cron.php}/weekly-digest-cron-v1.php" ;;
            *) echo '::error::PASS50_METRICS_CRON_URL invalide'; exit 1 ;;
          esac

          action="digest"
          if [ "${PREVIEW_INPUT}" = "true" ]; then action="preview"; fi
          force=false
          if [ "${FORCE_INPUT}" = "true" ]; then force=true; fi

          mkdir -p /tmp/p50-weekly-digest
          dispatch_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-weekly"
          body="$(jq -nc --arg action "$action" --arg dispatchId "$dispatch_id" --argjson force "$force" \
            '{action:$action,dispatchId:$dispatchId,force:$force}')"
          timestamp="$(date +%s)"
          signature="$(printf '%s\n%s' "$timestamp" "$body" | openssl dgst -sha256 -hmac "$CRON_SECRET" -r | awk '{print $1}')"
          code="$(curl --silent --show-error --max-time 180 --output /tmp/p50-weekly-digest/result.json --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -H "X-P50-Timestamp: $timestamp" -H "X-P50-Signature: $signature" \
            --data "$body" "$ENDPOINT" || true)"

          echo "HTTP ${code}"
          cat /tmp/p50-weekly-digest/result.json || true
          echo

          if [ "$code" != 200 ] || ! jq -e '.ok == true and .version == "WEEKLY-DIGEST-V1.0"' /tmp/p50-weekly-digest/result.json >/dev/null; then
            echo '::error::Bilan hebdomadaire interrompu.'
            exit 1
          fi

          week_key="$(jq -r '.weekKey // "—"' /tmp/p50-weekly-digest/result.json)"
          sent="$(jq -r '.sent // 0' /tmp/p50-weekly-digest/result.json)"
          skipped="$(jq -r '.skipped // false' /tmp/p50-weekly-digest/result.json)"
          title="$(jq -r '.message.title // "—"' /tmp/p50-weekly-digest/result.json)"
          {
            printf '### Bilan hebdomadaire PASS50\n'
            printf -- '- Semaine : `%s`\n' "$week_key"
            printf -- '- Action : `%s`\n' "$action"
            printf -- '- Titre : %s\n' "$title"
            printf -- '- Envoyés : %s\n' "$sent"
            printf -- '- Ignoré (déjà envoyé) : %s\n' "$skipped"
            printf -- '- Corps :\n```\n%s\n```\n' "$(jq -r '.message.body // ""' /tmp/p50-weekly-digest/result.json)"
          } >> "$GITHUB_STEP_SUMMARY"

          printf 'week_key=%s\nsent=%s\nskipped=%s\n' "$week_key" "$sent" "$skipped" >> "$GITHUB_OUTPUT"

      - name: Publish status
        if: ${{ always() }}
        shell: bash
        env:
          STEP_OUTCOME: ${{ steps.digest.outcome }}
          WEEK_KEY: ${{ steps.digest.outputs.week_key }}
          SENT: ${{ steps.digest.outputs.sent }}
          SKIPPED: ${{ steps.digest.outputs.skipped }}
        run: |
          set -euo pipefail
          state="success"
          description="Bilan ${WEEK_KEY:-?} · ${SENT:-0} notifs"
          if [ "${SKIPPED:-false}" = "true" ]; then description="Bilan ${WEEK_KEY:-?} déjà diffusé"; fi
          if [ "$STEP_OUTCOME" != "success" ]; then state="failure"; description="Bilan hebdomadaire interrompu"; fi
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(jq -nc --arg state "$state" --arg target_url "$target_url" --arg description "$description" --arg context "pass50/weekly-digest" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl --fail-with-body --silent --show-error -X POST -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${{ github.sha }}"
