name: Validate Context Share V2

on:
  pull_request:
    paths:
      - 'context-share-v2.js'
      - 'mobile-bottom-nav-v1.js'
      - 'partage-photo.php'
      - 'partage-contexte-v2.php'
      - 'partage-contexte-image-v2.php'
      - 'api/share-photo-core.php'
      - 'sw.js'
      - 'tests/test_context_share_v2.py'
      - '.github/workflows/validate-context-share-v2.yml'
  push:
    branches: [main]
    paths:
      - 'context-share-v2.js'
      - 'mobile-bottom-nav-v1.js'
      - 'partage-photo.php'
      - 'partage-contexte-v2.php'
      - 'partage-contexte-image-v2.php'
      - 'api/share-photo-core.php'
      - 'sw.js'
      - 'tests/test_context_share_v2.py'
      - '.github/workflows/validate-context-share-v2.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: JavaScript syntax
        run: |
          node --check context-share-v2.js
          node --check mobile-bottom-nav-v1.js
          node --check sw.js
      - name: PHP syntax
        run: |
          php -l api/share-photo-core.php
          php -l partage-photo.php
          php -l partage-contexte-v2.php
          php -l partage-contexte-image-v2.php
      - name: Contract tests
        run: python3 -m unittest tests.test_context_share_v2 -v
      - name: Diff check
        run: git diff --check origin/${{ github.base_ref || 'main' }}...HEAD
