name: Metrics Ranking Publication Apply History Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'api/metrics-ranking-publication-apply-history-cron-v1.php'
      - '.github/workflows/metrics-ranking-publication-apply-history-audit.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: pass50-metrics-ranking-publication-apply-history-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CRON_URL: ${{ secrets.PASS50_METRICS_CRON_URL }}
      CRON_SECRET: ${{ secrets.PASS50_METRICS_CRON_SECRET }}
    steps:
      - name: Wait for read-only apply-history endpoint
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CRON_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Secrets métriques incomplets."
            exit 1
          fi
          case "$CRON_URL" in
            */metrics-cron.php)
              HISTORY_URL="${CRON_URL%/metrics-cron.php}/metrics-ranking-publication-apply-history-cron-v1.php"
              ;;
            *)
              echo "::error::PASS50_METRICS_CRON_URL doit se terminer par /metrics-cron.php"
              exit 1
              ;;
          esac
          ready=false
          for attempt in $(seq 1 30); do
            code="$(curl --location --silent --show-error --max-time 15 \
              --output /dev/null --write-out '%{http_code}' \
              -H 'Cache-Control: no-cache, no-store' \
              "$HISTORY_URL?contract=PUBAPPLY-HISTORY-V1.0&attempt=$attempt" || true)"
            if [ "$code" = "405" ]; then
              ready=true
              echo "L’endpoint d’audit read-only est servi."
              break
            fi
            echo "Endpoint d’audit en attente ($attempt/30, HTTP ${code:-000})."
            sleep 10
          done
          if [ "$ready" != "true" ]; then
            echo "::error::L’endpoint d’audit n’est pas servi après cinq minutes."
            exit 1
          fi

      - name: Probe apply-history contract
        shell: bash
        run: |
          set -euo pipefail
          case "$CRON_URL" in
            */metrics-cron.php)
              HISTORY_URL="${CRON_URL%/metrics-cron.php}/metrics-ranking-publication-apply-history-cron-v1.php"
              ;;
            *) exit 1 ;;
          esac
          dispatch_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-apply-history-probe"
          body="$(jq -nc --arg dispatchId "$dispatch_id" '{action:"probe",dispatchId:$dispatchId}')"
          timestamp="$(date +%s)"
          signature="$(printf '%s\n%s' "$timestamp" "$body" | openssl dgst -sha256 -hmac "$CRON_SECRET" -r | awk '{print $1}')"
          curl --fail-with-body --silent --show-error --max-time 55 \
            -H 'Content-Type: application/json' \
            -H "X-P50-Timestamp: $timestamp" \
            -H "X-P50-Signature: $signature" \
            --data "$body" "$HISTORY_URL" > publication-apply-history-probe.json
          jq -e '
            .ok == true and
            .action == "probe" and
            .contract == "PUBAPPLY-HISTORY-V1.0" and
            .readOnly == true and
            .publicStateWrites == 0
          ' publication-apply-history-probe.json >/dev/null

      - name: Audit sanitized apply history
        id: history
        shell: bash
        run: |
          set -euo pipefail
          case "$CRON_URL" in
            */metrics-cron.php)
              HISTORY_URL="${CRON_URL%/metrics-cron.php}/metrics-ranking-publication-apply-history-cron-v1.php"
              ;;
            *) exit 1 ;;
          esac
          dispatch_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-apply-history"
          body="$(jq -nc --arg dispatchId "$dispatch_id" '{action:"history",dispatchId:$dispatchId}')"
          response_file='publication-apply-history.json'
          http_code='000'
          for attempt in $(seq 1 5); do
            timestamp="$(date +%s)"
            signature="$(printf '%s\n%s' "$timestamp" "$body" | openssl dgst -sha256 -hmac "$CRON_SECRET" -r | awk '{print $1}')"
            set +e
            http_code="$(curl --silent --show-error --max-time 90 \
              --output "$response_file" --write-out '%{http_code}' \
              -H 'Content-Type: application/json' \
              -H "X-P50-Timestamp: $timestamp" \
              -H "X-P50-Signature: $signature" \
              --data "$body" "$HISTORY_URL")"
            curl_status=$?
            set -e
            if [ "$curl_status" -eq 0 ] && [ "$http_code" = '200' ]; then break; fi
            if [ "$attempt" -lt 5 ] && { [ "$http_code" = '000' ] || [ "$http_code" = '502' ] || [ "$http_code" = '503' ] || [ "$http_code" = '504' ]; }; then
              echo "IONOS temporairement indisponible (HTTP ${http_code:-000}), tentative $attempt/5."
              sleep 15
              continue
            fi
            echo "::error::Audit d’historique refusé (curl $curl_status, HTTP ${http_code:-000})."
            cat "$response_file" 2>/dev/null || true
            exit 1
          done
          if [ "$http_code" != '200' ]; then
            echo "::error::Audit d’historique indisponible après les tentatives."
            exit 1
          fi
          jq -e '
            .ok == true and
            .action == "history" and
            .contract == "PUBAPPLY-HISTORY-V1.0" and
            .readOnly == true and
            .publicStateWrites == 0 and
            (.rows | type == "array") and
            (.rowCount == (.rows | length))
          ' "$response_file" >/dev/null

          table_exists="$(jq -r '.tableExists // false' "$response_file")"
          row_count="$(jq -r '.rowCount // 0' "$response_file")"
          has_prior="$(jq -r '.hasPriorSuccess // false' "$response_file")"
          status_counts="$(jq -c '.statusCounts // {}' "$response_file")"
          latest_id="$(jq -r '.latestApplied.id // "—"' "$response_file")"
          latest_apply="$(jq -r '.latestApplied.applyUuid // "—"' "$response_file")"
          latest_dispatch="$(jq -r '.latestApplied.dispatchId // "—"' "$response_file")"
          latest_mode="$(jq -r '.latestApplied.mode // "—"' "$response_file")"
          latest_run="$(jq -r '.latestApplied.runUuid // "—"' "$response_file")"
          latest_periods="$(jq -r '(.latestApplied.periods // []) | join(", ")' "$response_file")"
          latest_before="$(jq -r '.latestApplied.publicRevisionBefore // 0' "$response_file")"
          latest_after="$(jq -r '.latestApplied.publicRevisionAfter // 0' "$response_file")"
          latest_profiles="$(jq -r '.latestApplied.profilesUpdated // 0' "$response_file")"
          latest_scores="$(jq -r '.latestApplied.scoresWritten // 0' "$response_file")"
          latest_entries="$(jq -r '.latestApplied.entries // 0' "$response_file")"
          latest_exits="$(jq -r '.latestApplied.exits // 0' "$response_file")"
          latest_bootstrap="$(jq -r '.latestApplied.bootstrap // false' "$response_file")"
          latest_actor="$(jq -r '.latestApplied.actor // "—"' "$response_file")"
          latest_generated="$(jq -r '.latestApplied.generatedAt // "—"' "$response_file")"

          {
            echo '### Audit read-only des publications MR-V1.0'
            printf -- '- Table d’historique présente : `%s`\n' "$table_exists"
            printf -- '- Lignes examinées : %s\n' "$row_count"
            printf -- '- Répartition des statuts : `%s`\n' "$status_counts"
            printf -- '- Publication réussie antérieure : `%s`\n' "$has_prior"
            printf -- '- Dernière ligne appliquée : `#%s`\n' "$latest_id"
            printf -- '- applyUuid : `%s`\n' "$latest_apply"
            printf -- '- dispatchId : `%s`\n' "$latest_dispatch"
            printf -- '- Mode / bootstrap : `%s` / `%s`\n' "$latest_mode" "$latest_bootstrap"
            printf -- '- runUuid : `%s`\n' "$latest_run"
            printf -- '- Périodes : %s\n' "${latest_periods:-—}"
            printf -- '- Révision publique avant / après : %s / %s\n' "$latest_before" "$latest_after"
            printf -- '- Profils mis à jour / scores écrits : %s / %s\n' "$latest_profiles" "$latest_scores"
            printf -- '- Entrées / sorties : %s / %s\n' "$latest_entries" "$latest_exits"
            printf -- '- Acteur assaini : `%s`\n' "$latest_actor"
            printf -- '- Générée : %s\n' "$latest_generated"
            echo '- Backups et rapports internes exposés : `non`'
            echo '- Écriture app_state : `0`'
          } >> "$GITHUB_STEP_SUMMARY"

          {
            printf 'has_prior=%s\n' "$has_prior"
            printf 'latest_status=%s\n' "$(jq -r '.latestApplied.status // "none"' "$response_file")"
            printf 'latest_mode=%s\n' "$latest_mode"
            printf 'latest_bootstrap=%s\n' "$latest_bootstrap"
            printf 'latest_run=%s\n' "$latest_run"
            printf 'latest_after=%s\n' "$latest_after"
          } >> "$GITHUB_OUTPUT"

      - name: Publish sanitized audit status
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HISTORY_OUTCOME: ${{ steps.history.outcome }}
          HAS_PRIOR: ${{ steps.history.outputs.has_prior }}
          LATEST_MODE: ${{ steps.history.outputs.latest_mode }}
          LATEST_BOOTSTRAP: ${{ steps.history.outputs.latest_bootstrap }}
          LATEST_RUN: ${{ steps.history.outputs.latest_run }}
          LATEST_AFTER: ${{ steps.history.outputs.latest_after }}
        run: |
          set -euo pipefail
          state='success'
          description="prior ${HAS_PRIOR:-false} · ${LATEST_MODE:-none} · bootstrap ${LATEST_BOOTSTRAP:-false} · rev ${LATEST_AFTER:-0} · app_state 0"
          if [ "${HISTORY_OUTCOME:-failure}" != 'success' ]; then
            state='failure'
            description='audit historique apply interrompu · app_state inchangé'
          elif [ "${HAS_PRIOR:-false}" != 'true' ]; then
            state='pending'
            description='aucune publication antérieure appliquée · app_state 0'
          fi
          payload="$(jq -nc \
            --arg state "$state" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg description "$description" \
            --arg context 'pass50/publication-apply-history-audit' \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"

      - name: Archive sanitized audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: publication-apply-history-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            publication-apply-history-probe.json
            publication-apply-history.json
          if-no-files-found: ignore
          retention-days: 30
