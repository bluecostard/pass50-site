name: Temporary broader coverage patch

on:
  push:
    branches:
      - feat/broader-radar-data-coverage
    paths:
      - '.github/workflows/temp-broader-coverage-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/broader-radar-data-coverage
          fetch-depth: 0
      - name: Appliquer les remplacements exacts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('api/data-engine-core.php')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'const P50_DATA_CONFIDENCE_THRESHOLD = 90;': 'const P50_DATA_CONFIDENCE_THRESHOLD = 80;',
              "return max(90, min(100, (int)($config['data_engine']['confidence_threshold'] ?? P50_DATA_CONFIDENCE_THRESHOLD)));": "return max(60, min(P50_DATA_CONFIDENCE_THRESHOLD, (int)($config['data_engine']['confidence_threshold'] ?? P50_DATA_CONFIDENCE_THRESHOLD)));",
              "ON DUPLICATE KEY UPDATE setting_value=setting_value\");": "ON DUPLICATE KEY UPDATE setting_value=VALUES(setting_value)\");",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Remplacement attendu une fois, trouvé {count}: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Vérifier la syntaxe
        run: php -l api/data-engine-core.php
      - name: Enregistrer le correctif
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/data-engine-core.php
          git commit -m "Abaisser le seuil global de confiance à 80"
          git push origin HEAD:feat/broader-radar-data-coverage

# Deuxième commit volontaire : le workflow doit exister avant le push déclencheur.
