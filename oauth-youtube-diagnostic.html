<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>PASS50 · Diagnostic YouTube OAuth</title>
  <style>
    :root{color-scheme:dark;--bg:#050705;--panel:#0d110d;--line:#293129;--text:#f6f8f4;--muted:#9da79b;--lime:#b7ff00;--red:#ff8d8d}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{max-width:760px;margin:40px auto;padding:20px}.box{border:1px solid var(--line);border-radius:22px;background:var(--panel);padding:24px}.brand{font-size:30px;font-weight:1000}.brand span{color:var(--lime)}h1{font-size:25px;margin:8px 0 10px}.note{color:var(--muted);line-height:1.55}.btn{margin-top:18px;border:0;border-radius:14px;background:var(--lime);color:#050705;padding:14px 18px;font-weight:950;cursor:pointer}.btn[disabled]{opacity:.65;cursor:wait}.result{margin-top:18px;border:1px solid var(--line);border-radius:14px;padding:15px;min-height:64px;white-space:pre-wrap;line-height:1.55}.ok{border-color:#5f8500;color:#d9ff94}.error{border-color:#8a3434;color:var(--red)}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="box">
      <div class="brand">PASS<span>50</span></div>
      <h1>Diagnostic de connexion YouTube</h1>
      <p class="note">Cette page teste uniquement le démarrage OAuth depuis ta session PASS50. Elle n’affiche jamais le jeton de session, le Client ID, le Client Secret ni l’adresse Google complète.</p>
      <button class="btn" id="testBtn" type="button">Tester et ouvrir Google</button>
      <div class="result" id="result">Prêt. Clique sur le bouton.</div>
    </section>
  </main>
<script>
'use strict';
(function(){
  const button=document.getElementById('testBtn');
  const result=document.getElementById('result');
  const TIMEOUT_MS=20000;
  const setResult=(text,tone='')=>{result.className='result'+(tone?' '+tone:'');result.textContent=text;};

  async function requestWithFullTimeout(url,options){
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),TIMEOUT_MS);
    const started=performance.now();
    try{
      const response=await fetch(url,{...options,signal:controller.signal});
      const raw=await response.text();
      const elapsed=Math.round(performance.now()-started);
      let data={};
      try{data=raw?JSON.parse(raw):{};}catch(_){throw new Error(`Réponse HTTP ${response.status} illisible après ${elapsed} ms.`);}
      return {response,data,elapsed};
    }catch(error){
      if(error?.name==='AbortError')throw new Error(`Délai dépassé : aucune réponse complète après ${TIMEOUT_MS/1000} secondes.`);
      throw error;
    }finally{clearTimeout(timeout);}
  }

  button.addEventListener('click',async()=>{
    button.disabled=true;button.textContent='Test en cours…';
    setResult('1/3 · Lecture de la session PASS50…');
    const popup=window.open('','pass50_youtube_oauth_diagnostic','popup=yes,width=560,height=760,resizable=yes,scrollbars=yes');
    if(popup){try{popup.document.write('<!doctype html><meta charset="utf-8"><body style="background:#050705;color:white;font-family:Arial;padding:30px"><h2>PASS50</h2><p>Diagnostic OAuth en cours…</p></body>');popup.document.close();}catch(_){}}
    try{
      const token=String(localStorage.getItem('pass50_api_token')||'').trim();
      if(!token)throw new Error('Aucune session PASS50 trouvée dans ce navigateur. Reconnecte-toi sur le site puis relance ce test.');
      setResult('2/3 · Requête sécurisée envoyée à IONOS…');
      const {response,data,elapsed}=await requestWithFullTimeout('./api/youtube-oauth-start.php',{
        method:'POST',cache:'no-store',credentials:'same-origin',
        headers:{Accept:'application/json','Content-Type':'application/json',Authorization:`Bearer ${token}`},body:'{}'
      });
      if(!response.ok)throw new Error(`HTTP ${response.status} après ${elapsed} ms : ${data.error||data.message||'erreur serveur sans détail'}`);
      const url=String(data.authorizationUrl||'');
      if(!/^https:\/\/accounts\.google\.com\//.test(url))throw new Error(`HTTP ${response.status} après ${elapsed} ms : aucune adresse Google valide reçue.`);
      setResult(`3/3 · Succès serveur en ${elapsed} ms. Ouverture de Google…\nVersion du flux : ${Number(data.flowVersion||0)||'non indiquée'}`,'ok');
      if(popup&&!popup.closed)popup.location.replace(url);else location.assign(url);
    }catch(error){
      if(popup&&!popup.closed)popup.close();
      setResult(String(error?.message||error),'error');
    }finally{button.disabled=false;button.textContent='Retester et ouvrir Google';}
  });
}());
</script>
</body>
</html>
