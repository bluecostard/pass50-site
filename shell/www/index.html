<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050705" />
  <title>PASS50</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; min-height: 100%; background: #050705; color: #f6f8f4;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      display: grid; place-items: center;
      background:
        radial-gradient(900px 420px at 50% -8%, rgba(183,255,0,.16), transparent 55%),
        linear-gradient(180deg, #0a100a 0%, #050705 42%);
      padding: 24px;
    }
    .boot { text-align: center; max-width: 280px; }
    .brand { margin: 0; font-size: 48px; font-weight: 1000; letter-spacing: -2.4px; }
    .brand span { color: #b7ff00; }
    p { margin: 12px 0 0; color: #9da79b; font-size: 13px; font-weight: 700; line-height: 1.4; }
    .dot {
      width: 10px; height: 10px; margin: 22px auto 0; border-radius: 50%;
      background: #b7ff00; box-shadow: 0 0 0 4px rgba(183,255,0,.14);
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.45} }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  </style>
</head>
<body data-pass50-shell="PASS50-NATIVE-SHELL-V1">
  <div class="boot">
    <h1 class="brand">PASS<span>50</span></h1>
    <p>Ouverture de l’app…</p>
    <div class="dot" aria-hidden="true"></div>
  </div>
  <script>
    // Fallback navigateur / preview locale si server.url Capacitor n’est pas actif.
    setTimeout(function () {
      if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) return;
      location.replace('https://pass50.store/app.html?source=shell-preview');
    }, 600);
  </script>
</body>
</html>
