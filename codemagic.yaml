# PASS50 Mobile — Codemagic CI/CD (Expo SDK 57)
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-react-native-app/
#
# Setup (Codemagic UI):
# 1. Add application → GitHub repo bluecostard/pass50-site
# 2. Team settings → Integrations → Apple Developer Portal
#    Create API key named exactly: Pass50
# 3. Environment groups → create group "pass50_store" with:
#    - APP_STORE_APPLE_ID = numeric Apple ID from App Store Connect (after app record exists)
# 4. Code signing identities → iOS distribution for bundle store.pass50.app
# 5. Scan branch for codemagic.yaml → Start build (pass50-ios-testflight first)

workflows:
  pass50-ios-testflight:
    name: PASS50 iOS → TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Pass50
    environment:
      groups:
        - pass50_store
      ios_signing:
        distribution_type: app_store
        bundle_identifier: store.pass50.app
      node: 22.14.0
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: store.pass50.app
        XCODE_WORKSPACE: PASS50.xcworkspace
        XCODE_SCHEME: PASS50
        MOBILE_DIR: apps/mobile
        EXPO_PUBLIC_API_BASE: https://pass50.store/api/
    scripts:
      - name: Install npm dependencies
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/$MOBILE_DIR"
          npm ci
      - name: Expo prebuild (iOS)
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/$MOBILE_DIR"
          CI=1 npx expo prebuild --platform ios --clean
      - name: Ensure ITSAppUsesNonExemptEncryption
        script: |
          set -euo pipefail
          PLIST="$CM_BUILD_DIR/$MOBILE_DIR/ios/$XCODE_SCHEME/Info.plist"
          PLIST_BUDDY=/usr/libexec/PlistBuddy
          if ! $PLIST_BUDDY -c "Print :ITSAppUsesNonExemptEncryption" "$PLIST" >/dev/null 2>&1; then
            $PLIST_BUDDY -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
          fi
      - name: Install CocoaPods
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/$MOBILE_DIR/ios"
          pod install
      - name: Set up code signing profiles
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/$MOBILE_DIR/ios"
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/$MOBILE_DIR/ios/$XCODE_SCHEME.xcodeproj"
      - name: Increment iOS build number
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/$MOBILE_DIR/ios"
          LATEST=0
          if [ -n "${APP_STORE_APPLE_ID:-}" ]; then
            LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || \
                     app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || \
                     echo 0)
          fi
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            LATEST=0
          fi
          # Must be strictly higher than any previously uploaded CFBundleVersion.
          NEXT=$((LATEST + 1))
          if [ "${BUILD_NUMBER:-0}" -ge "$NEXT" ]; then
            NEXT=$((BUILD_NUMBER + 1))
          fi
          # Safety floor: known previous upload was 8+; keep ahead of app.json.
          if [ "$NEXT" -le 9 ]; then
            NEXT=10
          fi
          echo "Setting CFBundleVersion=$NEXT (ASC latest=$LATEST, CM BUILD_NUMBER=${BUILD_NUMBER:-n/a})"
          agvtool new-version -all "$NEXT"
      - name: Build IPA
        script: |
          set -euo pipefail
          IOS_DIR="$CM_BUILD_DIR/$MOBILE_DIR/ios"
          cd "$IOS_DIR"
          echo "=== ios/ contents ==="
          ls -la
          echo "=== Available schemes ==="
          xcodebuild -list -workspace "$XCODE_WORKSPACE"
          # Prefer Codemagic helper; on failure dump raw xcodebuild errors (code 65 is opaque).
          set +e
          xcode-project build-ipa \
            --workspace "$IOS_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "=== build-ipa failed ($STATUS); retrying with raw xcodebuild for diagnostics ==="
            ARCHIVE_PATH="$IOS_DIR/build/PASS50.xcarchive"
            EXPORT_PATH="$IOS_DIR/build/ipa"
            mkdir -p "$IOS_DIR/build" "$EXPORT_PATH"
            set +e
            xcodebuild \
              -workspace "$IOS_DIR/$XCODE_WORKSPACE" \
              -scheme "$XCODE_SCHEME" \
              -configuration Release \
              -archivePath "$ARCHIVE_PATH" \
              -destination "generic/platform=iOS" \
              CLEAN=NO \
              archive \
              CODE_SIGN_STYLE=Manual \
              2>&1 | tee /tmp/pass50-xcodebuild-archive.log
            XB_STATUS=${PIPESTATUS[0]}
            set -e
            echo "=== grep errors from archive log ==="
            grep -E "error:|ERROR|fatal|No profile|Provisioning|CODE_SIGN|Swift Compiler|❌" /tmp/pass50-xcodebuild-archive.log | tail -n 80 || true
            echo "=== tail archive log ==="
            tail -n 80 /tmp/pass50-xcodebuild-archive.log || true
            find /tmp/xcodebuild_logs -type f -name '*.log' -print0 2>/dev/null \
              | xargs -0 ls -t 2>/dev/null \
              | head -3 \
              | while read -r f; do
                  echo "----- $f -----"
                  grep -E "error:|ERROR|fatal|No profile|Provisioning" "$f" | tail -n 40 || true
                  tail -n 40 "$f" || true
                done
            exit "$STATUS"
          fi
      - name: Locate IPA for upload
        script: |
          set -euo pipefail
          echo "=== Searching for IPA artifacts ==="
          find "$CM_BUILD_DIR" -name '*.ipa' -type f -print || true
          IPA="$(find "$CM_BUILD_DIR" -name '*.ipa' -type f | head -n 1 || true)"
          if [ -z "$IPA" ]; then
            echo "ERROR: No .ipa found — cannot publish to App Store Connect / TestFlight"
            exit 1
          fi
          # Codemagic publishing looks for IPA under these conventional paths.
          mkdir -p "$CM_BUILD_DIR/build/ios/ipa" "$CM_BUILD_DIR/artifacts"
          cp "$IPA" "$CM_BUILD_DIR/build/ios/ipa/PASS50.ipa"
          cp "$IPA" "$CM_BUILD_DIR/artifacts/PASS50.ipa"
          ls -la "$CM_BUILD_DIR/build/ios/ipa/PASS50.ipa"
          echo "IPA ready for App Store Connect publishing step"
    artifacts:
      - artifacts/*.ipa
      - build/ios/ipa/*.ipa
      - apps/mobile/build/ios/ipa/*.ipa
      - "**/*.ipa"
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

