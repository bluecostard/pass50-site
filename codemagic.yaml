  pass50-android-internal:
    name: PASS50 Android → Play Internal (AAB)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - pass50_store
        - google_play
      android_signing:
        - pass50_android
      node: 22.14.0
      java: 17
      vars:
        PACKAGE_NAME: store.pass50.app
        MOBILE_DIR: apps/mobile
        EXPO_PUBLIC_API_BASE: https://pass50.store/api/
    scripts:
      - name: Install npm dependencies
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/$MOBILE_DIR"
          npm ci
      - name: Expo prebuild (Android)
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/$MOBILE_DIR"
          npx expo prebuild --platform android --non-interactive
      - name: Set Android SDK location
        script: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/$MOBILE_DIR/android/local.properties"
      - name: Inject Codemagic Android release signing
        script: |
          set -euo pipefail
          GRADLE="$CM_BUILD_DIR/$MOBILE_DIR/android/app/build.gradle"
          SIGNING="$CM_BUILD_DIR/$MOBILE_DIR/support-files/codemagic-android-signing.gradle"
          if [ -f "$SIGNING" ] && ! grep -q 'codemagic-android-signing.gradle' "$GRADLE"; then
            echo "apply from: \"../../support-files/codemagic-android-signing.gradle\"" >> "$GRADLE"
          fi
      - name: Build Android App Bundle
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/$MOBILE_DIR/android"
          UPDATED_BUILD_NUMBER="${BUILD_NUMBER:-1}"
          if [ -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS:-}" ]; then
            LATEST=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" || true)
            if [ -n "$LATEST" ] && [ "$LATEST" != "null" ]; then
              UPDATED_BUILD_NUMBER=$((LATEST + 1))
            fi
          fi
          ./gradlew bundleRelease \
            -PversionCode="$UPDATED_BUILD_NUMBER" \
            -PversionName="1.0.$UPDATED_BUILD_NUMBER"
    artifacts:
      - apps/mobile/android/app/build/outputs/**/*.aab
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
