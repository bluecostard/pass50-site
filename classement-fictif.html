<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>PASS50 · Classement fictif interne</title>
<style>
:root{--bg:#050705;--panel:#101510;--line:#293129;--text:#f6f8f4;--muted:#9da79b;--lime:#b7ff00;--orange:#ff9d1d;--red:#ff6464}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,rgba(183,255,0,.09),transparent 30%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 18px 60px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.brand{font-size:32px;font-weight:1000}.brand span{color:var(--lime)}.back,.periods button{border:1px solid var(--line);background:#0b0e0b;color:var(--text);border-radius:12px;padding:10px 13px;font-weight:900;text-decoration:none}.banner{margin:22px 0;padding:18px;border:1px solid var(--orange);border-radius:18px;background:rgba(255,157,29,.09)}.banner strong{color:#ffd08a}.periods{display:flex;gap:8px;flex-wrap:wrap}.periods button.active{background:var(--lime);color:#050705;border-color:var(--lime)}.meta,.readiness{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:18px 0}.stat,.platform{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:14px}.value{font-size:25px;font-weight:1000;color:var(--lime)}table{width:100%;border-collapse:collapse;border:1px solid var(--line);background:var(--panel);border-radius:18px;overflow:hidden}th,td{text-align:left;padding:13px;border-bottom:1px solid var(--line)}th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}.rank{font-size:22px;font-weight:1000;color:var(--lime)}.score{font-weight:1000}.muted{color:var(--muted);font-size:12px}.error{padding:18px;border:1px solid var(--red);border-radius:15px;color:#ffb0b0}.ok{color:var(--lime)}.warn{color:var(--orange)}@media(max-width:720px){th:nth-child(n+5),td:nth-child(n+5){display:none}th,td{padding:11px 8px}}
</style></head>
<body><main class="wrap"><header><div class="brand">PASS<span>50</span></div><a class="back" href="./">Retour au site</a></header>
<section class="banner"><strong>CLASSEMENT FICTIF INTERNE</strong><br>Simulation MR‑V1.0 isolée. Aucune ligne de ce tableau n’est publiée dans le classement public et aucune écriture dans <code>app_state</code> n’est autorisée.</section>
<div class="periods" id="periods"></div><section class="meta" id="meta"></section><h2>Couverture des collecteurs</h2><section class="readiness" id="readiness"></section><h2>Classement expérimental</h2><div id="content">Chargement…</div></main>
<script>
const periods=['2H','24H','48H','7J','15J'];let current='24H';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function token(){return localStorage.getItem('pass50_api_token')||''}
function renderPeriods(){document.getElementById('periods').innerHTML=periods.map(p=>`<button class="${p===current?'active':''}" data-period="${p}">${p}</button>`).join('');document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{current=b.dataset.period;renderPeriods();load()})}
async function load(){const content=document.getElementById('content'),auth=token();if(!auth){content.innerHTML='<div class="error">Connexion administrateur requise. Ouvrez d’abord l’administration PASS50 dans cet appareil.</div>';return}content.textContent='Chargement…';try{const r=await fetch(`./api/metrics-ranking-fictive.php?period=${encodeURIComponent(current)}`,{headers:{Authorization:'Bearer '+auth},cache:'no-store'});const data=await r.json();if(!r.ok)throw new Error(data.error||'Erreur serveur');const run=data.run||{};document.getElementById('meta').innerHTML=`<div class="stat"><div class="value">${data.summary.displayed}</div><div>profils affichés</div></div><div class="stat"><div class="value">${esc(data.period)}</div><div>période</div></div><div class="stat"><div class="value">${esc(run.classableCount)}</div><div>profils classables</div></div><div class="stat"><div class="value">0</div><div>écriture publique</div></div>`;const ps=data.collectorReadiness?.platforms||{};document.getElementById('readiness').innerHTML=['YouTube','X','TikTok','Instagram','Facebook','Snapchat'].map(p=>{const s=ps[p]||{};const good=Number(s.operational||0),total=Number(s.verifiedLinks||0);return `<div class="platform"><strong>${p}</strong><div class="value ${good===total?'ok':'warn'}">${good}/${total}</div><div class="muted">liens opérationnels · ${esc(s.coveragePercent||0)} %</div></div>`}).join('');content.innerHTML=`<table><thead><tr><th>Rang</th><th>Profil</th><th>Score</th><th>Évolution</th><th>Confiance</th><th>Couverture</th><th>Sources</th></tr></thead><tbody>${data.rows.map(row=>`<tr><td class="rank">${row.rank}</td><td><strong>${esc(row.name)}</strong><div class="muted">${esc(row.handle||row.profileId)}</div></td><td class="score">${Number(row.score).toFixed(3)}</td><td>${row.rankDelta===null?'—':(row.rankDelta>0?'▲ '+row.rankDelta:row.rankDelta<0?'▼ '+Math.abs(row.rankDelta):'stable')}</td><td>${Number(row.confidence).toFixed(1)} %</td><td>${Number(row.coverage).toFixed(1)} %</td><td>${row.platformCount}</td></tr>`).join('')}</tbody></table>`}catch(e){content.innerHTML=`<div class="error">${esc(e.message)}</div>`}}
renderPeriods();load();
</script></body></html>
