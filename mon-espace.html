<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050705">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest?v=23.0">
  <link rel="icon" type="image/svg+xml" href="./icon.svg?v=22.4">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=22.4">
  <title>Mon espace — PASS50</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Connexion et compte PASS50 — sans repasser par le classement.">
  <style>
    :root{--bg:#050705;--panel:#0d110d;--line:#293129;--text:#f6f8f4;--muted:#9da79b;--lime:#b7ff00;--red:#ff4b4b;--shadow:0 20px 60px rgba(0,0,0,.5)}
    *{box-sizing:border-box}
    html{background:var(--bg)}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
    button,a,input{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
    .hidden{display:none!important}
    .shell{width:min(520px,100%);margin:auto;padding:0 18px calc(52px + env(safe-area-inset-bottom))}
    .topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:calc(15px + env(safe-area-inset-top)) 0 15px;background:rgba(5,7,5,.96);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
    .brand{display:inline-flex;align-items:baseline;font-size:31px;font-weight:1000;letter-spacing:-2px}
    .brand .fifty{color:var(--lime)}
    .page-name{font-size:12px;color:var(--muted);font-weight:950;letter-spacing:.8px}
    .hero{margin-top:22px;padding:22px;border:1px solid rgba(183,255,0,.28);border-radius:22px;background:linear-gradient(145deg,rgba(183,255,0,.1),rgba(16,22,16,.96));box-shadow:var(--shadow)}
    .eyebrow{color:var(--lime);font-size:11px;font-weight:1000;letter-spacing:.8px}
    .hero h1{margin:7px 0 8px;font-size:clamp(32px,8vw,46px);line-height:.95;letter-spacing:-2px}
    .hero p{margin:0;color:#c4ccc1;line-height:1.5}
    .panel{margin-top:16px;border:1px solid var(--line);border-radius:22px;background:var(--panel);padding:18px}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
    .tab{border:1px solid var(--line);background:#0a0d0a;color:var(--text);border-radius:13px;padding:11px 12px;font-weight:900}
    .tab.active{background:var(--lime);border-color:var(--lime);color:#050705}
    .note{border:1px solid var(--line);border-radius:14px;padding:11px 12px;color:var(--muted);font-size:13px;line-height:1.45;margin-bottom:14px}
    .field{display:grid;gap:7px;margin-bottom:12px}
    .field label{font-size:12px;font-weight:900}
    .field input{width:100%;border:1px solid var(--line);border-radius:13px;background:#050705;color:var(--text);padding:12px 13px}
    .field input:focus{outline:1px solid var(--lime);border-color:var(--lime)}
    .btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#0a0d0a;color:var(--text);border-radius:13px;padding:12px 14px;font-weight:900;width:100%}
    .btn.primary{background:var(--lime);border-color:var(--lime);color:#050705}
    .btn.ghost{margin-top:8px}
    .btn.danger{color:#ffaaaa;border-color:#6f2b2b;margin-top:10px}
    .btn:disabled{opacity:.55}
    .status{min-height:18px;margin:8px 0 0;color:var(--red);font-size:13px;font-weight:800}
    .status.ok{color:var(--lime)}
    .user-card{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;margin-bottom:16px}
    .avatar{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,#263026,#0b0e0b);font-weight:1000;font-size:22px;overflow:hidden;border:1px solid var(--line)}
    .avatar img{width:100%;height:100%;object-fit:cover}
    .user-card strong{display:block;font-size:20px}
    .user-card span{display:block;color:var(--muted);font-size:13px;margin-top:3px}
    .links{display:grid;gap:8px;margin-top:8px}
    .link-row{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:14px;padding:13px 14px;background:#0a0d0a}
    .link-row span{color:var(--muted);font-size:12px;font-weight:800}
    .legal{margin-top:18px;display:flex;flex-wrap:wrap;gap:12px;font-size:12px;font-weight:800;color:var(--muted)}
    .legal a:hover{color:var(--lime)}
    .toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));z-index:180;transform:translate(-50%,14px);opacity:0;pointer-events:none;border:1px solid var(--line);background:#0c100c;color:var(--text);border-radius:999px;padding:10px 14px;font-size:12px;font-weight:900;transition:.2s}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    html.pass50-native-app .p50-bottom-nav,
    body[data-pass50-native="1"] .p50-bottom-nav{display:none!important;height:0!important;visibility:hidden!important}
    @media(max-width:680px){
      body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);padding-bottom:calc(78px + env(safe-area-inset-bottom))}
      body[data-pass50-native="1"]{padding-bottom:calc(28px + env(safe-area-inset-bottom))}
      .shell{padding:0 11px 28px}
      .brand{font-size:27px}
      .page-name,.desktop-only{display:none}
    }
  </style>
</head>
<body data-pass50-page="account">
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="PASS50"><span>PASS</span><span class="fifty">50</span></a>
      <div class="page-name">MON ESPACE</div>
      <a class="btn desktop-only" href="./" style="width:auto;padding:10px 13px">Classement</a>
    </header>

    <section class="hero">
      <div class="eyebrow">PASS50 · COMPTE</div>
      <h1>Mon espace</h1>
      <p>Connexion et compte — page dédiée, sans le classement derrière.</p>
    </section>

    <section class="panel" id="authPanel">
      <div class="tabs" role="tablist">
        <button type="button" class="tab active" data-auth-tab="login">Connexion</button>
        <button type="button" class="tab" data-auth-tab="signup">Créer un compte</button>
      </div>
      <div class="note">Un e-mail de confirmation ou de récupération peut être envoyé à ton adresse.</div>
      <form id="authForm" data-mode="login" autocomplete="on">
        <div class="field" id="displayNameField" hidden>
          <label for="displayName">Pseudo</label>
          <input id="displayName" name="displayName" maxlength="40" autocomplete="nickname">
        </div>
        <div class="field">
          <label for="email">Adresse e-mail</label>
          <input id="email" name="email" type="email" required autocomplete="email">
        </div>
        <div class="field" id="passwordField">
          <label for="password">Mot de passe</label>
          <input id="password" name="password" type="password" minlength="8" required autocomplete="current-password">
        </div>
        <button class="btn primary" type="submit" id="authSubmit">Se connecter</button>
        <button class="btn ghost" type="button" id="forgotBtn">Mot de passe oublié ?</button>
        <div class="status" id="authStatus" aria-live="polite"></div>
      </form>
    </section>

    <section class="panel hidden" id="userPanel">
      <div class="user-card">
        <div class="avatar" id="userAvatar">M</div>
        <div>
          <strong id="userName">Membre</strong>
          <span id="userEmail"></span>
        </div>
      </div>
      <div class="links">
        <a class="link-row" href="./mon-fil.html"><strong>Mon fil</strong><span>Ouvrir →</span></a>
        <a class="link-row" href="./pronostics.html?v=83"><strong>Pronos</strong><span>Ouvrir →</span></a>
        <a class="link-row" href="./"><strong>Classement</strong><span>Ouvrir →</span></a>
      </div>
      <button class="btn danger" type="button" id="logoutBtn">Déconnexion</button>
      <div class="legal">
        <a href="./informations-legales.html">Infos légales</a>
        <a href="./conditions-utilisation.html">Conditions</a>
        <a href="./politique-confidentialite.html">Confidentialité</a>
      </div>
    </section>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="./pass50-auth-session.js?v=1.0"></script>
  <script src="./public-ui-sanitizer-v1.js?v=1.1"></script>
  <script src="./mobile-bottom-nav-v1.js?v=1.12"></script>
  <script src="./mon-espace.js?v=1.0"></script>
</body>
</html>
