<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#050705">
  <title>Pronostics — PASS50</title>
  <meta name="description" content="Ta grille du jour PASS50. People influenceurs · Artiste/sportif · Actualité.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#050705;--ink:#f6f8f4;--muted:#9da79b;--line:#293129;
      --lime:#b7ff00;--red:#ff4b4b;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,ui-sans-serif,system-ui,sans-serif}
    body{
      min-height:100dvh;
      background:
        radial-gradient(120% 70% at 78% -8%,rgba(183,255,0,.14),transparent 52%),
        var(--bg);
    }
    .shell{
      width:min(430px,100%);
      margin:0 auto;
      min-height:100dvh;
      padding:18px 16px calc(118px + env(safe-area-inset-bottom));
    }
    .brand{
      font-family:"Archivo Black",Impact,sans-serif;
      font-size:34px;letter-spacing:-.04em;line-height:1;text-align:center;
    }
    .brand .fifty{color:var(--lime)}
    .kicker{
      margin:8px 0 0;text-align:center;font-size:11px;font-weight:800;
      letter-spacing:.2em;text-transform:uppercase;color:rgba(246,248,244,.7);
    }
    .timer{
      margin:16px auto 0;width:fit-content;display:inline-flex;align-items:center;gap:8px;
      border:1px solid rgba(183,255,0,.35);border-radius:999px;padding:8px 14px;
      background:rgba(183,255,0,.06);font-size:13px;font-weight:800;
    }
    .timer strong{color:var(--lime)}
    .title-row{margin-top:22px;display:flex;align-items:center;gap:10px}
    .title-row .ico{
      width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
      background:rgba(183,255,0,.12);color:var(--lime);font-size:14px;
    }
    .title-row h1{
      margin:0;font-family:"Archivo Black",Impact,sans-serif;
      font-size:26px;letter-spacing:-.03em;
    }
    .card{
      margin-top:14px;border:1px solid var(--line);border-radius:18px;
      background:linear-gradient(180deg,#121812,#0a0d0a);padding:14px 14px 16px;
    }
    .card h2{margin:0;color:var(--lime);font-size:13px;font-weight:900;letter-spacing:.04em}
    .card p{margin:6px 0 0;color:var(--muted);font-size:12px;font-weight:650;line-height:1.35}
    .row{display:flex;gap:12px;align-items:center;margin-top:14px;flex-wrap:wrap}
    .pick{
      position:relative;border:0;background:transparent;padding:0;color:inherit;cursor:pointer;
      display:flex;flex-direction:column;align-items:center;gap:6px;width:72px;
    }
    .avatar{
      width:64px;height:64px;border-radius:50%;overflow:hidden;position:relative;
      border:2px solid #3a453a;background:#1a211a;
      display:grid;place-items:center;font-weight:900;color:var(--lime);font-size:14px;
    }
    .avatar.lg{width:72px;height:72px}
    .avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .pick.on .avatar{border-color:var(--lime);box-shadow:0 0 0 3px rgba(183,255,0,.18)}
    .check{
      position:absolute;right:2px;bottom:18px;width:20px;height:20px;border-radius:50%;
      background:var(--lime);color:#050705;font-size:12px;font-weight:1000;
      display:none;place-items:center;border:2px solid #050705;
    }
    .pick.on .check{display:grid}
    .pick span.name{font-size:10px;font-weight:800;text-align:center;line-height:1.15;max-width:72px}
    .cta{
      margin-top:18px;width:100%;border:0;border-radius:16px;padding:16px 18px;
      background:var(--lime);color:#050705;font-weight:1000;font-size:14px;
      letter-spacing:.04em;text-transform:uppercase;
      display:flex;align-items:center;justify-content:center;gap:10px;
      box-shadow:0 12px 28px rgba(183,255,0,.25);
    }
    .cta:disabled{opacity:.38;box-shadow:none}
    .cta .arrow{
      width:28px;height:28px;border-radius:50%;background:#050705;color:#fff;
      display:grid;place-items:center;font-size:14px;
    }
    .note{margin-top:10px;text-align:center;color:var(--muted);font-size:11px;font-weight:700}
    .empty{
      margin-top:18px;border:1px dashed var(--line);border-radius:18px;padding:22px 16px;
      text-align:center;color:var(--muted);font-size:14px;font-weight:700;line-height:1.45;
    }
    .toast{
      position:fixed;left:50%;bottom:calc(118px + env(safe-area-inset-bottom));
      transform:translateX(-50%) translateY(8px);opacity:0;pointer-events:none;z-index:150;
      background:#0d120d;border:1px solid rgba(183,255,0,.35);border-radius:999px;
      padding:11px 16px;font-size:12px;font-weight:800;transition:.22s ease;
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  </style>
</head>
<body data-pass50-page="prono">
  <div class="shell">
    <div class="brand">PASS<span class="fifty">50</span></div>
    <div class="kicker">Pronostics 24H</div>
    <div class="timer">⏱ Clôture dans <strong id="countdown">--:--:--</strong></div>

    <div class="title-row">
      <div class="ico" aria-hidden="true">📅</div>
      <h1>Ta grille du jour</h1>
    </div>

    <div id="grilleRoot"><div class="empty">Chargement de la grille…</div></div>

    <button class="cta" id="validate" type="button" disabled hidden>
      Valider ma grille <span class="arrow">→</span>
    </button>
    <p class="note" id="noteLine" hidden>Points · Streak · Carte WhatsApp — sans argent réel</p>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <script src="./mobile-bottom-nav-v1.js?v=1.6"></script>
  <script>
  (function () {
    const picks = {};
    let themes = [];
    let closesAt = null;
    let grilleId = null;
    const toastEl = document.getElementById('toast');
    const root = document.getElementById('grilleRoot');
    const validateBtn = document.getElementById('validate');
    const noteLine = document.getElementById('noteLine');

    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => toastEl.classList.remove('show'), 2400);
    }

    function initials(name) {
      return String(name || '?').split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase();
    }

    function avatarBtn(person, on, large) {
      const img = person.photoUrl
        ? `<img src="${person.photoUrl}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`
        : '';
      const label = person.initials || initials(person.name);
      return `<button type="button" class="pick ${on ? 'on' : ''}" data-id="${person.profileId}">
        <div class="avatar ${large ? 'lg' : ''}">${img}${label}</div>
        <span class="check">✓</span>
        <span class="name">${person.name}</span>
      </button>`;
    }

    function themeComplete(theme) {
      const selected = picks[theme.key] || [];
      return selected.length === Number(theme.pickCount || 1);
    }

    function allComplete() {
      return themes.length > 0 && themes.every(themeComplete);
    }

    function render() {
      if (!themes.length) return;
      root.innerHTML = themes.map((theme, index) => {
        const selected = picks[theme.key] || [];
        const need = Number(theme.pickCount || 1);
        const people = theme.people || [];
        const large = need >= 2;
        return `<article class="card" data-theme="${theme.key}">
          <h2>${index + 1}. ${theme.label}</h2>
          <p>${theme.hint || ''} · choisis ${need}</p>
          <div class="row" data-row="${theme.key}">
            ${people.map((p) => avatarBtn(p, selected.includes(p.profileId), large)).join('') || '<span style="color:var(--muted);font-size:12px">Liste à venir</span>'}
          </div>
        </article>`;
      }).join('');

      validateBtn.hidden = false;
      noteLine.hidden = false;
      validateBtn.disabled = !allComplete();

      root.querySelectorAll('[data-row]').forEach((row) => {
        const key = row.getAttribute('data-row');
        const theme = themes.find((t) => t.key === key);
        if (!theme) return;
        const need = Number(theme.pickCount || 1);
        row.querySelectorAll('.pick').forEach((btn) => {
          btn.onclick = () => {
            const id = btn.dataset.id;
            let selected = picks[key] ? [...picks[key]] : [];
            if (selected.includes(id)) selected = selected.filter((x) => x !== id);
            else if (need === 1) selected = [id];
            else if (selected.length < need) selected.push(id);
            picks[key] = selected;
            render();
          };
        });
      });
    }

    function tick() {
      const end = closesAt ? new Date(closesAt) : (() => {
        const d = new Date();
        d.setHours(23, 59, 59, 999);
        return d;
      })();
      let s = Math.max(0, Math.floor((end.getTime() - Date.now()) / 1000));
      const h = String(Math.floor(s / 3600)).padStart(2, '0');
      s %= 3600;
      const m = String(Math.floor(s / 60)).padStart(2, '0');
      const sec = String(s % 60).padStart(2, '0');
      document.getElementById('countdown').textContent = `${h}:${m}:${sec}`;
    }

    validateBtn.onclick = () => {
      try {
        localStorage.setItem(
          'p50_grille_du_jour',
          JSON.stringify({
            grilleId,
            date: new Date().toISOString().slice(0, 10),
            picks,
            at: Date.now()
          })
        );
      } catch (_) {}
      toast('Grille validée — sans argent réel');
    };

    fetch('./api/prono-grille.php')
      .then((r) => r.json())
      .then((data) => {
        if (!data.ok || !data.ready || !data.grille) {
          root.innerHTML = `<div class="empty">${data.message || 'Aucune grille publiée pour aujourd’hui.'}<br><span style="display:block;margin-top:8px;font-size:12px">L’admin publie la grille depuis l’atelier Pronostics.</span></div>`;
          return;
        }
        grilleId = data.grille.id || null;
        closesAt = data.grille.closesAt || null;
        themes = (data.grille.themes || []).filter((t) => (t.people || []).length);
        if (!themes.length) {
          root.innerHTML = '<div class="empty">Grille publiée mais encore vide. Ajoute des personnes dans l’admin.</div>';
          return;
        }
        themes.forEach((t) => { picks[t.key] = []; });
        render();
        tick();
      })
      .catch(() => {
        root.innerHTML = '<div class="empty">Impossible de charger la grille pour le moment.</div>';
      });

    tick();
    setInterval(tick, 1000);
  })();
  </script>
</body>
</html>
