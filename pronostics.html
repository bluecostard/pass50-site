<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050705">
  <title>Pronostics — PASS50</title>
  <meta name="description" content="Ta grille du jour PASS50. Choisis le Top 3, le Climber et le Prochain LIVE. Points · streak · sans argent réel.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#050705;--ink:#f4f7f0;--muted:#8f998c;--line:rgba(183,255,0,.16);
      --lime:#b7ff00;--lime-dim:rgba(183,255,0,.12);--panel:#0c100c;--panel2:#101610;
      --red:#ff4d4d;--radius:20px;--ease:cubic-bezier(.22,.8,.24,1);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{background:var(--bg)}
    body{
      min-height:100vh;color:var(--ink);
      font-family:Manrope,ui-sans-serif,system-ui,sans-serif;
      background:
        radial-gradient(ellipse 90% 55% at 50% -8%,rgba(183,255,0,.14),transparent 55%),
        radial-gradient(circle at 100% 40%,rgba(183,255,0,.04),transparent 28%),
        var(--bg);
    }
    a{color:inherit;text-decoration:none}
    button{font:inherit;cursor:pointer;background:none;border:none;color:inherit}
    .hidden{display:none!important}

    .shell{width:min(680px,100%);margin:auto;padding:0 18px calc(110px + env(safe-area-inset-bottom))}

    /* ── Topbar ── */
    .topbar{
      position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
      gap:12px;padding:calc(12px + env(safe-area-inset-top)) 0 12px;
      background:linear-gradient(180deg,rgba(5,7,5,.97),rgba(5,7,5,.82));
      backdrop-filter:blur(16px);border-bottom:1px solid transparent;
    }
    .brand-mark{display:flex;flex-direction:column;gap:2px;line-height:1}
    .brand-mark .word{font-family:"Archivo Black",Impact,sans-serif;font-size:28px;letter-spacing:-.04em;color:var(--lime)}
    .brand-mark .sub{font-size:10px;font-weight:800;letter-spacing:.18em;color:rgba(244,247,240,.55);text-transform:uppercase}
    .btn{
      border:1px solid rgba(255,255,255,.1);background:rgba(10,13,10,.85);color:var(--ink);
      border-radius:14px;padding:10px 14px;font-weight:800;font-size:13px;
      transition:transform .18s var(--ease),border-color .18s,background .18s;
    }
    .btn:hover{border-color:rgba(183,255,0,.45)}
    .btn.primary{background:var(--lime);border-color:var(--lime);color:#050705}
    .btn.primary:hover{filter:brightness(1.05)}
    .btn:active{transform:scale(.97)}
    .btn:disabled{opacity:.4;cursor:not-allowed}

    /* ── Header page ── */
    .page-header{padding:20px 0 8px}
    .page-header .kicker{font-size:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--lime);margin-bottom:6px}
    .page-header h1{font-family:"Archivo Black",Impact,sans-serif;font-size:clamp(26px,7vw,38px);letter-spacing:-.03em;line-height:1}
    .countdown-chip{
      display:inline-flex;align-items:center;gap:6px;margin-top:14px;
      background:var(--panel);border:1px solid var(--line);border-radius:30px;
      padding:6px 14px;font-size:12px;font-weight:800;color:rgba(244,247,240,.7);
    }
    .countdown-chip span{color:var(--lime)}

    /* ── Solde ── */
    .score-row{
      display:flex;align-items:center;gap:14px;margin:18px 0 0;
      background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 16px;
    }
    .score-row .pts{font-size:22px;font-weight:800;color:var(--lime)}
    .score-row .pts-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
    .score-row .streak{margin-left:auto;text-align:right}
    .score-row .streak-num{font-size:18px;font-weight:800}
    .score-row .streak-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}

    /* ── Cards grille ── */
    .grille{display:flex;flex-direction:column;gap:12px;margin-top:20px}
    .card{
      background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
      padding:18px 16px;transition:border-color .2s;
    }
    .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
    .card-head h2{font-size:14px;font-weight:800;letter-spacing:.04em;color:var(--lime)}
    .card-head .hint{font-size:12px;font-weight:600;color:var(--muted);margin-top:3px}
    .badge-live{
      background:rgba(255,77,77,.18);border:1px solid rgba(255,77,77,.35);
      color:var(--red);border-radius:8px;padding:3px 8px;font-size:10px;font-weight:800;
      white-space:nowrap;
    }
    .badge-up{color:var(--lime);font-size:11px;font-weight:800}
    .pub-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-top:12px}
    .pub-card img.cover{width:100%;max-height:180px;object-fit:cover;border-radius:14px;margin-bottom:10px}
    .pub-card h3{margin:0;font-size:16px;line-height:1.3}
    .pub-meta{margin-top:6px;font-size:12px;color:var(--muted)}
    .pub-opts{display:grid;gap:8px;margin-top:12px}
    .pub-opt{
      display:flex;justify-content:space-between;align-items:center;gap:10px;
      border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:12px 14px;
      font-weight:800;cursor:pointer;transition:border-color .15s,background .15s;
    }
    .pub-opt:hover{border-color:rgba(183,255,0,.45)}
    .pub-opt .odd{color:var(--lime);font-size:18px;font-family:"Archivo Black",Impact,sans-serif}
    .pub-opt.mine{border-color:var(--lime);background:rgba(183,255,0,.08)}
    .pub-theme{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--lime);margin-bottom:8px}

    /* Picker avatars */
    .picker{display:flex;flex-wrap:wrap;gap:14px;margin-top:4px}
    .pick-btn{
      display:flex;flex-direction:column;align-items:center;gap:5px;
      background:none;border:none;cursor:pointer;position:relative;
      transition:transform .15s var(--ease);
    }
    .pick-btn:active{transform:scale(.94)}
    .avatar{
      width:56px;height:56px;border-radius:50%;overflow:hidden;
      background:var(--panel2);border:2px solid transparent;
      display:grid;place-items:center;
      font-family:"Archivo Black",Impact,sans-serif;font-size:15px;font-weight:900;color:var(--lime);
      transition:border-color .18s,box-shadow .18s;
      flex-shrink:0;
    }
    .avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
    .pick-btn.selected .avatar{
      border-color:var(--lime);
      box-shadow:0 0 0 3px rgba(183,255,0,.22);
    }
    .pick-btn .check{
      position:absolute;top:-2px;right:-2px;
      width:20px;height:20px;border-radius:50%;
      background:var(--lime);color:#050705;
      font-size:10px;font-weight:900;
      display:grid;place-items:center;
      opacity:0;transform:scale(.6);transition:opacity .15s,transform .15s;
    }
    .pick-btn.selected .check{opacity:1;transform:scale(1)}
    .pick-name{font-size:10px;font-weight:700;max-width:60px;text-align:center;line-height:1.2;color:rgba(244,247,240,.8)}

    /* Top3 position badges */
    .pick-btn .pos{
      position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);
      background:var(--lime);color:#050705;border-radius:8px;
      font-size:9px;font-weight:900;padding:1px 5px;
      opacity:0;transition:opacity .15s;
    }
    .pick-btn.selected .pos{opacity:1}

    /* ── CTA valider ── */
    .cta-wrap{margin-top:24px}
    .cta-btn{
      width:100%;padding:16px;border-radius:var(--radius);
      background:var(--lime);color:#050705;font-size:15px;font-weight:800;
      border:none;cursor:pointer;
      box-shadow:0 12px 28px rgba(183,255,0,.28);
      transition:transform .18s var(--ease),filter .18s,opacity .18s;
    }
    .cta-btn:not(:disabled):active{transform:scale(.98)}
    .cta-btn:not(:disabled):hover{filter:brightness(1.05)}
    .cta-btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
    .cta-note{margin-top:10px;text-align:center;font-size:12px;color:var(--muted);font-weight:600}

    /* ── Toast ── */
    .toast{
      position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;
      transform:translateX(-50%) translateY(10px);
      background:var(--panel);border:1px solid var(--line);border-radius:14px;
      padding:10px 18px;font-size:13px;font-weight:700;
      white-space:nowrap;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:50;
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    /* ── Saved state ── */
    .saved-banner{
      margin-top:14px;padding:14px 16px;border-radius:16px;
      background:rgba(183,255,0,.08);border:1px solid rgba(183,255,0,.3);
      font-size:13px;font-weight:700;color:var(--lime);text-align:center;
    }

    /* ── Loading skeleton ── */
    .skel{background:var(--panel2);border-radius:10px;animation:pulse 1.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    .rise{animation:rise .5s var(--ease) both}
    .rise-1{animation-delay:.08s}.rise-2{animation-delay:.16s}.rise-3{animation-delay:.24s}.rise-4{animation-delay:.32s}
  </style>
</head>
<body>
<div class="shell">

  <!-- Topbar -->
  <div class="topbar">
    <div class="brand-mark">
      <span class="word">PASS50</span>
      <span class="sub">Pronostics</span>
    </div>
    <div>
      <button class="btn primary" id="btnCompte" onclick="location.href='/?open=account'">Compte</button>
    </div>
  </div>

  <!-- Header -->
  <header class="page-header rise">
    <p class="kicker">Pronostics 24H</p>
    <h1>Ta grille du jour</h1>
    <div class="countdown-chip">
      ⏱ Clôture dans <span id="countdown">--:--:--</span>
    </div>
  </header>

  <!-- Solde -->
  <div class="score-row rise rise-1" id="scoreRow">
    <div>
      <div class="pts" id="pts">1 000</div>
      <div class="pts-label">Points</div>
    </div>
    <div class="streak">
      <div class="streak-num" id="streakNum">0</div>
      <div class="streak-label">Streak</div>
    </div>
  </div>

  <!-- Publications (questions ouvertes) -->
  <section class="pubs rise" id="pubsSection" style="margin-top:18px">
    <div class="card-head" style="margin-bottom:12px">
      <div>
        <h2 style="color:var(--lime);font-size:18px;margin:0">Qui fait quoi</h2>
        <p class="hint" style="margin:4px 0 0">Questions publiees · mise × cote · sans argent reel</p>
      </div>
      <span class="badge-up" id="pubsCount">0</span>
    </div>
    <div id="pubsList" class="muted">Chargement des publications…</div>
  </section>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="./mobile-bottom-nav-v1.js?v=1.6"></script>
<script>
(function(){
  const state = { points: 1000, streak: 0 };

  function updateCountdown(){
    const now = new Date();
    const end = new Date();
    end.setHours(23,59,59,999);
    const diff = Math.max(0, end - now);
    const h = String(Math.floor(diff/3600000)).padStart(2,'0');
    const m = String(Math.floor((diff%3600000)/60000)).padStart(2,'0');
    const s = String(Math.floor((diff%60000)/1000)).padStart(2,'0');
    const el = document.getElementById('countdown');
    if (el) el.textContent = `${h}:${m}:${s}`;
  }
  updateCountdown();
  setInterval(updateCountdown, 1000);

  function showToast(msg){
    const t = document.getElementById('toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2800);
  }

  async function loadBalance(){
    try {
      const r = await fetch('/api/prono-feed.php');
      const data = await r.json();
      const bal = data.balance;
      if (bal != null) {
        if (typeof bal === 'object') {
          const pts = Number(bal.balance);
          state.points = Number.isFinite(pts) ? pts : (Number(data.startingBalance) || 1000);
          state.streak = Number(bal.streak) || 0;
        } else {
          state.points = Number(bal) || 1000;
        }
      }
      document.getElementById('pts').textContent = Math.round(state.points).toLocaleString('fr-FR');
      document.getElementById('streakNum').textContent = state.streak;
    } catch(e){}
  }

  function escHtml(s){
    return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  }
  function fmtOdd(n){
    const v=Number(n);
    return Number.isFinite(v)?v.toFixed(2):'—';
  }
  function closesLabel(iso){
    if(!iso) return '';
    const ms=new Date(iso)-Date.now();
    if(ms<=0) return 'Votes clos';
    const h=Math.floor(ms/3600000);
    const m=Math.floor((ms%3600000)/60000);
    return `Votes clos dans ${h} h ${m} min`;
  }
  async function loadPublications(){
    const box=document.getElementById('pubsList');
    const countEl=document.getElementById('pubsCount');
    try{
      const headers={Accept:'application/json'};
      const token=localStorage.getItem('pass50_api_token')||'';
      if(token) headers.Authorization='Bearer '+token;
      const r=await fetch('/api/prono-feed.php',{headers});
      const data=await r.json();
      const items=Array.isArray(data.items)?data.items:[];
      if(countEl) countEl.textContent=items.length?`${items.length} prono(s)`:'0';
      if(!items.length){
        box.innerHTML='<p class="muted" style="margin:0">Aucune question ouverte pour le moment. Les publications admin (statut open) apparaissent ici.</p>';
        return;
      }
      const byTheme={};
      for(const item of items){
        const key=item.theme||'autre';
        (byTheme[key]=byTheme[key]||[]).push(item);
      }
      const order=['people_influenceurs','people_artiste_sportif','people_actualite'];
      const keys=[...order.filter(k=>byTheme[k]),...Object.keys(byTheme).filter(k=>!order.includes(k))];
      box.innerHTML=keys.map(themeKey=>{
        const rows=byTheme[themeKey];
        const label=rows[0]?.themeLabel||themeKey;
        return `<div style="margin-top:8px">
          <div class="pub-theme">${escHtml(label)}</div>
          ${rows.map(item=>{
            const mine=item.myVote?.optionKey||'';
            const opts=(item.options||[]).map(o=>{
              const selected=mine&&mine===o.key;
              return `<button type="button" class="pub-opt${selected?' mine':''}" data-qid="${escHtml(item.id)}" data-opt="${escHtml(o.key)}">
                <span>${escHtml(o.label)}</span>
                <span class="odd">${fmtOdd(o.odd)}</span>
              </button>`;
            }).join('');
            const cover=item.coverPhoto?`<img class="cover" src="${escHtml(item.coverPhoto)}" alt="" loading="lazy">`:'';
            return `<article class="pub-card">
              ${cover}
              <div class="pub-meta">${escHtml(closesLabel(item.closesAt))}</div>
              <h3>${escHtml(item.title||'')}</h3>
              ${item.context?`<div class="pub-meta">${escHtml(item.context)}</div>`:''}
              <div class="pub-opts">${opts}</div>
            </article>`;
          }).join('')}
        </div>`;
      }).join('');
    }catch(e){
      box.innerHTML='<p class="muted" style="margin:0;color:#f88">Impossible de charger les publications.</p>';
    }
  }
  document.getElementById('pubsList')?.addEventListener('click',async(e)=>{
    const btn=e.target.closest('[data-qid][data-opt]');
    if(!btn) return;
    const qid=btn.getAttribute('data-qid');
    const opt=btn.getAttribute('data-opt');
    const token=localStorage.getItem('pass50_api_token')||'';
    if(!token){
      showToast('Connecte-toi pour voter');
      return;
    }
    try{
      const r=await fetch('/api/prono-vote.php',{
        method:'POST',
        headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,Accept:'application/json'},
        body:JSON.stringify({questionId:qid,optionKey:opt}),
      });
      const d=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error||d.message||('HTTP '+r.status));
      showToast('Prono enregistre');
      loadPublications();
      loadBalance();
    }catch(err){
      showToast(err.message||'Vote impossible');
    }
  });

  loadBalance();
  loadPublications();
})();
</script>
</body>
</html>
