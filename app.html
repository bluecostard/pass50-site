<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050705" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="PASS50 — classement, fil, lives et compte sur mobile." />
  <link rel="manifest" href="./manifest.webmanifest?v=24.0" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg?v=22.4" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=22.4" />
  <title>PASS50</title>
  <style>
    :root{
      color-scheme:dark;
      --bg:#050705;
      --panel:#0d110d;
      --line:#293129;
      --text:#f6f8f4;
      --muted:#9da79b;
      --lime:#b7ff00;
      --red:#ff4b4b;
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --safe-top:env(safe-area-inset-top,0px);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
    body{
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        radial-gradient(900px 420px at 50% -8%, rgba(183,255,0,.14), transparent 55%),
        linear-gradient(180deg,#0a100a 0%, var(--bg) 42%);
      padding:calc(12px + var(--safe-top)) 14px calc(96px + var(--safe-bottom));
    }
    .top{
      display:flex;align-items:end;justify-content:space-between;gap:12px;
      margin-bottom:14px;
    }
    .brand{
      margin:0;font-size:clamp(34px,9vw,46px);font-weight:1000;letter-spacing:-2.4px;line-height:1;
    }
    .brand span{color:var(--lime)}
    .status{font-size:11px;color:var(--muted);font-weight:800;text-align:right;max-width:52%}
    .hero-block{margin:8px 0 14px}
    .eyebrow{margin:0;color:var(--lime);font-size:11px;font-weight:1000;letter-spacing:.8px;text-transform:uppercase}
    .hero-block h2{margin:6px 0 6px;font-size:clamp(28px,7vw,38px);letter-spacing:-1.6px;line-height:1}
    .lede,.muted{margin:0;color:var(--muted);line-height:1.45;font-size:13px}
    .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
    .chips::-webkit-scrollbar{display:none}
    .chip,.btn{
      border:1px solid var(--line);background:#0a0d0a;color:var(--text);
      border-radius:999px;padding:9px 13px;font:inherit;font-weight:900;cursor:pointer;
    }
    .chip.active,.btn{background:var(--lime);border-color:var(--lime);color:#050705}
    .btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
    .btn.danger{background:transparent;color:#ffb4b4;border-color:#6f2b2b}
    .btn.small{padding:8px 11px;font-size:12px;border-radius:12px}
    .panel{
      border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:14px;
    }
    .panel.stack{display:grid;gap:10px}
    .panel.list{padding:4px}
    .rank-row{
      display:grid;grid-template-columns:34px 46px minmax(0,1fr) auto;gap:10px;align-items:center;
      padding:11px 10px;text-decoration:none;color:inherit;border-bottom:1px solid rgba(41,49,41,.85);
    }
    .rank-row:last-child{border-bottom:0}
    .rank-pos{font-weight:1000;color:var(--lime);text-align:center}
    .avatar{
      width:46px;height:46px;border-radius:14px;overflow:hidden;display:grid;place-items:center;
      background:linear-gradient(145deg,#263026,#0b0e0b);font-weight:1000;
    }
    .avatar img{width:100%;height:100%;object-fit:cover}
    .avatar.fallback{font-size:12px;color:#d7dfd4}
    .rank-meta strong,.card-body h3,.live-card strong{display:block}
    .rank-meta span,.card-kicker,.live-card span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
    .rank-score{text-align:right}
    .rank-score b{display:block;font-size:15px}
    .delta{font-size:11px;font-weight:900}
    .delta.up{color:var(--lime)}.delta.down{color:var(--red)}.delta.flat{color:#c5cdc2}
    .feed-list,.live-list{display:grid;gap:12px}
    .feed-card,.live-card{
      border:1px solid var(--line);border-radius:18px;background:var(--panel);overflow:hidden;
    }
    .card-media img{display:block;width:100%;height:180px;object-fit:cover;object-position:center 18%}
    .card-body{padding:14px}
    .card-body h3{margin:0 0 12px;font-size:17px;line-height:1.3}
    .badge{
      display:inline-block;margin-left:6px;padding:2px 7px;border-radius:999px;
      border:1px solid rgba(183,255,0,.35);color:var(--lime);font-size:9px;font-weight:1000;
    }
    .live-card{
      display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px;
    }
    .live-dot{
      width:10px;height:10px;border-radius:50%;background:var(--red);
      box-shadow:0 0 0 4px rgba(255,75,75,.15);animation:pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
    @media (prefers-reduced-motion:reduce){.live-dot{animation:none}}
    label{display:grid;gap:6px;font-size:12px;font-weight:800;color:var(--muted)}
    input{
      width:100%;border:1px solid var(--line);border-radius:12px;background:#090c09;
      color:var(--text);padding:12px 13px;font:inherit;
    }
    .error{color:#ffb4b4;margin:0}
    .foot-link{margin:14px 2px 0;font-size:12px}
    .foot-link a{color:var(--lime)}
    .nav{
      position:fixed;left:50%;bottom:calc(10px + var(--safe-bottom));transform:translateX(-50%);
      width:min(420px,calc(100vw - 16px));display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
      padding:8px;border:1px solid rgba(183,255,0,.22);border-radius:22px;
      background:linear-gradient(180deg,rgba(16,21,16,.98),rgba(6,9,6,.99));
      box-shadow:0 14px 42px rgba(0,0,0,.5);z-index:40;
    }
    .nav button{
      border:0;background:transparent;color:#98a295;border-radius:16px;padding:10px 4px;
      font:inherit;font-size:10px;font-weight:950;display:grid;gap:4px;justify-items:center;cursor:pointer;
    }
    .nav button.active{color:var(--lime);background:rgba(183,255,0,.08)}
    .nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
    .toast{
      position:fixed;left:50%;bottom:calc(92px + var(--safe-bottom));transform:translateX(-50%) translateY(12px);
      opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;
      background:#121812;border:1px solid var(--line);color:var(--text);padding:10px 14px;border-radius:14px;
      font-size:12px;font-weight:800;z-index:50;
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  </style>
</head>
<body data-tab="ranking">
  <header class="top">
    <h1 class="brand" id="appBrand">PASS<span>50</span></h1>
    <div class="status" id="appStatus">Chargement…</div>
  </header>

  <main id="appContent" aria-live="polite"></main>

  <nav class="nav" id="appNav" aria-label="Navigation app PASS50">
    <button type="button" data-tab="ranking" class="active">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V10"/><path d="M10 19V5"/><path d="M16 19v-7"/><path d="M22 19H2"/></svg>
      Classement
    </button>
    <button type="button" data-tab="feed">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/></svg>
      Fil
    </button>
    <button type="button" data-tab="live">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M5 12a7 7 0 0 1 14 0"/><path d="M2 12a10 10 0 0 1 20 0"/></svg>
      Live
    </button>
    <button type="button" data-tab="account">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 19a7 7 0 0 1 14 0"/></svg>
      Compte
    </button>
  </nav>

  <div class="toast" id="appToast" role="status"></div>
  <script src="./pass50-auth-session.js?v=1.0"></script>
  <script src="./app-client.js?v=1.1"></script>
</body>
</html>
